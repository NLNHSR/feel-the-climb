<!doctype html>
<!--
  Sound design — Living Tree
  Music: warm, organic, hopeful. Plucked nylon guitar and marimba over soft string swells and a
  low cello drone; no drums at rest, light hand percussion (shaker, frame drum) as intensity rises.
  Key of D major, ~84 bpm. Intensity 0 = morning stillness, 1 = full bloom.
  Events (score.sfx):
    hover    — a soft leaf rustle (dry, very short, quiet)
    select   — a single wooden marimba note
    back     — the same marimba note a fourth lower, softer
    zoomIn   — a gentle breath of wind rising through leaves (~0.4s)
    zoomOut  — the same breath falling away (~0.4s)
    start    — a bud swelling: a short airy pluck that leans upward
    complete — a blossom pop (a soft “puh” of petals) followed by an airy chime
    unlock   — a small bright kalimba note, like a new bud appearing
    intro    — a warm full-chord bloom (strings + marimba) as the canopy completes
    riser    — a slow rising string swell with growing leaf rustle (~2.8s)
    step     — a tiny marimba/kalimba tick per leaf popping in, pitched slightly higher each time
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Living Tree</title>
<link rel="stylesheet" href="../shared/dolphin.css">
<style>
  html, body { overflow: hidden; background: #CFEFFF; color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #bg, #blur { pointer-events: none; }
  /* Out-of-focus branches: soft and quiet, never louder than the branch you're looking at. */
  #blur { filter: blur(2.5px) saturate(0.75); }
  #crisp { touch-action: none; }

  /* One compact status pill (top-left). 8px rhythm; 20 / 14 / 12 type. */
  .hud { position: fixed; top: 16px; left: 16px; z-index: 20; pointer-events: none; }
  .hud-panel {
    display: flex; align-items: baseline; gap: 16px; padding: 8px 16px;
    background: var(--foam); border: 2px solid var(--mist); border-radius: 999px; box-shadow: 0 3px 0 var(--chrome-shadow);
  }
  .hud .count { font-family: var(--font-head); font-size: 20px; line-height: 24px; white-space: nowrap; color: var(--ink); }
  .hud .count b { font-weight: normal; color: var(--success); }
  .hud .proj { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .hud .proj b { color: var(--ink); font-weight: 800; }

  /* One short hint, shown once. */
  .hint {
    position: fixed; top: 16px; left: 50%; transform: translate(-50%, -4px); z-index: 20; pointer-events: none; white-space: nowrap;
    font-size: 14px; font-weight: 700; line-height: 20px; color: var(--ink); padding: 8px 16px;
    background: var(--foam); border: 2px solid var(--mist); border-radius: 999px;
    opacity: 0; transition: opacity 400ms cubic-bezier(.2,.8,.2,1), transform 400ms cubic-bezier(.2,.8,.2,1);
  }
  .hint.show { opacity: 1; transform: translate(-50%, 0); }
  .skip {
    position: fixed; top: 16px; right: 16px; z-index: 21; height: 40px; padding: 0 16px; border-radius: 999px;
    font: 800 14px/1 var(--font-body); color: var(--ink); background: var(--foam); border: 2px solid var(--mist);
    box-shadow: 0 3px 0 var(--chrome-shadow); cursor: pointer;
  }
  .skip:active { transform: translateY(3px); box-shadow: none; }
  .skip[hidden] { display: none; }

  .tip {
    position: fixed; left: 0; top: 0; pointer-events: none; z-index: 30; max-width: 240px;
    background: var(--foam); color: var(--ink); border: 2px solid var(--mist); border-radius: 16px;
    padding: 8px 12px; box-shadow: 0 3px 0 var(--chrome-shadow);
    opacity: 0; transition: opacity 90ms ease-out;
  }
  .tip.show { opacity: 1; }
  body.card-open .kg-caption { left: calc((100vw - 392px) / 2); max-width: min(640px, calc(100vw - 440px)); }
  .tip .k { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; font-weight: 700; color: var(--muted); }
  .tip .k i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .tip b { display: block; font-weight: 800; font-size: 14px; line-height: 20px; }
  .tip small { display: block; font-weight: 700; font-size: 12px; line-height: 16px; }
  .tip small.mastered { color: #2E8A55; }
  .tip small.frontier { color: #8A6D00; }
  .tip small.locked { color: var(--muted); }

  @media (max-width: 640px) {
    .hud { top: 12px; left: 12px; }
    .hud-panel { gap: 8px; padding: 8px 16px; }
    .hud .count { font-size: 18px; }
    .hint { top: 64px; }
    .skip { top: auto; bottom: 72px; right: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tip, .hint { transition: none; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="blur" aria-hidden="true"></canvas>
<canvas id="crisp" role="img" aria-label="Your SAT knowledge tree. The trunk is the SAT, five limbs are the domains, branches are topics and every leaf is a lesson. Move the pointer toward a limb to look closer; Escape steps back."></canvas>

<header class="hud">
  <div class="hud-panel" aria-live="polite"><span class="count"><b id="hudCount">0</b> of <span id="hudTotal">89</span> leaves</span><span class="proj">Projected <b id="hudScore">400</b></span></div>
</header>
<div class="hint" id="hint">Move toward any branch to look closer.</div>
<button class="skip" id="skip" hidden>Skip intro</button>
<div class="tip" id="tip"></div>

<script type="module">
import { createGraph, DOMAIN_HUES, pct, clamp, projectedScore } from '../shared/graph.js';
import { mountChrome } from '../shared/chrome.js';
import { createLessonCard } from '../shared/lesson-card.js';

// ───────────────────────── Basics ─────────────────────────
const Q = new URLSearchParams(location.search);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches || Q.has('still');
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeBack = (t) => { const c = 1.7; const u = t - 1; return 1 + (c + 1) * u * u * u + c * u * u; };
const prog = (t, a, d) => clamp((t - a) / d, 0, 1);
function mulberry32(a) {
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const hexRgb = (c) => { const v = parseInt(c.slice(1), 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; };
const mix = (a, b, t) => { const A = hexRgb(a), B = hexRgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };

const C = {
  ink: '#0A234F', muted: '#536A86', foam: '#FFFFFC', mist: '#D9E4F2', paper: '#F0F2F5', sky: '#CFEFFF',
  wave3: '#2F9AE6', waveShadow: '#1E6FBE', sun: '#FFF44E', sunShadow: '#E8BE00', success: '#3FA669',
};
const BARK = { dark: '#4A3424', base: '#6E4D37', light: '#93694C', hi: '#B08463' };
const PALE = { dark: '#ADA196', base: '#C3B8AE', light: '#D6CDC4', hi: '#E3DCD5' };
const BODY = '"Manrope", system-ui, sans-serif';
// Two canvas type styles (plus the 20px HUD count): names and secondary lines.
const F_NAME = `800 14px ${BODY}`, F_SUB = `700 12px ${BODY}`, F_SMALL = `800 12px ${BODY}`;
const LH_NAME = 18, LH_SUB = 16, LH_SMALL = 15;

const ROOTS_LINE = 'Roots first. Everything up there stands on this.';

// ───────────────────────── Graph + chrome ─────────────────────────
const graph = createGraph();
const { root, nodes, domains, leaves } = graph;
const { score, caption } = mountChrome({
  id: 'living-tree',
  eyebrow: 'Your SAT knowledge graph',
  title: 'Living Tree',
  tagline: 'Everything you have learned, grown into one tree.',
  gateBackground: 'radial-gradient(120% 80% at 50% 108%, #3FA669 0%, #1E6FBE 34%, #103B84 64%, #0A2B64 100%)',
  beginLabel: 'Grow my tree',
  onBegin: (o) => startIntro(o),
});
const card = createLessonCard(graph, {
  score, caption: () => {},          // the card's own pep line is replaced by one plain line below
  onComplete: (evt) => onLessonComplete(evt),
  onOpen: () => { pending = null; },
  onClose: () => { pointer.travel = 0; },
});
const sfxLog = [];
const sfx = (name, o) => { sfxLog.push([Math.round(performance.now()), name]); if (sfxLog.length > 120) sfxLog.shift(); score.sfx?.(name, o); };

// ───────────────────────── Shapes ─────────────────────────
const LEAF = new Path2D(); LEAF.moveTo(0, 0); LEAF.bezierCurveTo(0.25, -0.42, 0.7, -0.36, 1, 0); LEAF.bezierCurveTo(0.7, 0.3, 0.25, 0.36, 0, 0);
const LEAF_HI = new Path2D(); LEAF_HI.moveTo(0.06, -0.02); LEAF_HI.bezierCurveTo(0.27, -0.38, 0.68, -0.33, 0.97, -0.01); LEAF_HI.bezierCurveTo(0.6, -0.08, 0.3, -0.06, 0.06, -0.02);
const BLOSSOM = new Path2D();
for (let k = 0; k < 5; k++) { const a = (k / 5) * TAU - Math.PI / 2; BLOSSOM.ellipse(Math.cos(a) * 0.52, Math.sin(a) * 0.52, 0.56, 0.44, a, 0, TAU); BLOSSOM.closePath(); }
const BUD = new Path2D(); BUD.moveTo(0, -0.42); BUD.bezierCurveTo(0.42, -0.46, 0.86, -0.22, 1.08, 0); BUD.bezierCurveTo(0.86, 0.22, 0.42, 0.46, 0, 0.42); BUD.bezierCurveTo(-0.14, 0.2, -0.14, -0.2, 0, -0.42);
const BUD_SEAM = new Path2D(); BUD_SEAM.moveTo(0.1, 0.02); BUD_SEAM.bezierCurveTo(0.45, 0.08, 0.8, 0.04, 1.02, 0);
const CIRCLE = new Path2D(); CIRCLE.arc(0, 0, 1, 0, TAU);

// ───────────────────────── Tree layout ─────────────────────────
// The crown is laid out in polar slots around the top of the trunk, then squashed to the screen's
// shape (tall on phones, wide on desktops) so the whole tree fills the frame without clipping.
let TRUNK_H = 300, KX = 1, KY = 1, SHAPE = '';
const O = { x: 0, y: -292 };                   // crown origin (top of the trunk)
const SPREAD = 122 * DEG;                      // canopy wraps ±122° around the crown origin
const DOMAIN_GAP = 0.75;                       // gap between limbs, in spine slots
const R = { limb: 168, spine0: 252, step: 19, rung: 22 };
const LEAF_R = 16;                             // world radius of a leaf cluster
function shapeFor(w, h) { const r = w / h; return r < 0.85 ? 'tall' : r > 1.45 ? 'wide' : 'square'; }
function setShape(s) {
  SHAPE = s;
  [KX, KY, TRUNK_H] = s === 'tall' ? [0.66, 1.18, 360] : s === 'wide' ? [1.1, 0.92, 290] : [1, 1, 300];
  O.y = -(TRUNK_H - 8);
}

const P2 = (x, y) => ({ x, y });
const add = (a, b) => P2(a.x + b.x, a.y + b.y);
const sub = (a, b) => P2(a.x - b.x, a.y - b.y);
const mul = (a, k) => P2(a.x * k, a.y * k);
const vlen = (a) => Math.hypot(a.x, a.y);
const norm = (a) => { const l = vlen(a) || 1; return P2(a.x / l, a.y / l); };
const rot = (a, t) => { const c = Math.cos(t), s = Math.sin(t); return P2(a.x * c - a.y * s, a.x * s + a.y * c); };
const lerpV = (a, b, t) => P2(lerp(a.x, b.x, t), lerp(a.y, b.y, t));
const dirOf = (ang) => norm(P2(Math.sin(ang) * KX, -Math.cos(ang) * KY));   // 0 = up, + = clockwise
const polar = (ang, r) => P2(O.x + Math.sin(ang) * r * KX, O.y - Math.cos(ang) * r * KY);
function bez(P, t) {
  const u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
  return P2(a * P[0].x + b * P[1].x + c * P[2].x + d * P[3].x, a * P[0].y + b * P[1].y + c * P[2].y + d * P[3].y);
}
function bezT(P, t) {
  const u = 1 - t;
  const x = 3 * u * u * (P[1].x - P[0].x) + 6 * u * t * (P[2].x - P[1].x) + 3 * t * t * (P[3].x - P[2].x);
  const y = 3 * u * u * (P[1].y - P[0].y) + 6 * u * t * (P[2].y - P[1].y) + 3 * t * t * (P[3].y - P[2].y);
  return norm(P2(x, y));
}
function sampleCurve(P, N) {
  const pts = []; let acc = 0, prev = null;
  for (let i = 0; i <= N; i++) {
    const t = i / N, p = bez(P, t);
    if (prev) acc += Math.hypot(p.x - prev.x, p.y - prev.y);
    pts.push({ x: p.x, y: p.y, t, s: acc }); prev = p;
  }
  return pts;
}
function atArc(pts, s) {
  for (let i = 1; i < pts.length; i++) {
    if (pts[i].s >= s) {
      const a = pts[i - 1], b = pts[i], f = (s - a.s) / Math.max(1e-6, b.s - a.s);
      return { x: lerp(a.x, b.x, f), y: lerp(a.y, b.y, f), t: lerp(a.t, b.t, f), tan: norm(P2(b.x - a.x, b.y - a.y)) };
    }
  }
  const a = pts[pts.length - 2], b = pts[pts.length - 1];
  return { x: b.x, y: b.y, t: 1, tan: norm(P2(b.x - a.x, b.y - a.y)) };
}

const isSpine = (n) => n.children.length > 0 && n.children.every((c) => !c.children.length);
const spineCount = (n) => (isSpine(n) ? 1 : n.children.reduce((a, c) => a + spineCount(c), 0));
const leafWeight = (l) => (l.state === 'mastered' ? 1 : l.state === 'frontier' ? 0.7 : 0.3);
const subWeight = (n) => (n.children.length ? n.children.reduce((a, c) => a + subWeight(c), 0) : leafWeight(n));
const isAlive = (n) => (n.children.length ? n.masteredCount > 0 || n.frontier > 0 : n.state !== 'locked');
const lessonsOf = (n) => (n.children.length ? n.children.flatMap(lessonsOf) : [n]);
const PAL = {};
for (const d of domains) {
  const h = DOMAIN_HUES[d.label];
  PAL[d.label] = { hue: h, leaves: [mix(h, C.ink, 0.3), mix(h, C.ink, 0.12), h, mix(h, C.foam, 0.16)], hi: mix(h, C.foam, 0.38), petal: mix(h, C.foam, 0.52), petalEdge: mix(h, C.foam, 0.2) };
}

const order = [...nodes].sort((a, b) => a.depth - b.depth);   // parents before children
for (const n of nodes) {
  n.v = { vis: 1, sharp: 1, tVis: 1, tSharp: 1, prox: 0, tProx: 0, hl: 0, fT: n === root ? 1 : 0, damp: 1, grads: new WeakMap(), M: [1, 0, 0, 1, 0, 0] };
}
const ROOTS = { id: 'roots', isRoots: true, label: 'Roots', parent: root, children: [], depth: 1, v: { vis: 1, sharp: 1, prox: 0, tProx: 0, fT: 0 } };

// Center-out order: the last (most advanced) topic continues the limb in the middle; earlier ones
// fork lower on the limb and sweep to the edges. Foundations sit lowest; the crown is advanced work.
function centerOut(list, outerRight) {
  const out = [];
  for (let k = list.length - 1, i = 0; k >= 0; k--, i++) { if (i % 2) out.unshift(list[k]); else out.push(list[k]); }
  return outerRight ? out : out.reverse();
}
// Slot u (in spine units) → crown angle, spacing spines evenly in the squashed crown.
function slotMapper(units) {
  const N = 480, lat = (a) => Math.hypot(Math.cos(a) * KX, Math.sin(a) * KY);
  const run = (c) => { const A = [-SPREAD]; let a = -SPREAD; for (let i = 0; i < N; i++) { a += (c / lat(a)) * (units / N); A.push(a); } return A; };
  let lo = 0.001, hi = 1, A = null;
  for (let it = 0; it < 40; it++) { const mid = (lo + hi) / 2; A = run(mid); if (A[N] > SPREAD) hi = mid; else lo = mid; }
  A = run(lo);
  return (u) => { const f = clamp(u / units, 0, 1) * N, i = Math.min(N - 1, Math.floor(f)); return lerp(A[i], A[i + 1], f - i); };
}

function layout() {
  const rr = mulberry32(20261121);
  const units = domains.reduce((a, d) => a + spineCount(d), 0) + DOMAIN_GAP * (domains.length - 1);
  const angleAt = slotMapper(units);
  const tb = root.v;
  tb.P = [P2(0, 0), P2(14, -TRUNK_H * 0.36), P2(-16, -TRUNK_H * 0.7), P2(0, -TRUNK_H)];
  let cu = 0;
  for (const d of domains) {
    const sc = spineCount(d);
    d.v.u0 = cu; d.v.a0 = angleAt(cu); d.v.a1 = angleAt(cu + sc); d.v.ac = angleAt(cu + sc / 2);
    cu += sc + DOMAIN_GAP;
  }
  domains.forEach((d) => {
    const b = d.v, ac = b.ac, outer = Math.abs(ac) / SPREAD;
    b.attachU = 0.97 - 0.17 * outer;
    const A = bez(tb.P, b.attachU);
    const E = polar(ac, R.limb * (1 - 0.06 * outer));
    const d0 = dirOf(ac * 0.42), d1 = dirOf(ac);
    const L = vlen(sub(E, A));
    b.P = [A, add(A, mul(d0, L * 0.45)), sub(E, mul(d1, L * 0.3)), E];
    const n = d.children.length;
    let c = b.u0;
    for (const t of centerOut(d.children, ac > 0)) {
      const s = spineCount(t);
      t.v.u0 = c; t.v.ac = angleAt(c + s / 2); c += s;
    }
    d.children.forEach((t, k) => {
      const u = n > 1 ? 0.3 + (0.7 * k) / (n - 1) : 1;
      t.v.attachU = u;
      const F = bez(b.P, u), tF = bezT(b.P, u);
      const rs = R.spine0 + k * R.step + (rr() - 0.5) * 10;
      if (isSpine(t)) placeSpine(t, F, tF, t.v.ac, rs, rr);
      else {
        const SF = polar(t.v.ac, rs - 34);
        const dFS = vlen(sub(SF, F));
        const em = norm(lerpV(tF, norm(sub(SF, F)), 0.62));
        t.v.P = [F, add(F, mul(em, dFS * 0.38)), sub(SF, mul(dirOf(t.v.ac), dFS * 0.3)), SF];
        const subs = ac > 0 ? [...t.children] : [...t.children].reverse();
        subs.forEach((s, j) => { s.v.ac = angleAt(t.v.u0 + j + 0.5); });
        t.children.forEach((s, j) => { s.v.attachU = 1; placeSpine(s, SF, dirOf(t.v.ac), s.v.ac, rs + 10 + j * 9, rr); });
      }
    });
  });
  for (const n of nodes) n.v.B = n.v.P[0];
}

function placeSpine(sp, F, tF, ang, rs, rr) {
  const m = sp.children.length;
  const spineLen = 14 + (m - 1) * R.rung;
  const S = polar(ang, rs), T = polar(ang * 0.93, rs + spineLen);
  const dFS = vlen(sub(S, F));
  const em = rot(norm(lerpV(tF, norm(sub(S, F)), 0.58)), (rr() - 0.5) * 0.25);
  const bend = rot(dirOf(ang), (rr() < 0.5 ? -1 : 1) * (0.12 + rr() * 0.14));
  sp.v.P = [F, add(F, mul(em, dFS * 0.4)), sub(T, mul(bend, spineLen * 0.85 + dFS * 0.28)), T];
  const pts = sampleCurve(sp.v.P, 48), Ltot = pts[pts.length - 1].s;
  sp.children.forEach((l, j) => {
    const back = (m - 1 - j) * R.rung;
    const at = atArc(pts, Ltot - back);
    const v = l.v;
    v.attachU = at.t;
    const side = j === m - 1 ? 0 : ((m - 1 - j) % 2 ? 1 : -1);
    v.side = side;
    const dir = side ? rot(at.tan, side * 44 * DEG) : at.tan;
    const tl = side ? 17 + rr() * 3 : 12;
    const A = P2(at.x, at.y);
    const endDir = side ? rot(dir, -side * 16 * DEG) : dir;
    const T2 = add(A, mul(norm(add(dir, endDir)), tl));
    v.P = [A, add(A, mul(dir, tl * 0.42)), sub(T2, mul(endDir, tl * 0.32)), T2];
    v.tip = T2; v.tipA = Math.atan2(endDir.y, endDir.x);
    // Label direction: away from the spine on the twig's side (or straight out for the tip bud).
    v.lblDir = side ? norm(rot(at.tan, side * 90 * DEG)) : at.tan;
    v.cluster = [-1.3, -0.62, 0.02, 0.66, 1.32].map((a, i) => ({
      a: a + (rr() - 0.5) * 0.3, len: (i === 2 ? 17 : 14.5) + rr() * 4, wid: 11 + rr() * 2.5, shade: Math.floor(rr() * 3.99), lift: i === 2 ? 1.2 : 0,
    }));
    v.blRot = rr() * TAU; v.budTilt = (rr() - 0.5) * 0.3; v.ph = rr() * TAU;
  });
}

// Widths follow a pipe model: a branch is as thick as the life it carries.
function computeWidths() {
  const WK = 5.7, WS = 4.1;
  for (const n of nodes) {
    const v = n.v, wt = subWeight(n), alive = isAlive(n);
    v.alive = alive;
    if (n === root) { v.w0 = WK * Math.sqrt(wt) * 1.05; v.w1 = v.w0 * 0.42; v.flare = 22; }
    else if (n.depth === 1) { v.w0 = WK * Math.sqrt(wt) * 0.92; v.w1 = WS * Math.sqrt(subWeight(n.children[n.children.length - 1])) * 1.05; v.flare = 0; }
    else if (!n.children.length) { v.w0 = n.state === 'mastered' ? 2.5 : n.state === 'frontier' ? 2.2 : 1.4; v.w1 = n.state === 'locked' ? 0.6 : 1.0; }
    else if (isSpine(n)) { v.w0 = WS * Math.sqrt(wt) * (alive ? 1 : 0.72); v.w1 = alive ? 1.2 : 0.8; }
    else { v.w0 = WS * Math.sqrt(wt); v.w1 = WS * Math.sqrt(wt) * 0.78; }
    v.collar = n.depth === 1 ? 0.14 : n.depth <= 3 && n.depth >= 2 ? 0.2 : 0;
    // The trunk, limbs and topic forks hand off to the branches that continue them: no end caps.

// The only glow on screen: ready buds (what you can click).

  else {

let blurUsed = false, blurShown = true;
function draw(now) {

  if (blurUsed || blurShown) { bx.setTransform(1, 0, 0, 1, 0, 0); bx.clearRect(0, 0, blurC.width, blurC.height); }
  blurUsed = false;
  const cmC = camMatrix(DPR), cmB = camMatrix(BLUR_RES);

  for (const n of order) {
    const v = n.v;

    if (v.sharp > 0.01) drawBranch(cx, cmC, v, v.vis * v.sharp);

// ───────────────────────── HUD + tooltip ─────────────────────────
const $ = (id) => document.getElementById(id);
const hintEl = $('hint'), tipEl = $('tip'), skipEl = $('skip'), hudEl = document.querySelector('.hud-panel');
const hud = { count: 0, anim: null };
function hudTargets(count) {
  const st = graph.stats(), frac = st.mastered ? count / st.mastered : 1;
  return { count, score: projectedScore(st.mastery * frac), total: st.total };
}
function renderHud(v) {
  $('hudCount').textContent = String(Math.round(v.count));
  $('hudTotal').textContent = String(v.total);
  $('hudScore').textContent = String(Math.round(v.score / 10) * 10);
}
function tweenHud(from, to, ms) { hud.anim = { from, to, t0: performance.now(), ms }; }
function stepHud(now) {
  if (!hud.anim) return;
  const { from, to, t0, ms } = hud.anim, e = easeOut(clamp((now - t0) / ms, 0, 1));
  renderHud({ count: lerp(from.count, to.count, e), score: lerp(from.score, to.score, e), total: to.total });
  if (e >= 1) hud.anim = null;
}

let hintState = 0; // 0 = not shown yet, 1 = showing, 2 = done for good
function showHint() { if (hintState) return; hintState = 1; hintEl.classList.add('show'); setTimeout(hideHint, 4000); }
function hideHint() { if (hintState === 2) return; if (hintState === 1) hintEl.classList.remove('show'); hintState = hintState ? 2 : 0; }

let tipNode = null;
function updateTip() {
  if (hoverLeaf !== tipNode) {
    tipNode = hoverLeaf;
    if (tipNode) {
      const l = tipNode;
      const status = l.state === 'mastered' ? lessonSub(l) : l.state === 'frontier' ? (l.progress > 0 ? `${pct(l.progress)} done · click to continue` : 'Ready · click to grow it') : graph.blockerText(l);
      tipEl.innerHTML = '<div class="k"><i></i><span></span></div><b></b><small></small>';
      tipEl.querySelector('.k i').style.background = PAL[l.domain.label].hue;
      tipEl.querySelector('.k span').textContent = `${l.domain.label} · ${l.parent.label}`;
      tipEl.querySelector('b').textContent = l.label;
      const sm = tipEl.querySelector('small'); sm.textContent = status; sm.className = l.state;
    }
    tipEl.classList.toggle('show', !!tipNode);
  }
  if (tipNode) {
    // Beside the leaf (not under the cursor); flips to stay on screen and clear of the dock.
    const s = tipNode.v.scr, w = tipEl.offsetWidth, h = tipEl.offsetHeight, gap = Math.max(12, s.r + 8);
    const cands = [[s.x + gap, s.y - h / 2], [s.x - gap - w, s.y - h / 2], [s.x - w / 2, s.y - gap - h], [s.x - w / 2, s.y + gap]];
    const fits = ([x, y]) => x >= 8 && y >= 8 && x + w <= W - 8 && y + h <= H - 8;
    const clear = ([x, y]) => !placed.some((b) => x < b[2] && x + w > b[0] && y < b[3] && y + h > b[1]);
    let [x, y] = cands.find((c) => fits(c) && clear(c)) || cands.find(fits) || cands[0];
    x = clamp(x, 8, W - w - 8); y = clamp(y, 8, H - h - 8);
    tipEl.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
  }
}

// ───────────────────────── Completion ─────────────────────────
function onLessonComplete(evt) {
  if (!evt) return;
  const { lesson, unlocked } = evt;
  const before = hudTargets(hud.count);
  computeWidths();
  for (const n of nodes) { buildBranchPath(n.v, n === root ? 40 : n.depth === 1 ? 30 : !n.children.length ? 8 : 22); if (!n.children.length) n.v.tipL = sub(n.v.tip, n.v.B); buildFoliage(n); }
  const rr = mulberry32(31); for (const n of nodes) if (n.depth <= 1) buildGrain(n.v, n === root ? 9 : 4, rr);
  buildRoots();
  stateVersion++; measured.clear();
  lesson.v.bloomAt = time; lesson.v.budAt = null;
  // The bud bursts into a blossom (the card plays the 'complete' sound right now).
  for (let i = 0; i < (reduceMotion ? 0 : 10); i++) spawnPetal(lesson, true);
  rings.push({ l: lesson, r0: 6, r1: 36, col: PAL[lesson.domain.label].hue, life: 0, max: 0.8 });
  unlocked.forEach((l, i) => {
    const delay = 0.7 + i * 0.2;
    l.v.budAt = time + delay;
    setTimeout(() => { rings.push({ l, r0: 4, r1: 28, col: C.sunShadow, life: 0, max: 0.8 }); sfx('unlock'); }, delay * 1000);
  });
  hud.count = graph.stats().mastered;
  tweenHud(before, hudTargets(hud.count), 900);
  setI(0.85, 0.6);
  setTimeout(() => setI(0.42 + 0.07 * Math.min(3, focus.depth || 0), 4), 2400);
  if (!(card.lesson && W < 900)) caption(`${lesson.label} is grown.`, 3200);
}

// ───────────────────────── Intro ─────────────────────────
const EVENTS = [
  { t: 0.05, fn: () => setI(0.12, 0.6) },
  { t: 1.25, fn: () => setI(0.32, 1.6) },
  { t: 2.75, fn: () => setI(0.58, 1.6) },
  { t: 4.15, fn: () => { setI(0.95, 2.7); sfx('riser'); } },
  { t: INTRO_END, fn: () => {
    sfx('intro'); setI(0.45, 6); breathAt = time;
    caption(`${graph.stats().mastered} leaves. Every one grown by you.`, 3800);
  } },
];
let lastTickCount = 0;
function startIntro() {
  if (begun) return;
  begun = true;
  introStart = performance.now() - (reduceMotion ? Math.max(T_SKIP, INTRO_END - 0.02) : T_SKIP) * 1000;
  introSkipped = reduceMotion || T_SKIP >= INTRO_END;
  if (T_SKIP > 0 || reduceMotion) for (const e of EVENTS) if (e.t < (reduceMotion && T_SKIP < INTRO_END ? INTRO_END - 0.01 : T_SKIP)) e.done = true;
  for (const l of leaves) if (l.v.popT < (reduceMotion ? 99 : T_SKIP)) l.v.stepped = true;
  if (introSkipped) setI(0.45, 0.5);
  skipEl.hidden = introSkipped;
}
function skipIntro() {
  if (introDone) return;
  introStart = performance.now() - (INTRO_END - 0.05) * 1000;
  for (const e of EVENTS) if (e.t < INTRO_END - 0.1) e.done = true;
  for (const l of leaves) l.v.stepped = true;
}
skipEl.addEventListener('click', skipIntro);
function stepIntro(now) {
  if (!begun) { introT = 0; return; }
  introT = (now - introStart) / 1000;
  for (const e of EVENTS) if (!e.done && introT >= e.t) { e.done = true; e.fn(); }
  if (!introDone && introT >= INTRO_END + 0.35) {
    introDone = true; skipEl.hidden = true;
    if (!Q.get('demo') && !Q.has('mx')) showHint();
    hud.count = graph.stats().mastered;
    renderHud(hudTargets(hud.count));
    runDemo();
  }
  if (!introDone) {
    // Each leaf pops in with its own little 'step'; the counter follows.
    let c = 0;
    for (const l of leaves) {
      if (l.state !== 'mastered' || introT < l.v.popT) continue;
      c++;
      if (!l.v.stepped) { l.v.stepped = true; sfx('step', { rate: 0.9 + 0.35 * (c / 48) }); }
    }
    if (c !== lastTickCount) { lastTickCount = c; renderHud(hudTargets(c)); }
    if (introT > 0.6 && introT < INTRO_END) skipEl.hidden = false;
  }
}

// ───────────────────────── Input ─────────────────────────
// A "move" is one continuous gesture: it ends when the hand pauses (>140ms) or turns (>60°).
function movePointer(x, y, now) {
  const dx = x - pointer.x, dy = y - pointer.y, d = Math.hypot(dx, dy);
  if (pointer.in && d > 0.5) {
    if (now - pointer.lastMoveAt > 140) pointer.move++;
    if (d > 2) {
      const ux = dx / d, uy = dy / d;
      if (pointer.dirX || pointer.dirY) { if (ux * pointer.dirX + uy * pointer.dirY < 0.5) pointer.move++; }
      pointer.dirX = lerp(pointer.dirX, ux, 0.35); pointer.dirY = lerp(pointer.dirY, uy, 0.35);
      const l = Math.hypot(pointer.dirX, pointer.dirY) || 1; pointer.dirX /= l; pointer.dirY /= l;
    }
    pointer.lastMoveAt = now; if (now >= lockUntil) pointer.travel += d;
  }
  pointer.x = x; pointer.y = y; pointer.in = true;
}
crisp.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return;
  if (hintState === 1 && pointer.in && Math.hypot(e.clientX - pointer.x, e.clientY - pointer.y) > 3) setTimeout(hideHint, 700);
  pointer.sim = false; pointer.overUI = false; forcedHover = null;
  movePointer(e.clientX, e.clientY, performance.now());
});
crisp.addEventListener('pointerleave', (e) => {
  // Onto UI (dock, card, status): freeze in place. Out of the window: let the camera relax.
  if (e.relatedTarget && e.relatedTarget !== document.documentElement) pointer.overUI = true;
  else pointer.in = false;
});
crisp.addEventListener('pointerenter', () => { pointer.overUI = false; });
crisp.addEventListener('pointerup', (e) => {
  if (!introDone) return;
  const touch = e.pointerType === 'touch';
  if (touch) { pointer.x = e.clientX; pointer.y = e.clientY; pointer.in = true; pointer.overUI = false; }
  if (overPill()) { goBack(); if (touch) pointer.in = false; return; }
  const l = touch ? findHoverLeaf() : hoverLeaf;
  if (l && (!touch || l.v.scr.r > 7 || focus.depth >= 2)) { card.open(l); if (touch) pointer.in = false; return; }
  const hit = evalPointer();
  if (touch) {
    pointer.in = false;
    if (hit && hit.inside && hit.type !== 'out') setFocus(hit.node);
    else goBack();
    return;
  }
  if (hit && hit.inside && (hit.type === 'in' || hit.type === 'roots')) setFocus(hit.node);
});
addEventListener('keydown', (e) => {
  if (card.lesson) return;                       // the card handles its own Escape
  if ((e.key === 'Escape' || e.key === 'Backspace') && introDone) { e.preventDefault(); goBack(); }
  if ((e.key === ' ' || e.key === 'Enter') && !introDone && begun && document.activeElement === document.body) skipIntro();
}, true);

// ───────────────────────── QA demos ─────────────────────────
function runDemo() {
  const d = Q.get('demo');
  const D = domains[clamp(parseInt(Q.get('d') || '0', 10) || 0, 0, domains.length - 1)];
  if (Q.has('mx')) { pointer.x = parseFloat(Q.get('mx')); pointer.y = parseFloat(Q.get('my') || '0'); pointer.in = true; pointer.sim = Q.has('commit'); pointer.lastMoveAt = 1e12; }
  if (!d) return;
  if (d === 'limb') setFocus(D);
  else if (d === 'topic') setFocus(D.children[clamp(parseInt(Q.get('k') || '0', 10) || 0, 0, D.children.length - 1)]);
  else if (d === 'roots') setFocus(ROOTS);
  else if (d === 'hover') { const l = leaves.find((x) => x.state === 'frontier' && x.domain === D); setFocus(l.parent); setTimeout(() => { forcedHover = l; }, 700); }
  else if (d === 'complete') {
    const l = leaves.find((x) => x.state === 'frontier' && x.domain === D);
    setFocus(l.parent);
    setTimeout(() => card.open(l), 500);
    setTimeout(() => card.el.querySelector('.actions .kg-btn.primary')?.click(), 1000);
  }
}

// ───────────────────────── Loop + frame timing ─────────────────────────
renderHud(hudTargets(0));
VP = viewport();
{ const k = introCam(frameFor(root)); cam.x = k.x; cam.y = k.y; cam.z = k.z; }
document.fonts?.ready.then(() => { measured.clear(); frameCache.clear(); });
let last = performance.now();
// ?vt=1: CLI screenshots under --virtual-time-budget tick rAF only a few times, so the simulation
// runs on a timer there and rAF just paints.
const VIRTUAL = Q.has('vt');
const perf = { work: [], frames: [], lastFrame: 0 };
function step(now) {
  const total = Math.min(VIRTUAL ? 0.25 : 0.05, Math.max(0, now - last) / 1000);
  const steps = Math.max(1, Math.ceil(total / (1 / 60) - 1e-6)), dt = total / steps;
  last = clock = now;
  VP = viewport();
  readZones();
  for (let i = 0; i < steps; i++) {
    time += dt;
    stepIntro(now);
    updateWind(dt);
    animate(dt);
    updateMatrices();
    handlePointer(now);
    computeTargets();
    updateParticles(dt);
  }
  stepHud(now);
}
function frameLoop(now) {
  const t0 = performance.now();
  step(now);
  draw(now);
  const t1 = performance.now();
  perf.work.push(t1 - t0); if (perf.work.length > 240) perf.work.shift();
  if (perf.lastFrame) { perf.frames.push(now - perf.lastFrame); if (perf.frames.length > 240) perf.frames.shift(); }
  perf.lastFrame = now;
  requestAnimationFrame(frameLoop);
}
if (VIRTUAL) {
  setInterval(() => step(performance.now()), 16);
  const paint = () => { draw(performance.now()); requestAnimationFrame(paint); };
  requestAnimationFrame(paint);
} else requestAnimationFrame(frameLoop);
const stat = (a) => { const s = [...a].sort((x, y) => x - y); return { avg: +(a.reduce((x, y) => x + y, 0) / Math.max(1, a.length)).toFixed(2), p95: +(s[Math.floor(s.length * 0.95)] || 0).toFixed(2), max: +(s[s.length - 1] || 0).toFixed(2) }; };
window.__tree = {
  graph, nodes, ROOTS, cam, setFocus, goBack, card, pointer, skipIntro,
  get focus() { return focus; }, get hoverLeaf() { return hoverLeaf; },
  perf: () => ({ workMs: stat(perf.work), frameMs: stat(perf.frames) }),
  labelBoxes: () => placed.slice(zones.length),
  sfxLog: () => sfxLog.slice(),
};
</script>
