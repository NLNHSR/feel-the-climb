<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Second Brain</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/dolphin.css">
<style>
  :root { color-scheme: dark; }
  html, body { overflow: hidden; }
  body {
    color: var(--foam);
    background: var(--night-deep);
  }
  #base, #blur, #crisp { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #base { pointer-events: none; }
  #blur { filter: blur(6px); pointer-events: none; }
  #crisp { touch-action: none; }

  /* Status (top-left): the one element on screen at rest. Crumbs join it only when zoomed. */
  .status {
    position: fixed; top: 24px; left: 24px; z-index: 20; display: grid; justify-items: start; pointer-events: none;
    opacity: 0; transform: translateY(-6px); transition: opacity 700ms ease, transform 700ms cubic-bezier(.2,.9,.3,1);
    text-shadow: 0 1px 14px rgba(5, 22, 54, 0.7);
  }
  .status.show { opacity: 1; transform: none; }
  .status-main { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .status-main b { font-family: var(--font-head); font-weight: normal; font-size: 32px; line-height: 1; color: var(--foam); display: inline-block; }
  .status-main span { font-weight: 700; font-size: 16px; color: var(--mist); }
  .status-sub { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--cloud); }
  .status-sub b { color: var(--foam); display: inline-block; }
  .pop { animation: pop 520ms cubic-bezier(.2,.9,.3,1.4); }
  @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .hint { margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--cloud); transition: opacity 900ms ease; }
  .hint.gone { opacity: 0; }
  .crumbs { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: auto; }
  .crumbs:empty { display: none; }
  .crumb {
    font: 800 13px/1 var(--font-body); color: var(--foam); background: rgba(10, 35, 79, 0.62);
    border: 1.5px solid rgba(158, 223, 255, 0.18); border-radius: 999px; padding: 8px 12px; cursor: pointer;
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3); display: inline-flex; align-items: center; gap: 7px; text-shadow: none;
    transition: transform 120ms ease, background 150ms ease;
  }
  .crumb:hover { transform: translateY(1px); }
  .crumb i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .crumb[aria-current="true"] { background: var(--wave-3); border-color: var(--wave-shadow); box-shadow: 0 3px 0 var(--wave-shadow); }
  .crumb:focus-visible { outline: 3px solid rgba(95, 198, 247, 0.5); outline-offset: 2px; }
  .crumb-sep { color: var(--cloud); font-weight: 800; opacity: 0.7; }

  /* Scan readout: one plain line during the intro */
  .readout {
    position: fixed; left: 50%; top: 24px; transform: translate(-50%, -8px); z-index: 21; pointer-events: none;
    font: 700 13px/1.2 var(--font-body); color: var(--mist); text-shadow: 0 1px 12px rgba(5, 22, 54, 0.8);
    opacity: 0; transition: opacity 500ms ease, transform 500ms ease; white-space: nowrap;
  }
  .readout.show { opacity: 1; transform: translate(-50%, 0); }

  /* Hover tooltip */
  .tip {
    position: fixed; z-index: 25; pointer-events: none; max-width: 240px; left: 0; top: 0;
    background: rgba(10, 35, 79, 0.96); color: var(--foam); border: 1px solid rgba(158, 223, 255, 0.24);
    border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 700; line-height: 1.35;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3); opacity: 0; transition: opacity 90ms ease;
  }
  .tip.show { opacity: 1; }

  /* The one recommended next lesson: a real button attached to its neuron. */
  .next-pill {
    position: fixed; left: 0; top: 0; z-index: 22; height: 32px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 4px;
    padding: 0 8px 0 12px; border-radius: 999px; border: 2px solid var(--sun-shadow); background: var(--sun); color: var(--ink);
    font: 800 13px/1 var(--font-body); white-space: nowrap; max-width: 260px; cursor: pointer;
    box-shadow: 0 3px 0 var(--sun-shadow); opacity: 0; pointer-events: none; will-change: transform;
    transition: opacity 220ms ease, box-shadow 140ms ease, filter 140ms ease;
  }
  .next-pill span { overflow: hidden; text-overflow: ellipsis; }
  .next-pill svg { width: 16px; height: 16px; flex: none; }
  .next-pill.show { opacity: 1; pointer-events: auto; }
  .next-pill[data-state="progress"] { background: #FF9F43; border-color: #D9792A; box-shadow: 0 3px 0 #D9792A; }
  .next-pill.hot { filter: brightness(1.06); box-shadow: 0 3px 0 var(--sun-shadow), 0 0 0 4px rgba(255, 244, 78, 0.28); }
  .next-pill[data-state="progress"].hot { box-shadow: 0 3px 0 #D9792A, 0 0 0 4px rgba(255, 159, 67, 0.3); }
  .next-pill:focus-visible { outline: 3px solid rgba(95, 198, 247, 0.6); outline-offset: 2px; }
  .tip b { display: block; font-weight: 800; font-size: 13px; }
  .tip .st { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-weight: 700; font-size: 13px; }
  .tip .st i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .tip .act { display: block; margin-top: 4px; color: var(--sun); font-size: 13px; font-weight: 800; }

  @media (max-width: 700px) {
    .status { top: 16px; left: 16px; right: 16px; }
    .crumb { font-size: 12px; padding: 7px 10px; }
    .readout { top: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .status, .readout, .tip, .hint, .next-pill { transition: none; }
    .pop { animation: none; }
  }
</style>
</head>
<body>
<canvas id="base" aria-hidden="true"></canvas>
<canvas id="blur" aria-hidden="true"></canvas>
<canvas id="crisp" role="img" aria-label="Your second brain: every SAT concept is a neuron inside a brain region. Move the pointer toward a region to zoom in, and away to zoom out."></canvas>

<header class="status" id="hud" aria-live="polite">
  <div class="status-main"><b id="hudFiring">0</b><span>/ <span id="hudTotal">89</span> neurons firing</span></div>
  <div class="status-sub">Projected score <b id="hudScore">400</b></div>
  <div class="hint" id="hint" hidden>Move toward a region to zoom in.</div>
  <nav class="crumbs" id="crumbs" aria-label="Brain path"></nav>
</header>

<div class="readout" id="readout" aria-live="polite"><span id="roText">Mapping your SAT knowledge…</span></div>
<div class="tip" id="tip"></div>
<button class="next-pill" id="nextPill" type="button"><span id="nextText">Next</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

<script type="module">
/*
 * Sound design — Second Brain
 * Music: pulsing analog synth over a slow heartbeat; warm, curious, faintly clinical (an MRI room hum
 *   underneath). Starts as a low pad + heartbeat while the scan runs, swells into a driving arpeggio at
 *   the light-up, then settles into a calm pulse. setIntensity follows how much of the brain is firing
 *   and how deep you have zoomed; finishing a lesson gives it a short lift.
 * SFX (score.sfx), each fired on the frame its visual happens:
 *   hover    – soft synaptic click, dry and short (pointer reaches a neuron, or leans into a lobe/topic)
 *   select   – glassy tap with a small upward lift (lesson card opens)            [lesson-card.js]
 *   back     – the same tap, lower and softer (Esc, breadcrumb, closing the card)
 *   zoomIn   – airy upward whoosh with a faint electric shimmer (camera dives into a lobe or topic)
 *   zoomOut  – the same whoosh falling and darker (camera pulls back out)
 *   start    – short charge-up hum, ~0.9s (Start lesson pressed)                  [lesson-card.js]
 *   complete – electric surge + bright chime (the neuron ignites)                 [lesson-card.js]
 *   unlock   – gentle rising two-note spark (a dormant neuron wakes and starts to flicker)
 *   riser    – ~2.2s scanner sweep building tension (scan done, brain charging)
 *   intro    – deep sub hit + bright neural crackle (the whole brain lights up at once)
 *   step     – tiny MRI blip (the scanline reveals a neuron; a cascade pulse lands on a neighbour)
 */
import { createGraph, DOMAIN_HUES, pct, clamp } from '../shared/graph.js';
import { mountChrome, params } from '../shared/chrome.js';
import { createLessonCard } from '../shared/lesson-card.js';

// QA: ?debug=1 records frame stats and errors into the DOM (read with --dump-dom).
const dbgEl = new URLSearchParams(location.search).has('debug') ? Object.assign(document.createElement('pre'), { id: 'dbg', hidden: true }) : null;
if (dbgEl) { document.body.append(dbgEl); addEventListener('error', (e) => { dbgEl.textContent += `ERROR ${e.message} @${e.lineno}:${e.colno}\n`; }); }
// ════════════════════════ Basics ════════════════════════
const TAU = Math.PI * 2;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
function mulberry32(a) {
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const rand = mulberry32(0x5EC0B2A1);   // layout (deterministic)
const frand = Math.random;             // live simulation
function hex(c) { const v = parseInt(c.slice(1), 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; }
function mix(a, b, t) { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function rgba(c, a) { const [r, g, b] = hex(c); return `rgba(${r},${g},${b},${a})`; }
function hash2(i, j) { let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y) {
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return lerp(lerp(hash2(i, j), hash2(i + 1, j), u), lerp(hash2(i, j + 1), hash2(i + 1, j + 1), u), v) * 2 - 1;
}

const C = {
  foam: '#FFFFFC', mist: '#D9E4F2', cloud: '#B7C0CC', wave1: '#9EDFFF', wave2: '#5FC6F7', wave3: '#2F9AE6',
  night: '#103B84', nightDeep: '#0A2B64', nightInk: '#0A234F', abyss: '#051636', sun: '#FFF44E', sunShadow: '#E8BE00', coral: '#E35D6A',
};
const HEAD = '"VAG Rundschrift D", "Manrope", system-ui, sans-serif';
const BODY = '"Manrope", system-ui, sans-serif';

// ════════════════════════ Geometry helpers ════════════════════════
function catmull(pts, seg, closed) {
  const out = [], n = pts.length, last = closed ? n : n - 1;
  const P = (i) => (closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)]);
  for (let i = 0; i < last; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    for (let s = 0; s < seg; s++) {
      const t = s / seg, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map((k) => 0.5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));
    }
  }
  if (!closed) out.push(pts[n - 1].slice());
  return out;
}
function pip(poly, x, y) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function polyPath(poly, close = true) { const p = new Path2D(); poly.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y))); if (close) p.closePath(); return p; }
function smoothInto(path, P) {
  path.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length - 1; i++) path.quadraticCurveTo(P[i][0], P[i][1], (P[i][0] + P[i + 1][0]) / 2, (P[i][1] + P[i + 1][1]) / 2);
  path.lineTo(P[P.length - 1][0], P[P.length - 1][1]);
}

// ════════════════════════ Brain anatomy (world units, side view, frontal pole on the left) ════════════════════════
const CEREBRUM = catmull([
  [-478, 8], [-468, -82], [-428, -172], [-358, -248], [-258, -306], [-138, -342], [-8, -354], [122, -343], [242, -306],
  [346, -242], [425, -152], [472, -52], [490, 30], [480, 104], [432, 150], [344, 164], [254, 184], [152, 220], [42, 238],
  [-68, 236], [-160, 216], [-226, 180], [-258, 140], [-242, 108], [-280, 95], [-364, 84], [-436, 58],
], 10, true);
const CB = { cx: 358, cy: 222, rx: 150, ry: 84, flat: 0.46, rot: 0.05 };
function cbPoint(theta, s, sy = s) {
  const sn = Math.sin(theta);
  const x = CB.rx * s * Math.cos(theta), y = CB.ry * sy * sn * (sn < 0 ? CB.flat : 1);
  const c = Math.cos(CB.rot), si = Math.sin(CB.rot);
  return [CB.cx + x * c - y * si, CB.cy + x * si + y * c];
}
const CEREBELLUM = Array.from({ length: 90 }, (_, i) => cbPoint((i / 90) * TAU, 1));
const STEM = catmull([[150, 205], [208, 208], [228, 246], [222, 300], [212, 352], [210, 410], [166, 410], [164, 352], [150, 296], [138, 248]], 8, true);

const SYL_A = [[-242, 108], [-200, 99], [-158, 86], [-118, 74]];          // notch → junction (exclusive)
const JUNCTION = [-80, 61];
const SYL_B = [[-36, 52], [12, 40], [62, 25], [112, 6], [165, -20]];      // junction (exclusive) → end
const SYLVIAN = [...SYL_A, JUNCTION, ...SYL_B];
const SYLVIAN_RAMUS = [[150, -12], [184, -40], [196, -70], [214, -96]];
const CENTRAL = [[36, -356], [30, -322], [15, -290], [20, -254], [4, -216], [-12, -180], [-6, -146], [-24, -110], [-42, -72], [-38, -36], [-56, 4], [-66, 34], JUNCTION];
const PO = [[348, -250], [322, -186], [338, -118], [312, -52], [316, 0], [338, 56], [324, 112], [342, 162]];
const TP = [[165, -20], [204, -2], [246, -20], [284, 8], [316, 0]];
const FAR = 3000;
// Lobe borders follow the same smoothed curves the fissures are drawn with, so tints meet the lines exactly.
const smoothLine = (pts) => catmull(pts, 6, false);
const CS_S = smoothLine(CENTRAL), SA_S = smoothLine([...SYL_A, JUNCTION]), SB_S = smoothLine([JUNCTION, ...SYL_B]);
const PO_TOP = smoothLine(PO.slice(0, 5)), PO_LOW = smoothLine(PO.slice(4)), TP_S = smoothLine(TP);
const POLY = {
  frontal: [[-FAR, -FAR], [40, -FAR], ...CS_S, ...SA_S.slice().reverse(), [-FAR, 150]],
  parietal: [[40, -FAR], [352, -FAR], ...PO_TOP, ...TP_S.slice().reverse(), ...SB_S.slice().reverse(), ...CS_S.slice().reverse()],
  occipital: [[352, -FAR], [FAR, -FAR], [FAR, FAR], [342, FAR], ...PO_LOW.slice().reverse(), ...PO_TOP.slice().reverse()],
  temporal: [[-FAR, 150], ...SA_S, ...SB_S, ...TP_S, ...PO_LOW, [342, FAR], [-FAR, FAR]],
};
const BRAIN_BOX = [-490, -360, 500, 400];

const PATHS = {
  cerebrum: polyPath(CEREBRUM), cerebellum: polyPath(CEREBELLUM), stem: polyPath(STEM),
  notCerebrum: (() => { const p = new Path2D(); p.rect(-FAR, -FAR, 2 * FAR, 2 * FAR); p.addPath(polyPath(CEREBRUM)); p.addPath(polyPath(CEREBELLUM)); return p; })(),
};
const fissure = (pts) => { const p = new Path2D(); smoothInto(p, catmull(pts, 6, false)); return p; };
const linePath = (...lines) => { const p = new Path2D(); for (const L of lines) smoothInto(p, L); return p; };
PATHS.deep = linePath([...SA_S, ...SB_S.slice(1)], smoothLine(SYLVIAN_RAMUS), CS_S.slice(3));
PATHS.shallow = linePath(PO_TOP, TP_S, PO_LOW);

const REGIONS = [
  { key: 'frontal', domain: 'Algebra', lobe: 'Frontal lobe', poly: POLY.frontal, label: { L: [-446, -214], align: 'right' }, phone: { L: [-300, -334], align: 'above' } },
  { key: 'parietal', domain: 'Advanced Math', lobe: 'Parietal lobe', poly: POLY.parietal, label: { L: [170, -370], align: 'above' }, phone: { L: [30, -380], align: 'above' } },
  { key: 'occipital', domain: 'Problem Solving & Data', lobe: 'Occipital lobe', poly: POLY.occipital, label: { L: [504, -70], align: 'left' }, phone: { L: [436, -266], align: 'above' } },
  { key: 'cerebellum', domain: 'Geometry & Trig', lobe: 'Cerebellum', poly: CEREBELLUM, label: { L: [524, 252], align: 'left' }, phone: { L: [372, 320], align: 'below' } },
  { key: 'temporal', domain: 'Reading & Writing', lobe: 'Temporal lobe', poly: POLY.temporal, label: { L: [-70, 262], align: 'below' }, phone: { L: [-110, 252], align: 'below' } },
];
const REG = Object.fromEntries(REGIONS.map((R) => [R.domain, R]));
function inRegion(R, x, y) { return R.key === 'cerebellum' ? pip(CEREBELLUM, x, y) : pip(CEREBRUM, x, y) && pip(R.poly, x, y); }
function regionAt(x, y) {
  if (pip(CEREBELLUM, x, y)) return REG['Geometry & Trig'];
  if (!pip(CEREBRUM, x, y)) return null;
  for (const R of REGIONS) if (R.key !== 'cerebellum' && pip(R.poly, x, y)) return R;
  return null;
}
const OFFS = Array.from({ length: 8 }, (_, i) => [Math.cos((i / 8) * TAU), Math.sin((i / 8) * TAU)]);
function inRegionDeep(R, x, y, m) { if (!inRegion(R, x, y)) return false; for (const [ox, oy] of OFFS) if (!inRegion(R, x + ox * m, y + oy * m)) return false; return true; }

// Region samples (for centroids, boxes, k-means and the decor network).
const SAMPLE = 9;
for (const R of REGIONS) { R.samples = []; R.deep = []; }
for (let y = BRAIN_BOX[1]; y <= 330; y += SAMPLE) {
  for (let x = BRAIN_BOX[0]; x <= BRAIN_BOX[2]; x += SAMPLE) {
    const jx = x + (rand() - 0.5) * 4, jy = y + (rand() - 0.5) * 4;
    const R = regionAt(jx, jy);
    if (!R) continue;
    R.samples.push([jx, jy]);
    if (inRegionDeep(R, jx, jy, 16)) R.deep.push([jx, jy]);
  }
}
for (const R of REGIONS) {
  let sx = 0, sy = 0, x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of R.samples) { sx += x; sy += y; x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  R.cx = sx / R.samples.length; R.cy = sy / R.samples.length;
  R.area = R.samples.length * SAMPLE * SAMPLE;
  R.rad = Math.sqrt(R.area / Math.PI);
  R.box = [x0 - 6, y0 - 6, x1 + 6, y1 + 6];
  R.hue = DOMAIN_HUES[R.domain];
  R.light = mix(R.hue, C.foam, 0.45);
  R.path = polyPath(R.poly);
  Object.assign(R, { rv: 1, rs: 1, tRv: 1, tRs: 1, dm: 0, flare: 0, seen: false });
}

// Gyri: iso-contours of a domain-warped noise field (marching squares), chained and smoothed, split by region.
function buildGyri() {
  const cell = 6, x0 = -486, y0 = -362, nx = Math.ceil(982 / cell), ny = Math.ceil(612 / cell), S = 60;
  const f = (x, y) => {
    const wx = vnoise(x / (S * 1.9) + 11.3, y / (S * 1.9) + 3.1), wy = vnoise(x / (S * 1.9) + 7.7, y / (S * 1.9) + 19.2);
    return vnoise(x / S + 1.3 * wx, y / S + 1.3 * wy) + 0.28 * vnoise(x / (S * 0.45) + 40, y / (S * 0.45) + 9);
  };
  const V = new Float32Array((nx + 1) * (ny + 1));
  for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) V[j * (nx + 1) + i] = f(x0 + i * cell, y0 + j * cell);
  const val = (i, j) => V[j * (nx + 1) + i];
  const hId = (i, j) => (j * (nx + 1) + i) * 2, vId = (i, j) => (j * (nx + 1) + i) * 2 + 1;
  const cache = new Map();
  const ept = (id) => {
    let p = cache.get(id);
    if (p) return p;
    const k = id >> 1, i = k % (nx + 1), j = (k / (nx + 1)) | 0;
    if (id & 1) { const a = val(i, j), b = val(i, j + 1), t = a / (a - b); p = [x0 + i * cell, y0 + (j + t) * cell]; }
    else { const a = val(i, j), b = val(i + 1, j), t = a / (a - b); p = [x0 + (i + t) * cell, y0 + j * cell]; }
    cache.set(id, p); return p;
  };
  const byRegion = new Map();
  const add = (a, b) => {
    const pa = ept(a), pb = ept(b), R = regionAt((pa[0] + pb[0]) / 2, (pa[1] + pb[1]) / 2);
    if (!R || R.key === 'cerebellum') return;
    if (!byRegion.has(R)) byRegion.set(R, []);
    byRegion.get(R).push([a, b]);
  };
