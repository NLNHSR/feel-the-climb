<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Impossible Tower</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="../shared/dolphin.css" />
<style>
  html, body { overflow: hidden; background: #D3ECF8; }
  body { color: var(--ink); }
  #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }

  /* Type: 16 label (display face), 13 small (body face). Spacing on an 8px rhythm. */
  .hud { position: fixed; top: 24px; left: 24px; z-index: 20; pointer-events: none; opacity: 0; transition: opacity 600ms ease; }
  .hud.show { opacity: 1; }
  .hud .l1 { font-family: var(--font-head); font-size: 16px; line-height: 24px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hud .l2 { font: 700 13px/16px var(--font-body); color: var(--muted); font-variant-numeric: tabular-nums; }

  .tip {
    position: fixed; left: 0; top: 0; z-index: 25; pointer-events: none; width: max-content; max-width: 240px;
    background: var(--foam); color: var(--ink); border: 2px solid var(--mist); border-radius: 16px;
    box-shadow: 0 3px 0 rgba(10, 35, 79, 0.1); padding: 8px 16px;
    opacity: 0; transition: opacity 120ms ease-out;
  }
  .tip.show { opacity: 1; }
  .tip .d { display: flex; align-items: center; gap: 8px; font: 700 13px/16px var(--font-body); color: var(--muted); }
  .tip .d i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tip .t { font-family: var(--font-head); font-size: 16px; line-height: 20px; margin-top: 4px; }
  .tip .m { font: 700 13px/16px var(--font-body); color: var(--muted); margin-top: 4px; }

  .hint {
    position: fixed; left: 50%; bottom: 80px; transform: translate(-50%, 8px); z-index: 30; pointer-events: none;
    white-space: nowrap; font: 700 13px/16px var(--font-body); color: var(--ink);
    opacity: 0; transition: opacity 400ms ease-out, transform 400ms cubic-bezier(.2, .8, .2, 1);
  }
  .hint.show { opacity: 0.8; transform: translate(-50%, 0); }

  .home-pill {
    position: fixed; top: 24px; left: 50%; z-index: 21; --tx: -50%;
    height: 40px; padding: 0 16px 0 12px; border-radius: 20px; font: 700 13px/1 var(--font-body); cursor: pointer;
    display: flex; align-items: center; gap: 8px; background: var(--foam); color: var(--ink); border: 2px solid var(--mist);
    box-shadow: 0 3px 0 var(--chrome-shadow); opacity: 0; transform: translate(var(--tx), -8px); pointer-events: none;
    transition: opacity 200ms cubic-bezier(.2, .8, .2, 1), transform 240ms cubic-bezier(.2, .8, .2, 1);
  }
  .home-pill.show { opacity: 1; transform: translate(var(--tx), 0); pointer-events: auto; }
  .home-pill.show:active { transform: translate(var(--tx), 3px); box-shadow: none; }
  .home-pill svg { width: 16px; height: 16px; transition: transform 200ms ease; }
  .home-pill.down svg { transform: rotate(180deg); }

  /* The gate sits over a pale sky, so it takes dark ink instead of the default white. */
  .kg-gate { color: var(--ink); }
  .kg-gate .kg-eyebrow { opacity: 0.7; }

  @media (max-width: 640px) {
    .hud { top: 16px; left: 16px; }
    .home-pill { left: auto; right: 16px; top: 16px; --tx: 0px; }
    .tip { max-width: 208px; }
    .hint { bottom: 120px; }
  }
  @media (prefers-reduced-motion: reduce) { .tip, .hud, .hint, .home-pill { transition: none; } }
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="An isometric tower of SAT topics. Each tier is a topic and each step on its staircase is a lesson. Built tiers sit below you; three paths branch from your tier, and the pale tiers above are not built yet. Point toward a path to connect it, then click its glowing step. Arrow keys also work."></canvas>
<header class="hud" id="hud" aria-live="polite"><div class="l1" id="hudL1"></div><div class="l2" id="hudL2"></div></header>
<div class="tip" id="tip" role="tooltip"></div>
<div class="hint" id="hint" aria-live="polite"></div>
<button class="home-pill" id="homePill" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span>Back to your tier</span></button>

<script type="module">
// ─── Sound design (for whoever sources the audio; every cue fires on its visual, never at random) ───
// Music: serene, meditative, spacious. A slow warm pad with sparse felt-piano or kalimba notes in
//   Lydian, ~60 bpm, long soft reverb, lots of air between notes. score.setIntensity follows how high
//   you are looking: ~0.18 at the foot of the tower, rising gently to ~0.4 near the summit (a second
//   pad voice and a slow high bell figure join). The intro assembly swells from near-silence to a soft
//   bloom and must never turn into drums.
// hover   : pointer reaches a step, a tier or the summit. One soft wooden "tok", very short, no tail.
// select  : a lesson card opens. Two clear chime notes a fifth apart, gentle attack.
// back    : card closed, or Esc brings the camera home. The same chime, descending and quieter.
// start   : lesson begins. A low breathy swell (a bowed bell) that resolves upward.
// complete: lesson mastered; the glowing step turns to stone. A warm resonant bell over a soft stone settle.
// unlock  : a new step lights or a new path slides into reach. A rising three-note harp or kalimba figure.
// intro   : the figure arrives on your tier after the assembly. A wide soft bloom (low pad + high shimmer), not a hit.
// riser   : the 2.2 s build into that arrival. An airy pad swell with a soft reversed cymbal.
// step    : two uses. (1) Architecture: a short smooth stone grind ending in a wooden "clunk" when a
//           platform locks into place (tiers landing, the turntable connecting a path). (2) The figure's
//           footstep: a light, dry tap on stone, slightly varied.
// zoomIn / zoomOut: unused; this view never zooms.
// A placeholder kit matching these notes is synthesized into ./audio (bed.wav loops seamlessly); swap files 1:1.
//
// Impossible Tower: an isometric tower where every tier is a topic and every step a lesson (ordered by rung).
// Built tiers below you are solid; from your tier a turntable connects one of up to three branching
// staircases (the frontier); tiers above are pale, not yet built. Point toward a path and the turntable
// rotates to connect it. Click its glowing step to open the lesson card; finishing it walks you up.
// QA params: ?skipgate=1  &t=<sec> (jump into the intro; 99 = settled)  &demo=hover|shift|complete|top
//            &px=<0-1>&py=<0-1> (park a virtual mouse)  &notrans=1 (freeze CSS transitions)  &debug=1
import { createGraph, DOMAIN_HUES, clamp } from '../shared/graph.js';
import { mountChrome, params } from '../shared/chrome.js';
import { createLessonCard } from '../shared/lesson-card.js';

// ═══════════════════════ Utilities ═══════════════════════
const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const easeOut = (u) => 1 - Math.pow(1 - u, 3);
const easeInOut = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const easeOutBack = (u) => { const c1 = 1.25, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
const hex = (h) => { h = h.trim(); return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; };
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgb = (c) => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = () => performance.now();
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
if (params.has('notrans')) {
  const st = document.createElement('style'); st.textContent = '*, *::before, *::after { transition: none !important; animation: none !important; }'; document.head.append(st);
}

// ═══════════════════════ Palette (soft pastel takes on the Dolphin tokens) ═══════════════════════
const HUE = Object.fromEntries(Object.entries(DOMAIN_HUES).map(([k, v]) => [k, hex(v)]));
const FOAM = hex('#FFFFFC'), INK = hex('#0A234F');
// Sandstone: top / lit left face (+y) / shaded right face (+x). Light comes from the upper left.
const STONE = { top: [255, 253, 247], left: [239, 232, 222], right: [217, 205, 190] };
const KEEL = { top: [246, 239, 229], left: [231, 222, 209], right: [207, 194, 178] };
const SUN = { top: [255, 241, 112], left: [249, 216, 66], right: [231, 186, 24] };
const LIT_TOP = [255, 247, 214];
const GOLD = { top: [255, 230, 160], left: [247, 204, 120], right: [226, 172, 86] }; // the summit gateway
const MINT = HUE['Problem Solving & Data'];
const palCache = new Map();
function tierPal(h) {
  const k = 't' + h.join();
  if (!palCache.has(k)) palCache.set(k, { left: mixc(STONE.left, h, 0.44), right: mixc(mixc(STONE.right, h, 0.52), INK, 0.06) });
  return palCache.get(k);
}
function stepPal(h) {
  const k = 's' + h.join();
  if (!palCache.has(k)) palCache.set(k, { top: STONE.top, left: mixc(STONE.left, h, 0.22), right: mixc(STONE.right, h, 0.34) });
  return palCache.get(k);
}
const FOUND_BAND = tierPal(MINT);
const GROUND = { top: mixc(STONE.top, MINT, 0.2), left: mixc(STONE.left, MINT, 0.3), right: mixc(STONE.right, MINT, 0.38) };

// Sky: cool blue above, a warm foam haze near the base. Shifts slightly cooler as you look up the tower.
let skyAlt = 0;
function skyStops() {
  const a = clamp(skyAlt, 0, 1);
  return [mixc([164, 214, 243], [140, 198, 238], a), mixc([206, 236, 251], [188, 226, 249], a), mixc([255, 243, 228], [226, 242, 251], a)];
}
let SKY = skyStops();
function skyAtY(sy) {
  const f = clamp(sy / VH, 0, 1);
  return f < 0.55 ? mixc(SKY[0], SKY[1], f / 0.55) : mixc(SKY[1], SKY[2], (f - 0.55) / 0.45);
}

// ═══════════════════════ Data ═══════════════════════
const graph = createGraph();
const isGroup = (n) => n.children.length > 0 && n.children.every((c) => !c.children.length);
const TOPICS = graph.nodes.filter(isGroup).map((n) => ({
  id: n.id, label: n.label, domain: n.domain.label, di: n.domainIndex, hue: HUE[n.domain.label],
  lessons: [...n.children].sort((a, b) => a.rung - b.rung),
}));
const topicOf = new Map();
TOPICS.forEach((t) => t.lessons.forEach((l) => topicOf.set(l.id, t)));
let stats = graph.stats();
// Shown state can lag the graph a beat so a newly ready step lights when the figure gets there.
const holds = new Map();
const stateOf = (l) => holds.get(l.id) ?? l.state;
const masteredIn = (t) => t.lessons.filter((l) => stateOf(l) === 'mastered').length;

// The plan: built topics (the path below you), up to three branching options from your tier, the rest queued above.
// Options keep their slot between plans so nothing jumps around after a completion.
function computePlan(prev) {
  const isDone = (t) => t.lessons.every((l) => stateOf(l) === 'mastered');
  const hasFront = (t) => t.lessons.some((l) => stateOf(l) === 'frontier');
  const prog = (t) => masteredIn(t) / t.lessons.length;
  const last = (t) => Math.max(0, ...t.lessons.map((l) => (l.masteredAt ? +l.masteredAt : 0)));
  const prevDone = prev ? prev.done.filter(isDone) : [];
  const done = [...prevDone, ...TOPICS.filter((t) => isDone(t) && !prevDone.includes(t)).sort((a, b) => last(a) - last(b) || a.id - b.id)];
  const active = TOPICS.filter((t) => !isDone(t) && hasFront(t)).sort((a, b) => prog(b) - prog(a) || a.di - b.di || a.id - b.id);
  const locked = TOPICS.filter((t) => !isDone(t) && !hasFront(t)).sort((a, b) => a.di - b.di || a.id - b.id);
  // Two branches, both rising away from the camera, so every step of both stays in view.
  const slots = [null, null];
  if (prev) for (const o of prev.options) if (active.includes(o.topic) && o.slot < slots.length) slots[o.slot] = o.topic;
  for (let s = 0; s < slots.length; s++) {
    if (slots[s]) continue;
    const used = new Set(slots.filter(Boolean).map((t) => t.domain));
    slots[s] = active.find((t) => !slots.includes(t) && !used.has(t.domain)) || active.find((t) => !slots.includes(t)) || null;
  }
  const options = slots.map((topic, slot) => (topic ? { topic, slot } : null)).filter(Boolean);
  const queue = [...active.filter((t) => !slots.includes(t)), ...locked];
  return { done, options, queue };
}

// ═══════════════════════ Layout (world units: 1 = one cell; z up; a step is 0.5 deep and 0.5 high) ═══════════════════════
const ANG = { '+x': 0, '+y': Math.PI / 2, '-x': Math.PI, '-y': -Math.PI / 2 };
const DV = { '+x': [1, 0], '+y': [0, 1], '-x': [-1, 0], '-y': [0, -1] };
const OPP = { '-x': '+x', '+x': '-x', '-y': '+y', '+y': '-y' };
const dirOf = (i) => (((i % 2) + 2) % 2 === 0 ? '-x' : '-y');

function flight(from, dir, gap, n) {
  const steps = [];
  const { x: ax, y: ay, z: za } = from;
  for (let k = 1; k <= n; k++) {
    const a = gap + 0.5 * (k - 1), b = gap + 0.5 * k, t = za + 0.5 * k;
    let g;
    if (dir === '-x') g = { x0: ax - b, x1: ax - a, y0: ay + 0.5, y1: ay + 1.5 };
    else if (dir === '+x') g = { x0: ax + 2 + a, x1: ax + 2 + b, y0: ay + 0.5, y1: ay + 1.5 };
    else if (dir === '-y') g = { x0: ax + 0.5, x1: ax + 1.5, y0: ay - b, y1: ay - a };
    else g = { x0: ax + 0.5, x1: ax + 1.5, y0: ay + 2 + a, y1: ay + 2 + b };
    g.z0 = t - 1; g.z1 = t;
    steps.push(g);
  }
  const d = gap + 0.5 * n;
  let x = ax, y = ay;
  if (dir === '-x') x = ax - d - 2; else if (dir === '+x') x = ax + 2 + d; else if (dir === '-y') y = ay - d - 2; else y = ay + 2 + d;
  return { steps, plat: { x, y, z: za + 0.5 * (n + 1) } };
}

const COL_H = 2.4; // each tier stands on a slender column that fades into the haze below
function buildLayout(pl) {
  const L = { specs: new Map(), tiers: [], byTopic: new Map(), options: [], hubTier: null, summit: null, D: pl.done.length };
  const add = (id, s) => L.specs.set(id, { id, ...s });
  const addTier = (tier) => {
    const { x, y, z } = tier, key = tier.topic ? tier.topic.id : 'found';
    tier.key = key;
    add('tier-' + key, { kind: 'tier', role: tier.role, topic: tier.topic, tier, g: { x0: x, x1: x + 2, y0: y, y1: y + 2, z0: z - 1, z1: z } });
    add('keel-' + key, { kind: 'keel', role: tier.role, topic: tier.topic, tier, g: { x0: x + 0.5, x1: x + 1.5, y0: y + 0.5, y1: y + 1.5, z0: z - 1 - COL_H, z1: z - 1 } });
    L.tiers.push(tier);
    if (tier.topic) L.byTopic.set(tier.topic.id, tier);
  };
  const addFlight = (tier, steps, ids) => {
    tier.stepIds = [];
    steps.forEach((g, k) => {
      const lesson = tier.topic ? tier.topic.lessons[k] : null;
      const id = lesson ? 'step-' + lesson.id : ids + k;
      add(id, { kind: 'step', role: tier.role, topic: tier.topic, lesson, tier, k, g });
      tier.stepIds.push(id);
    });
  };
  add('ground', { kind: 'ground', role: 'foundation', g: { x0: -2.5, x1: 2.5, y0: -2.5, y1: 2.5, z0: -2.25, z1: -1.5 } });
  const found = { x: -1, y: -1, z: 0, topic: null, role: 'foundation', idx: 0, stepIds: [] };
  addTier(found);
  let prev = found;
  pl.done.forEach((t, i) => {
    const f = flight(prev, dirOf(i), 0, t.lessons.length);
    const tier = { ...f.plat, topic: t, role: 'path', idx: i + 1, dir: dirOf(i), from: prev, gap: 0 };
    addFlight(tier, f.steps); addTier(tier); prev = tier;
  });
  const cur = prev, D = pl.done.length;
  cur.isHub = true;
  L.hubTier = cur;
  // Your tier's sides: one is where you came up; the turntable faces the two that climb away from you.
  const s0 = dirOf(D), s1 = D > 0 ? dirOf(D - 1) : '-y';
  L.slotDirs = [s0, s1];
  L.inSide = D > 0 ? OPP[dirOf(D - 1)] : '+y';
  for (const { topic, slot } of pl.options) {
    const dir = L.slotDirs[slot];
    const f = flight(cur, dir, 1, topic.lessons.length);
    const tier = { ...f.plat, topic, role: 'option', slot, dir, from: cur, gap: 1, idx: D + 1 };
    addFlight(tier, f.steps); addTier(tier);
    L.options.push(tier);
  }
  L.options.sort((a, b) => a.slot - b.slot);
  // Not yet built: the rest of the climb rises from the main option, then the summit.
  let gp = L.options.find((o) => o.slot === 0) || cur;
  let gi = gp === cur ? D : D + 1, idx = D + 2;
  for (const t of pl.queue) {
    const dir = dirOf(gi++);
    const f = flight(gp, dir, 0, t.lessons.length);
    const tier = { ...f.plat, topic: t, role: 'ghost', idx: idx++, dir, from: gp, gap: 0 };
    addFlight(tier, f.steps); addTier(tier); gp = tier;
  }
  {
    const dir = dirOf(gi);
    const f = flight(gp, dir, 0, 2);
    const tier = { ...f.plat, topic: null, role: 'summit', idx, dir, from: gp, gap: 0, key: 'summit' };
    addFlight(tier, f.steps, 'sstep-');
    const { x, y, z } = tier;
    add('tier-summit', { kind: 'tier', role: 'summit', tier, g: { x0: x, x1: x + 2, y0: y, y1: y + 2, z0: z - 1, z1: z } });
    add('keel-summit', { kind: 'keel', role: 'summit', tier, g: { x0: x + 0.5, x1: x + 1.5, y0: y + 0.5, y1: y + 1.5, z0: z - 1 - COL_H, z1: z - 1 } });
    // A gateway at the top: two posts and a lintel, opening toward the viewer.
    add('arch-a', { kind: 'post', role: 'summit', tier, g: { x0: x + 0.25, x1: x + 0.65, y0: y + 0.25, y1: y + 0.65, z0: z, z1: z + 1.5 } });
    add('arch-b', { kind: 'post', role: 'summit', tier, g: { x0: x + 1.35, x1: x + 1.75, y0: y + 0.25, y1: y + 0.65, z0: z, z1: z + 1.5 } });
    add('arch-c', { kind: 'lintel', role: 'summit', tier, g: { x0: x + 0.25, x1: x + 1.75, y0: y + 0.25, y1: y + 0.65, z0: z + 1.5, z1: z + 1.85 } });
    L.summit = tier; L.tiers.push(tier);
  }
  return L;
}

// ═══════════════════════ Chrome + card ═══════════════════════
let plan = computePlan(null);
const { score, caption } = mountChrome({
  id: 'impossible-tower',
  eyebrow: 'Your SAT knowledge graph',
  title: 'Impossible Tower',
  tagline: `Every lesson is a step and every topic a tier. You’ve mastered ${stats.mastered} steps so far. Choose where the tower rises next.`,
  gateBackground: 'linear-gradient(180deg, rgba(196,232,250,0.78) 0%, rgba(226,244,252,0.84) 55%, rgba(255,244,230,0.9) 100%)',
  beginLabel: 'Build my tower',
  onBegin: () => startIntro(),
});
// Audio comes from the shared 'impossible-tower' synth theme (shared/audio-themes.js): Lydian pads +
// kalimba, no drums, loudness-matched with the other variants.
let cardOpen = false, closedAt = 0, heldCaption = null;
const card = createLessonCard(graph, {
  score,
  caption: () => {}, // the tower says it; celebrate() adds one specific line instead
  onComplete: (evt) => celebrate(evt),
  onOpen: (n) => { cardOpen = true; hideTip(); keepClearOfCard(n); },
  onClose: () => {
    cardOpen = false; closedAt = clock(); score.sfx('back');
    if (cardShift) { cam.ty -= cardShift; cardShift = 0; }
    if (heldCaption && clock() - heldCaption.at < 15000) setTimeout(() => caption(heldCaption.line, 3000), 250);
    heldCaption = null;
  },
});

// ═══════════════════════ Canvas, scale, projection ═══════════════════════
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1, TW = 64, HW = 32, HH = 16, ZP = 32, ANCHOR_Y = 0;
const SAFE = { top: 80, bottom: 96, side: 24 };
const PX = (x, y) => (x - y) * HW;
const PY = (x, y, z) => (x + y) * HH - z * ZP;
function resize() {
  VW = innerWidth; VH = innerHeight; DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  SAFE.bottom = VW < 640 ? 128 : 96; SAFE.top = VW < 640 ? 72 : 80; SAFE.side = VW < 640 ? 16 : 24;
  // Grid scale: the branch fan (~6.6 tiles wide) and ~8 tiles of height must fit the safe area.
  const maxTW = 64 + clamp((VH - 720) / 30, 0, 12);
  const tw = Math.min((VW - SAFE.side * 2) / (VW < 640 ? 7.4 : 6.8), (VH - SAFE.top - SAFE.bottom) / 7.6, maxTW);
  TW = clamp(Math.floor(tw / 4) * 4, 36, 80); HW = TW / 2; HH = TW / 4; ZP = TW / 2;
  ANCHOR_Y = Math.round((SAFE.top + VH - SAFE.bottom) / 2);
  for (const b of boxes.values()) b.pd = true;
  geomDirty = true; hudRect = null;
  buildClouds();
}

// ═══════════════════════ Live boxes ═══════════════════════
const boxes = new Map();
let layout = null, geomDirty = true;
function mkBox(s) {
  return { id: s.id, d: { ...s.g }, dd: { ...s.g }, tw: null, enter: null, ap: 1, dying: 0, pd: true,
