<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Brain 3D</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/dolphin.css">
<style>
  :root {
    color-scheme: dark;
    --prog: #FF9F43; --prog-shadow: #C2650F; --ready: #FFF44E; --ready-shadow: #D2AE00;
  }
  html, body { overflow: hidden; }
  body {
    color: var(--foam);
    background-color: #061B44;
    background-image: radial-gradient(ellipse 78% 72% at 50% 47%, #0F3878 0%, #0A2B64 40%, #071F4C 70%, #04122F 100%);
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* Status (top-left): the one piece of chrome at rest. The back crumb joins it only inside a region. */
  .status {
    position: fixed; top: 24px; left: 24px; z-index: 20; display: grid; justify-items: start; pointer-events: none;
    opacity: 0; transform: translateY(-6px); transition: opacity 600ms ease, transform 600ms cubic-bezier(.2,.9,.3,1);
    text-shadow: 0 1px 14px rgba(5, 22, 54, 0.7);
  }
  .status.show { opacity: 1; transform: none; }
  .status-main { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .status-main b { font-family: var(--font-head); font-weight: normal; font-size: 32px; line-height: 1; color: var(--foam); display: inline-block; }
  .status-main span { font-weight: 700; font-size: 16px; color: var(--mist); }
  .status-sub { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--cloud); }
  .status-sub b { color: var(--foam); display: inline-block; }
  .pop { animation: pop 520ms cubic-bezier(.2,.9,.3,1.4); }
  @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .hint { margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--cloud); transition: opacity 900ms ease; }
  .hint.gone { opacity: 0; }
  .crumbs { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: auto; }
  .crumbs:empty { display: none; }
  .crumb {
    font: 800 13px/1 var(--font-body); color: var(--foam); background: rgba(10, 35, 79, 0.62);
    border: 1.5px solid rgba(158, 223, 255, 0.2); border-radius: 999px; padding: 8px 12px; cursor: pointer;
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3); text-shadow: none; transition: transform 120ms ease, background 150ms ease;
  }
  .crumb:hover { transform: translateY(1px); background: rgba(47, 154, 230, 0.3); }
  .crumb:focus-visible { outline: 3px solid rgba(95, 198, 247, 0.5); outline-offset: 2px; }
  .here { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 13px; color: var(--foam); }
  .here i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .here span { color: var(--cloud); }

  /* Hover tooltip */
  .tip {
    position: fixed; z-index: 25; pointer-events: none; max-width: 240px; left: 0; top: 0;
    background: rgba(10, 35, 79, 0.97); color: var(--foam); border: 1px solid rgba(158, 223, 255, 0.24);
    border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 700; line-height: 1.35;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3); opacity: 0; transition: opacity 90ms ease;
  }
  .tip.show { opacity: 1; }
  .tip b { display: block; font-weight: 800; font-size: 13px; }
  .tip .st { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-weight: 700; font-size: 13px; }
  .tip .st i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .tip .act { display: block; margin-top: 4px; color: var(--sun); font-size: 13px; font-weight: 800; }

  /* The one recommended next step. Anchored to its neuron by script; Dolphin's 3D press button. */
  .next {
    position: fixed; left: 0; top: 0; z-index: 22; height: 36px; padding: 0 14px 0 13px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer;
    font: 800 14px/1 var(--font-body); color: var(--ink);
    background: var(--prog); border: 2px solid var(--prog-shadow);
    box-shadow: 0 3px 0 var(--prog-shadow), 0 8px 22px rgba(2, 10, 30, 0.35);
    opacity: 0; pointer-events: none; will-change: transform;
    transition: opacity 260ms ease, box-shadow 120ms ease, filter 120ms ease, translate 120ms ease;
  }
  .next.ready { background: var(--ready); border-color: var(--ready-shadow); box-shadow: 0 3px 0 var(--ready-shadow), 0 8px 22px rgba(2, 10, 30, 0.35); }
  .next.show { opacity: 1; pointer-events: auto; }
  .next.hot { filter: brightness(1.06); box-shadow: 0 3px 0 var(--prog-shadow), 0 0 0 5px rgba(255, 159, 67, 0.24), 0 8px 22px rgba(2, 10, 30, 0.35); }
  .next.ready.hot { box-shadow: 0 3px 0 var(--ready-shadow), 0 0 0 5px rgba(255, 244, 78, 0.22), 0 8px 22px rgba(2, 10, 30, 0.35); }
  .next:active { translate: 0 3px; box-shadow: 0 0 0 transparent, 0 6px 18px rgba(2, 10, 30, 0.3); }
  .next:focus-visible { outline: 3px solid rgba(255, 244, 78, 0.55); outline-offset: 3px; }
  .next .k { opacity: 0.72; }
  .next .lbl { max-width: min(260px, 52vw); overflow: hidden; text-overflow: ellipsis; }
  .next .chev { font-size: 17px; margin-left: 1px; transform: translateY(-1px); }

  @media (max-width: 700px) {
    .status { top: 16px; left: 16px; right: 16px; }
    .crumb { font-size: 12px; padding: 7px 10px; }
    .next { height: 34px; font-size: 13px; padding: 0 12px 0 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .status, .tip, .hint, .next { transition: none; }
    .pop { animation: none; }
  }
</style>
</head>
<body>
<canvas id="view" role="img" aria-label="Your second brain in 3D: every SAT lesson is a neuron inside a brain region. Move the pointer to look around; point at a region to zoom in, and away to zoom out."></canvas>

<header class="status" id="hud" aria-live="polite">
  <div class="status-main"><b id="hudFiring">0</b><span>/ <span id="hudTotal">89</span> neurons firing</span></div>
  <div class="status-sub">Projected <b id="hudScore">400</b></div>
  <div class="hint" id="hint" hidden></div>
  <nav class="crumbs" id="crumbs" aria-label="Brain path"></nav>
</header>
<button class="next" id="next" type="button"><span class="k">Next:</span><span class="lbl" id="nextLbl"></span><span class="chev" aria-hidden="true">›</span></button>
<div class="tip" id="tip"></div>

<script type="module">
/*
 * Sound design — Brain 3D (reuses the Second Brain palette: warm analog synth, synaptic clicks)
 * Music: the shared procedural score in its calm register. A low pad and heartbeat while the scan runs,
 *   a pulsing arpeggio as learned neurons switch on, the full swell at the moment the whole brain lights,
 *   then a steady pulse. setIntensity follows how much of the brain is firing and whether you are inside
 *   a region; finishing a lesson gives it a short lift.
 * SFX (score.sfx), each fired on the frame its visual happens:
 *   hover    – soft synaptic click (the pointer snaps to a neuron; a region's name appears as you lean in)
 *   select   – glassy tap (lesson card opens)                                     [lesson-card.js]
 *   back     – the same tap, lower (Esc, the back crumb, closing the card)
 *   zoomIn   – airy upward whoosh (the camera commits into a region and turns to face it)
 *   zoomOut  – the same whoosh falling (the camera pulls back to the whole brain)
 *   start    – short charge-up (Start lesson)                                      [lesson-card.js]
 *   complete – electric surge + bright chime (the neuron ignites green)            [lesson-card.js]
 *   unlock   – gentle rising spark (a dormant neuron wakes up yellow)
 *   riser    – ~2.2s sweep (every learned neuron is on; the frontier charges)
 *   intro    – deep hit + crackle (the whole brain fully lights)
 *   step     – tiny blip (a learned neuron switches on during the scan; a cascade pulse lands)
 */
import { createGraph, pct, clamp } from '../shared/graph.js';
import { mountChrome, params } from '../shared/chrome.js';
import { createLessonCard } from '../shared/lesson-card.js';

// QA: ?debug=1 records frame stats and errors into the DOM.
const dbgEl = params.has('debug') ? Object.assign(document.createElement('pre'), { id: 'dbg', hidden: true }) : null;
if (dbgEl) { document.body.append(dbgEl); addEventListener('error', (e) => { dbgEl.textContent += `ERROR ${e.message} @${e.lineno}:${e.colno}\n`; }); }

// ════════════════════════ Basics ════════════════════════
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const noHover = matchMedia('(hover: none)').matches;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
function mulberry32(a) {
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const rand = mulberry32(0xB3A1D3);   // layout (deterministic)
const frand = Math.random;            // live simulation
function hex(c) { const v = parseInt(c.slice(1), 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; }
function mix(a, b, t) { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function rgba(c, a) { const [r, g, b] = hex(c); return `rgba(${r},${g},${b},${a})`; }
function hash3(i, j, k) {
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(k, 1440662683)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise3(x, y, z) {
  const i = Math.floor(x), j = Math.floor(y), k = Math.floor(z), fx = x - i, fy = y - j, fz = z - k;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy), w = fz * fz * (3 - 2 * fz);
  const a = lerp(lerp(hash3(i, j, k), hash3(i + 1, j, k), u), lerp(hash3(i, j + 1, k), hash3(i + 1, j + 1, k), u), v);
  const b = lerp(lerp(hash3(i, j, k + 1), hash3(i + 1, j, k + 1), u), lerp(hash3(i, j + 1, k + 1), hash3(i + 1, j + 1, k + 1), u), v);
  return lerp(a, b, w) * 2 - 1;
}
// Gyri: zero-contours of a domain-warped noise field on the cortex.
function gyri(x, y, z) {
  const S = 66, Q = S * 1.8;
  const wx = vnoise3(x / Q + 11.3, y / Q + 3.1, z / Q + 7.4), wy = vnoise3(x / Q + 5.2, y / Q + 19.7, z / Q + 1.9), wz = vnoise3(x / Q + 23.1, y / Q + 8.8, z / Q + 14.2);
  return vnoise3(x / S + 1.45 * wx, y / S + 1.45 * wy, z / S + 1.45 * wz) + 0.2 * vnoise3(x / (S * 0.45) + 40, y / (S * 0.45) + 9, z / (S * 0.45) + 3);
}

const C = {
  foam: '#FFFFFC', mist: '#D9E4F2', cloud: '#B7C0CC', wave1: '#9EDFFF', wave2: '#5FC6F7', wave3: '#2F9AE6',
  nightInk: '#0A234F', abyss: '#051636', sun: '#FFF44E', green: '#3FA669', orange: '#FF9F43',
};
const STATE = {
  mastered: { col: C.green, text: '#8FE3AE', edge: '#A9E8C1' },
  progress: { col: C.orange, text: '#FFC58C', edge: '#FFB36B' },
  ready: { col: C.sun, text: C.sun, edge: '#FFF7A0' },
  locked: { col: '#6F82A6', text: C.cloud, edge: C.cloud },
};
const HEAD = '"VAG Rundschrift D", "Manrope", system-ui, sans-serif';
const BODY = '"Manrope", system-ui, sans-serif';
const SHELL = mix(C.wave1, C.wave2, 0.3);
const GLASS = '#A9BEDC';   // unfilled glass: a neutral steel blue, so every region colour reads against it

// ════════════════════════ Brain model (world units; x: front → back, y: up, z: left → right) ════════════════════════
// Each hemisphere is a union of four deformed ellipsoids, flattened on the medial side; the cerebellum is
// two more, and the brain stem is a tapered column. Neurons live in the left hemisphere, which faces you.
const HEMI = [
  ['main', 30, 90, 118, 455, 235, 215, 0.52],
  ['front', -250, 66, 114, 236, 206, 200, 0.55],
  ['occ', 300, 66, 108, 212, 198, 182, 0.58],
  ['temp', -50, -118, 152, 292, 124, 172, 0.42],
];
const ELL = [];
for (const side of [-1, 1]) {
  for (const [key, x, y, zm, ax, ay, az, med] of HEMI) ELL.push({ key, side, c: [x, y, side * zm], a: [ax, ay, az], med, cb: false });
  ELL.push({ key: 'cb', side, c: [330, -222, side * 96], a: [160, 96, 142], med: 0.72, cb: true });
}
function ellF(E, x, y, z) {
  const dx = (x - E.c[0]) / E.a[0], dy = (y - E.c[1]) / E.a[1], rz = z - E.c[2];
  const dz = rz / (rz * E.side > 0 ? E.a[2] : E.a[2] * E.med);
  return dx * dx + dy * dy + dz * dz;
}
function ellArea(E) { const a = E.a[0], b = E.a[1], c = E.a[2] * (1 + E.med) / 2, p = 1.6075; return 4 * Math.PI * Math.pow((Math.pow(a * b, p) + Math.pow(a * c, p) + Math.pow(b * c, p)) / 3, 1 / p); }
function randDir() {
  for (;;) { const x = rand() * 2 - 1, y = rand() * 2 - 1, z = rand() * 2 - 1, d = x * x + y * y + z * z; if (d > 0.01 && d <= 1) { const k = 1 / Math.sqrt(d); return [x * k, y * k, z * k]; } }
}
// Lobes, read off the lateral surface: central sulcus slants forward, the parieto-occipital line is near-vertical.
function lobeOf(E, x, y) {
  if (E.cb) return 3;
  if (E.key === 'temp' && x < 250) return 4;
  const xc = -70 + (clamp(y, -60, 330) + 10) * (110 / 340);
  const xpo = 292 - (y - 80) * 0.12;
  return x < xc ? 0 : x < xpo ? 1 : 2;
}
const BASE = { yaw: -14 * DEG, pitch: -13 * DEG };
const ORBIT = { yaw: 35 * DEG, pitch: 20 * DEG };
const REG_AMP = 0.4;
function facingAt(yaw, pitch, nx, ny, nz) {
  const z1 = -nx * Math.sin(yaw) + nz * Math.cos(yaw);
  return -(ny * Math.sin(pitch) + z1 * Math.cos(pitch));
}

// Region palette: one saturated colour per SAT domain, kept clear of the lesson-state colours (mastered green
// #3FA669, in progress orange #FF9F43, ready yellow #FFF44E) so a neuron always reads on top of its region.
// Neighbouring lobes get contrasting hues; all sit in Dolphin's cool blue family plus one warm accent.
//   Algebra                → frontal lobe    azure    #3E9BFF
//   Advanced Math          → parietal lobe   violet   #A57BFF
//   Problem Solving & Data → occipital lobe  aqua     #2ED3E6
//   Geometry & Trig        → cerebellum      indigo   #6E79FF
//   Reading & Writing      → temporal lobe   magenta  #F062BE
const REGIONS = [
  { key: 'frontal', domain: 'Algebra', lobe: 'Frontal lobe', pose: [-30, -10], zMax: 1.9, color: '#3E9BFF', out: [-1, 0.15, 0] , short: 'Algebra' },
  { key: 'parietal', domain: 'Advanced Math', lobe: 'Parietal lobe', pose: [-6, -32], zMax: 1.9, color: '#A57BFF', out: [0, 1, 0] , short: 'Advanced Math' },
  { key: 'occipital', domain: 'Problem Solving & Data', lobe: 'Occipital lobe', pose: [30, -10], zMax: 1.9, color: '#2ED3E6', out: [1, 0.25, 0] , short: 'Problem Solving' },
  { key: 'cerebellum', domain: 'Geometry & Trig', lobe: 'Cerebellum', pose: [34, 16], zMax: 2.6, color: '#6E79FF', out: [0.7, -1, 0] , short: 'Geometry' },
  { key: 'temporal', domain: 'Reading & Writing', lobe: 'Temporal lobe', pose: [-14, 10], zMax: 1.55, color: '#F062BE', out: [-0.25, -1, 0] , short: 'Reading' },
];
REGIONS.forEach((R, i) => { R.i = i; R.pose = [R.pose[0] * DEG, R.pose[1] * DEG]; });

// A surface point on ellipsoid E from a unit direction, nudged along its normal so the shell is not perfectly smooth.
function surfacePoint(E, ux, uy, uz) {
  const az = uz * E.side > 0 ? E.a[2] : E.a[2] * E.med;
  let x = E.c[0] + ux * E.a[0], y = E.c[1] + uy * E.a[1], z = E.c[2] + uz * az;
  let nx = ux / E.a[0], ny = uy / E.a[1], nz = uz / az;
  const nl = Math.hypot(nx, ny, nz); nx /= nl; ny /= nl; nz /= nl;
  const bump = 9 * vnoise3(x / 240 + 3, y / 240 + 7, z / 240 + 1);
  return [x + nx * bump, y + ny * bump, z + nz * bump, nx, ny, nz];
}
const insideOthers = (ei, x, y, z) => { for (let j = 0; j < ELL.length; j++) if (j !== ei && ellF(ELL[j], x, y, z) < 1) return true; return false; };
// Fill points give the shell its body (and the soft haze); neuron candidates sit ~45 units under the cortex.
const fillC = [];
const nCand = REGIONS.map(() => []);
{
  const areas = ELL.map(ellArea), totalA = areas.reduce((a, b) => a + b, 0);
  ELL.forEach((E, ei) => {
    const n = Math.round(40000 * areas[ei] / totalA);
    for (let k = 0; k < n; k++) {
      const [ux, uy, uz] = randDir();
      const sp = surfacePoint(E, ux, uy, uz);
      const [x, y, z, nx, ny, nz] = sp;
      if (insideOthers(ei, x, y, z)) continue;
      const region = lobeOf(E, x, y);
      const medial = !E.cb && nz * E.side < -0.5;
      if (rand() < (medial ? 0.05 : 0.14)) fillC.push([x, y, z, nx, ny, nz, region, 1]);
      if (E.side < 0 && facingAt(BASE.yaw, BASE.pitch, nx, ny, nz) > (E.cb ? -0.05 : 0.22) && rand() < 0.45) {
        const d = 40 + rand() * 16;
        nCand[region].push([x - nx * d, y - ny * d, z - nz * d]);
      }
    }
  });
}
// Gyri: marching squares over each ellipsoid's (θ, φ) grid → contour segments in 3D, shared vertices.
// The same pass traces the region borders: the central sulcus and parieto-occipital line (zero lines of
// x − boundary(y)) and the creases where the temporal lobe and cerebellum meet the rest (zero line of the union).
const GV = [];   // vertices: [x, y, z, nx, ny, nz]
const GS = [];   // segments: [vi, vj, region, kind, base]  (kind 0 = gyrus, 2 = cerebellar folium, 3 = stem)
const GB = [];   // region borders: [vi, vj]
{
  const CELL = 12.5;
  ELL.forEach((E, ei) => {
    const mr = (E.a[0] + E.a[1] + E.a[2] * (1 + E.med) / 2) / 3;
    const nt = Math.max(16, Math.round((Math.PI * mr) / CELL)), nf = Math.max(32, Math.round((TAU * mr) / CELL));
    const P = [], val = new Float32Array((nt + 1) * nf), ok = new Uint8Array((nt + 1) * nf);
    for (let i = 0; i <= nt; i++) for (let j = 0; j < nf; j++) {
      const th = (i / nt) * Math.PI, ph = (j / nf) * TAU;
      const ux = Math.sin(th) * Math.cos(ph), uy = Math.cos(th), uz = Math.sin(th) * Math.sin(ph);
      const sp = surfacePoint(E, ux, uy, uz), id = i * nf + j;
      P[id] = sp;
      ok[id] = !insideOthers(ei, sp[0], sp[1], sp[2]) && (E.cb || sp[5] * E.side > -0.45) ? 1 : 0;
      val[id] = E.cb ? Math.sin(Math.asin(clamp(uy, -1, 1)) * 9.5 + 0.8 * vnoise3(sp[0] / 90, sp[1] / 90, sp[2] / 90)) : gyri(sp[0], sp[1], sp[2]);
    }
    function march(vals, cellOk, emit) {
      const cache = new Map();
      const vert = (a, b) => {
        const key = a < b ? a * 1e6 + b : b * 1e6 + a;
        let v = cache.get(key);
        if (v !== undefined) return v;
        const t = vals[a] / (vals[a] - vals[b]), A = P[a], B = P[b];
        let nx = lerp(A[3], B[3], t), ny = lerp(A[4], B[4], t), nz = lerp(A[5], B[5], t);
        const nl = Math.hypot(nx, ny, nz) || 1;
        v = GV.length; GV.push([lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t), nx / nl, ny / nl, nz / nl]);
        cache.set(key, v);
        return v;
      };
      const seg = (a, b, c, d) => emit(vert(a, b), vert(c, d));
      for (let i = 0; i < nt; i++) for (let j = 0; j < nf; j++) {
        const j1 = (j + 1) % nf, tl = i * nf + j, tr = i * nf + j1, br = (i + 1) * nf + j1, bl = (i + 1) * nf + j;
        if (!cellOk(tl, tr, br, bl)) continue;
        const c = (vals[tl] > 0 ? 8 : 0) | (vals[tr] > 0 ? 4 : 0) | (vals[br] > 0 ? 2 : 0) | (vals[bl] > 0 ? 1 : 0);
        if (c === 0 || c === 15) continue;
        switch (c) {
          case 1: case 14: seg(tl, bl, bl, br); break;
          case 2: case 13: seg(bl, br, tr, br); break;
          case 3: case 12: seg(tl, bl, tr, br); break;
          case 4: case 11: seg(tl, tr, tr, br); break;
          case 6: case 9: seg(tl, tr, bl, br); break;
          case 7: case 8: seg(tl, bl, tl, tr); break;
          case 5: seg(tl, bl, tl, tr); seg(bl, br, tr, br); break;
          case 10: seg(tl, tr, tr, br); seg(tl, bl, bl, br); break;
        }
      }
    }
    const allOk = (a, b, c, d) => ok[a] && ok[b] && ok[c] && ok[d];
    march(val, allOk, (va, vb) => {
      const A = GV[va], B = GV[vb];

  if (focus !== root) renderCrumbs();
}

// ════════════════════════ Intro timeline ════════════════════════
Object.assign(intro, { labels: 0, regionLabels: 0 });
function introEvents() {
  return [
    { t: 0, run: () => score.setIntensity(0.12, 0.6) },
    { t: T.on0, run: () => { hudEl.classList.add('show'); score.setIntensity(0.5, T.on1 - T.on0); }, settle: () => hudEl.classList.add('show') },
    { t: T.riser, run: () => { score.sfx('riser'); score.setIntensity(0.68, T.impact - T.riser); } },
    { t: T.impact, run: impactNow, settle: () => { for (const N of lessons) N.on = true; refreshLive(); } },
    { t: T.end, run: finishIntro, settle: finishIntro },
  ];
}
function impactNow() {
  const now = performance.now();
  score.sfx('intro');
  intro.wave = reduceMotion ? 0 : 1;
  for (const N of lessons) {
    if (!N.on) { N.on = true; if (isFrontierKey(vkey(N))) { N.wake = 0.9; N.fromKey = 'off'; N.fade = 1; } }
    if (vkey(N) === 'mastered') N.spike = 0.6 + frand() * 0.6;
  }
  refreshLive();
  for (let i = 0; i < 24 && liveEdges.length; i++) { const e = liveEdges[Math.floor(frand() * liveEdges.length)]; spawn(e, frand() < 0.5, K.ambient); }
  caption('This is your second brain.', 3600);
  score.setIntensity(0.85, 0.4);
  boost = 0.25;
}
function finishIntro() {
  if (introDone) return;
  introDone = true; navOn = true;
  for (const N of lessons) { N.revealed = true; N.on = true; }
  refreshLive();
  setHudTargets(undefined, intro.offset >= T.end);
  if (intro.offset >= T.end) for (const R of REGIONS) R.fillM = R.dom.m;
  hudEl.classList.add('show');
  setNext(pickNext(), false);
  if (!params.get('demo')) showHint();
}
function startIntro() {
  intro.started = true; intro.t0 = performance.now();
  intro.events = introEvents();
  const off = intro.offset;
  for (const N of lessons) N.on = N.n.state === 'locked';
  if (off > 0) for (const ev of intro.events) if (ev.t < off) { ev.fired = true; ev.settle?.(); }
}
function introUpdate(now, dt) {
  if (!intro.started) {
    intro.ghost = 0.32; intro.lit = 0; intro.activity = 0; intro.labels = 0; intro.regionLabels = 0; intro.scanX = -1e4;
    intro.yawOff = reduceMotion ? 0 : INTRO_YAW; intro.pitchOff = reduceMotion ? 0 : INTRO_PITCH; intro.sMul = reduceMotion ? 1 : INTRO_S;
    return;
  }
  const t = (now - intro.t0) / 1000 + intro.offset;
  intro.t = t;
  for (const ev of intro.events) if (!ev.fired && t >= ev.t) { ev.fired = true; ev.run(); }
  const sk = clamp((t - T.scan0) / Math.max(0.01, T.scan1 - T.scan0), 0, 1);
  intro.scanX = t >= T.scan1 ? 1e4 : lerp(SCAN[0], SCAN[1], easeInOut(sk));
  if (reduceMotion) intro.scanX = 1e4;
  for (const N of lessons) if (!N.revealed && N.p[0] <= intro.scanX) { N.revealed = true; if (!reduceMotion) N.ping = 0.6; }
  // Learned neurons switch on in the order you mastered them; the counter follows.
  let onCount = 0;
  for (const N of journeyOn) {
    if (!N.on && t >= N.onAt && N.revealed) { N.on = true; N.ping = 1; score.sfx('step'); refreshLive(); }
    if (N.on) onCount++;
  }
  if (!introDone) {
    const s = graph.stats();
    hud.firing = onCount; hud.score = Math.round((400 + (s.score - 400) * (onCount / Math.max(1, s.mastered))) / 10) * 10; renderHud();
  }
  // The frontier charges during the riser.
  if (t >= T.riser && t < T.impact) { const k = (t - T.riser) / (T.impact - T.riser); for (const N of lessons) if (!N.on && N.n.state === 'frontier') N.charge = k * k; }
  else for (const N of lessons) N.charge = 0;
  intro.ghost = t < T.on0 ? 0.5 : 0.42;
  intro.lit = t < T.impact ? lerp(0.35, 0.7, clamp((t - T.on0) / (T.impact - T.on0), 0, 1)) : Math.min(1, 0.7 + (t - T.impact) * 1.5);
  intro.activity = t < T.on1 ? 0 : t < T.impact ? 0.4 : 1;
  const e = reduceMotion ? 1 : easeInOut(clamp(t / T.turn, 0, 1));
  intro.yawOff = lerp(INTRO_YAW, 0, e) * (reduceMotion ? 0 : 1);
  intro.pitchOff = lerp(INTRO_PITCH, 0, e) * (reduceMotion ? 0 : 1);
  intro.sMul = reduceMotion ? 1 : lerp(INTRO_S, 1, e);
  intro.labels = clamp((t - T.impact - 0.3) / 0.6, 0, 1);
  intro.regionLabels = clamp((t - T.on0 - 0.3) / 0.8, 0, 1);
  intro.wave = Math.max(0, intro.wave - dt * 1.1);
}

// ════════════════════════ Music follows activity and depth ════════════════════════
let musicAt = 0;
function musicUpdate(now, dt) {
  boost = Math.max(0, boost - dt * 0.08);
  if (!introDone || now < musicAt) return;
  musicAt = now + 500;
  const act = clamp(fireRate / 12, 0, 1);
  score.setIntensity(clamp(0.3 + 0.2 * root.m + (focus === root ? 0 : 0.12) + 0.12 * act + boost, 0, 1), 2.5);
}

// ════════════════════════ Input ════════════════════════
function movePointer(x, y, now, overUI = false) {
  const d = Math.hypot(x - pointer.x, y - pointer.y);
  if (pointer.in && d > 0.5) { const gap = Math.max(8, now - pointer.lastMoveAt); pointer.speed = lerp(pointer.speed, (d / gap) * 1000, clamp(gap / 60, 0.2, 1)); pointer.lastMoveAt = now; nav.sinceRest += d; if (now >= lockUntil) pointer.travel += d; if (hint.shownAt && now - hint.shownAt > 500) dismissHint(); }
  pointer.x = x; pointer.y = y; pointer.in = true; pointer.real = true; pointer.overUI = overUI;
  updateHover(); setCursor(); // hover feedback the moment the pointer moves, not a frame later
}
addEventListener('pointermove', (e) => { if (e.pointerType !== 'touch') { pointer.parked = false; movePointer(e.clientX, e.clientY, performance.now(), e.target !== cv); } });
document.addEventListener('pointerleave', () => { pointer.in = false; updateHover(); });
document.documentElement.addEventListener('mouseleave', () => { pointer.in = false; updateHover(); });
cv.addEventListener('pointerup', (e) => {
  if (!navOn) return;
  const x = e.clientX, y = e.clientY, touch = e.pointerType === 'touch';
  if (touch) { pointer.x = x; pointer.y = y; }
  let leaf;
  if (touch && focus === root) {
    // On a phone the zoomed-out neurons are tiny: a tap opens the recommended one, otherwise it zooms in.
    leaf = nextN && Math.hypot(x - nextN.sx, y - nextN.sy) < 28 ? nextN : null;
  } else leaf = leafAt(x, y, hoverLeaf);
  if (leaf) { card.open(leaf.n); return; }
  const R = regionAt(x, y);
  if (focus === root) { if (R) setFocus(R.dom); return; }
  if (R && R !== focus.R) { setFocus(R.dom); return; }
  if (!R && touch) setFocus(root, { sound: 'back' });
});
addEventListener('keydown', (e) => {
  if (!navOn) return;
  if (e.key === 'Escape' && !cardOpen && performance.now() - lastCardClose > 80 && focus !== root) setFocus(root, { sound: 'back' });
});

// ════════════════════════ QA params & loop ════════════════════════
const demo = params.get('demo');
intro.offset = params.has('t') ? parseFloat(params.get('t')) || 0 : demo ? 99 : 0;
const findRegion = (s) => { s = (s || '').toLowerCase(); return (REGIONS.find((R) => R.key === s || R.domain.toLowerCase().startsWith(s)) || REGIONS[0]).dom; };
const findLesson = (s) => graph.leaves.find((l) => l.label.toLowerCase() === (s || '').toLowerCase());
function parkPointer() {
  if (!params.has('px') && !params.has('py')) return;
  const v = (k, full) => { const q = parseFloat(params.get(k)); return Number.isFinite(q) ? (q <= 1 ? q * full : q) : full / 2; };
  pointer.parked = true;
  movePointer(v('px', W), v('py', H), performance.now());
}
function runDemo() {
  if (demo === 'full') {
    // QA: every lesson mastered, so every region is full.
    for (const l of graph.leaves) if (!l.mastered) { l.mastered = true; l.progress = 1; l.masteredAt = new Date(); }
    graph.recompute();
    for (const N of lessons) { N.hold = null; N.on = true; }
    refreshLive(); setHudTargets(undefined, true); setNext(null);
  }
  if (demo === 'region' || demo === 'hover') setFocus(findRegion(params.get('region') || (demo === 'hover' ? nextN?.R.key : 'algebra')), { quiet: true });
  if (demo === 'complete') {
    const l = findLesson(params.get('lesson')) || nextN?.n;
    if (l) card.open(l);
    setTimeout(() => card.el.querySelector('.actions .kg-btn.primary')?.click(), 450);
  }
  snapCamera();
  if (demo === 'hover') {
    const F = focus.R;
    forcedHover = F.neurons.find((N) => N === nextN) || F.neurons.find((N) => isFrontierKey(vkey(N))) || F.neurons[0];
  }
  if (demo === 'next') { pill.forceHot = true; setTimeout(() => { if (pill.rect) { pointer.parked = true; movePointer((pill.rect[0] + pill.rect[2]) / 2, (pill.rect[1] + pill.rect[3]) / 2, performance.now()); } }, 400); }
  parkPointer();
}

renderHud();
VP = viewport();
snapCamera();
let last = performance.now(), paused = false, demoRan = false;
function tick(now) {
  now = Math.max(now, last);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = clock = now;
  VP = viewport();
  introUpdate(now, dt);
  if (introDone && !demoRan) { demoRan = true; runDemo(); }
  handlePointer(now);
  computeTargets(dt);
  animate(dt, now);
  simulate(dt, now);
  draw(now, dt);
  hudUpdate(now);
  musicUpdate(now, dt);
}
let dbgFrames = 0, dbgAt = 0;
function frame() {
  const now = performance.now();
  if (!paused) { tick(now); const ms = performance.now() - now; perf.n++; perf.sum += ms; perf.max = Math.max(perf.max, ms); }
  if (dbgEl) { dbgFrames++; if (now - dbgAt > 1000) { dbgEl.textContent += `t=${(now / 1000).toFixed(1)} frames=${dbgFrames} pulses=${pulses.length} focus=${focus.label}\n`; dbgFrames = 0; dbgAt = now; } }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// If rAF goes quiet (background tab in some headless modes), keep time moving from a timer.
setInterval(() => { const now = performance.now(); if (!paused && !document.hidden && now - last > 120) tick(now); }, 16);
window.__b3 = {
  graph, regions: REGIONS, lessons, topics, cam, orb, V, card, setFocus, snapCamera, movePointer, tick, NP: () => NP, counts: () => ({ NP, NV, NGV, segs: GS.length, cand: nCand.map((c) => c.length) }),
  regionScreen: (key) => { const R = REGIONS.find((r) => r.key === key); return [R.sx, R.sy]; },
  lessonScreen: (name) => { const N = lessons.find((n) => n.n.label === name); return [N.sx, N.sy]; },
  nextScreen: () => (nextN ? [nextN.sx, nextN.sy] : null),
  pillRect: () => (pill.rect ? pill.rect.map(Math.round) : null),
  get focus() { return focus.label; }, get next() { return nextN?.n.label; }, get hover() { return hoverLeaf?.n.label; }, get pulses() { return pulses.length; },
  pause(v) { paused = v; last = performance.now(); },
  perf() { const r = { frames: perf.n, avgMs: +(perf.sum / Math.max(1, perf.n)).toFixed(2), maxMs: +perf.max.toFixed(2) }; Object.assign(perf, { n: 0, sum: 0, max: 0 }); return r; },
};
