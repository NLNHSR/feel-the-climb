<!doctype html>
<!--
  Sound design (Uncharted)
  Music: adventurous, oceanic, curious. Low strings and a soft pulse of hand percussion under a
  warm pad; calm and spacious over explored water, lifting as the cursor explores the cloud edge,
  swelling to a full, bright section when clouds part (intro and every completion).
  Events (score.sfx):
    hover    - soft water droplet (cursor finds a beacon or an island)
    select   - wooden map-pin tap (a beacon opens its lesson card)
    back     - low, short paper fold (Esc / "Whole chart" / closing the card)
    zoomIn   - gentle sail filling with wind, rising
    zoomOut  - the same breath of wind, falling away
    peek     - airy shimmer, like mist thinning (clouds first thin under the cursor)
    step     - oar dip / hull creak (the boat sets off or arrives at a harbour)
    start    - rope pulled taut, short rising strings (lesson begins)
    complete - rushing wind + reveal swell (clouds part over newly explored land)
    unlock   - distant lighthouse bell (a new beacon tower lights)
    riser    - rolling timpani + string tremolo, building (intro: the cloud cover gathers)
    intro    - deep horn + full-orchestra hit, then wind (intro: the clouds burst open)
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Uncharted Sea Chart</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="../shared/dolphin.css" />
<style>
  :root { color-scheme: light; --space: 8px; --ease: cubic-bezier(.2,.8,.2,1); }
  html, body { overflow: hidden; background: #2F9AE6; }
  body { color: var(--ink); }
  #chart { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* Type scale: 20 / 15 / 12. Spacing on an 8px grid. */
  .hud { position: fixed; top: 16px; left: 16px; z-index: 20; display: grid; gap: var(--space); justify-items: start; pointer-events: none;
    transition: opacity 600ms var(--ease); }
  body.intro-hud .hud { opacity: 0; }

  /* Explored → projected score → goal, in one element. */
  .score { width: 304px; box-sizing: border-box; background: var(--foam); border: 1px solid var(--mist); border-radius: 16px; padding: 12px 16px 8px;
    box-shadow: 0 2px 0 var(--chrome-shadow); }
  .score .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .score .explored { font-family: var(--font-head); font-size: 15px; line-height: 20px; white-space: nowrap; }
  .score .explored b { font-weight: normal; color: var(--wave-shadow); }
  .score .goal-l { font-size: 12px; line-height: 16px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .track { position: relative; height: 24px; margin-top: 8px; }
  .track .rail { position: absolute; left: 0; right: 0; top: 9px; height: 6px; border-radius: 3px; background: var(--paper); }
  .track .fill { position: absolute; left: 0; top: 9px; height: 6px; border-radius: 3px; background: var(--wave-3); width: 0;
    transition: width 900ms var(--ease); }
  .track .gap { position: absolute; top: 11px; height: 0; border-top: 2px dashed var(--cloud); transition: left 900ms var(--ease), width 900ms var(--ease); }
  .track .you { position: absolute; top: 4px; width: 16px; height: 16px; margin-left: -8px; box-sizing: border-box; border-radius: 50%;
    background: var(--foam); border: 3px solid var(--wave-shadow); transition: left 900ms var(--ease); }
  .track .flag { position: absolute; top: -4px; width: 14px; height: 24px; margin-left: -1px; }
  .labels { position: relative; height: 16px; margin-top: 2px; font-size: 12px; line-height: 16px; font-weight: 700; color: var(--muted); }
  .labels span { position: absolute; top: 0; white-space: nowrap; transition: left 900ms var(--ease); }
  .labels .you-l { color: var(--ink); }
  .labels .togo { color: var(--wave-shadow); }

  .back { pointer-events: auto; font: 700 12px/16px var(--font-body); color: var(--ink); background: var(--foam); border: 1px solid var(--mist);
    border-radius: 999px; padding: 8px 16px; cursor: pointer; box-shadow: 0 2px 0 var(--chrome-shadow);
    opacity: 0; visibility: hidden; transform: translateY(-4px); transition: opacity 200ms ease-out, transform 240ms var(--ease), visibility 200ms; }
  .back.show { opacity: 1; visibility: visible; transform: none; }
  .back:hover { background: var(--paper); }
  .back:focus-visible { outline: 3px solid rgba(47, 154, 230, .45); outline-offset: 2px; }

  .hint { position: fixed; top: 16px; left: 50%; transform: translate(-50%, -4px); z-index: 20; pointer-events: none; white-space: nowrap;
    font-size: 12px; line-height: 16px; font-weight: 700; color: var(--ink); background: var(--foam); border: 1px solid var(--mist);
    border-radius: 999px; padding: 8px 16px; box-shadow: 0 2px 0 var(--chrome-shadow); opacity: 0; transition: opacity 400ms ease-out, transform 400ms var(--ease); }
  .hint.show { opacity: 1; transform: translate(-50%, 0); }

  .teaser { position: fixed; left: 0; top: 0; z-index: 25; pointer-events: none; max-width: 240px; padding: 8px 16px; border-radius: 16px;
    background: var(--night-deep); color: var(--foam); opacity: 0; transform: translateY(4px); transition: opacity 180ms ease-out, transform 220ms var(--ease); }
  .teaser.show { opacity: 1; transform: none; }
  .teaser b { display: block; font-family: var(--font-head); font-weight: normal; font-size: 20px; line-height: 24px; }
  .teaser span { display: block; font-size: 12px; line-height: 16px; font-weight: 700; color: var(--mist); }

  @media (max-width: 1100px) { .hint { top: auto; bottom: 72px; } }
  @media (max-width: 640px) {
    .hud { top: 8px; left: 8px; }
    .score { width: min(304px, calc(100vw - 16px)); }
    .hint { white-space: normal; width: max-content; max-width: calc(100vw - 32px); text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) { .hud, .teaser, .hint, .back, .track *, .labels span { transition: none; } }
</style>
</head>
<body class="intro-hud">
<canvas id="chart" role="img" aria-label="An isometric sea chart of your SAT knowledge. Islands are subjects; flags are lessons you have mastered and glowing beacon towers are lessons you are ready for. Clouds cover what you have not explored yet."></canvas>

<header class="hud">
  <section class="score" aria-live="polite">

      <svg class="flag" id="hFlag" viewBox="0 0 14 24"><path d="M1.5 23V2" stroke="#0A234F" stroke-width="2" stroke-linecap="round"/><path d="M2.5 2.5h9.5l-2.6 3.6 2.6 3.6H2.5z" fill="#FFF44E" stroke="#E8BE00" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <div class="you" id="hYou"></div>

<div class="hint" id="hint">Glide toward an island to sail in. Hover the clouds to peek.</div>
<div class="teaser" id="teaser" aria-live="polite"><b></b><span></span></div>

<script type="module">
import { createGraph, DOMAIN_HUES, pct, clamp, projectedScore } from '../shared/graph.js';
import { mountChrome, params } from '../shared/chrome.js';
import { createLessonCard } from '../shared/lesson-card.js';

// ───────────────────────── Basics ─────────────────────────
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOutCubic = (u) => 1 - Math.pow(1 - u, 3);
const easeInCubic = (u) => u * u * u;
const easeInOutSine = (u) => -(Math.cos(Math.PI * u) - 1) / 2;
const easeOutBack = (u) => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };

  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const C = {
  sky: '#CFEFFF', ink: '#0A234F', muted: '#536A86', foam: '#FFFFFC', paper: '#F0F2F5', mist: '#D9E4F2', cloud: '#B7C0CC',
  w1: '#9EDFFF', w2: '#5FC6F7', w3: '#2F9AE6', wsh: '#1E6FBE', night: '#103B84', nightDeep: '#0A2B64', sun: '#FFF44E', sunSh: '#E8BE00', success: '#3FA669',
};
const hexRgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const toHex = (rgb) => '#' + rgb.map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
const mixHex = (a, b, t) => { const A = hexRgb(a), B = hexRgb(b); return toHex(A.map((v, i) => v + (B[i] - v) * t)); };
const rgba = (h, a) => { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; };
// Terrain palette, all derived from Dolphin tokens.
const SAND = mixHex(C.foam, C.sunSh, 0.2);
const SAND_SIDE = [0.42, 0.34, 0.26, 0.2].map((t) => mixHex(SAND, C.muted, t));
const GRASS = mixHex(C.success, C.foam, 0.5);
const PLATEAU = mixHex(C.success, C.foam, 0.36);
const CLIFF = [0.62, 0.52, 0.42, 0.34].map((t) => mixHex(mixHex(SAND, C.success, 0.25), C.ink, t * 0.55));
const GHOST_TOP = mixHex(C.foam, C.mist, 0.7);
const GHOST_SIDE = [0.5, 0.42, 0.34, 0.28].map((t) => mixHex(C.mist, C.muted, t * 0.7));
const TREE = mixHex(C.success, C.ink, 0.18), TREE_LIT = mixHex(C.success, C.foam, 0.25);
const HEAD = '"VAG Rundschrift D", "Manrope", system-ui, sans-serif';
const BODY = '"Manrope", system-ui, sans-serif';
const Q = {
  demo: params.get('demo') || '', intro: params.get('intro'),
  px: params.get('px'), py: params.get('py'),
  d: params.has('d') ? +params.get('d') : null, cd: parseFloat(params.get('cd') || '1.2'), lesson: params.get('lesson'),
  t: parseFloat(params.get('t') || '0') || 0,
};

// ───────────────────────── Graph ─────────────────────────
const graph = createGraph();
const { domains, leaves } = graph;
const leavesOf = (n) => (n.children.length ? n.children.flatMap(leavesOf) : [n]);

// ───────────────────────── Projection ─────────────────────────
// True 2:1 isometric: the chart is laid out on a ground plane rotated 45° to the viewer, which works
// out to x' = x, y' = y/2 − height. Everything below is drawn in these projected units.
const K = 0.5;
const H_SAND = 7, H_GRASS = 24, H_PLAT = 42, H_CLOUD = 52;
const PUFF_W = 270, PUFF_H = 177; // projected size of one cloud puff (before its own scale)
const py = (y, h = 0) => y * K - h;

// ───────────────────────── Canvas + sprites ─────────────────────────
const cv = document.getElementById('chart');
const ctx = cv.getContext('2d');
const landCv = document.createElement('canvas'), lctx = landCv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function sprite(size, stops) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [o, col] of stops) gr.addColorStop(o, col);
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  return c;
}
const GLOW = sprite(128, [[0, 'rgba(255,248,140,0.9)'], [0.25, 'rgba(255,244,78,0.45)'], [0.6, 'rgba(255,244,78,0.12)'], [1, 'rgba(255,244,78,0)']]);
// Cartoon cloud puffs: a cauliflower of circles, lit from above, cool shade on the underside.
const CLOUD_W = 320, CLOUD_H = 210;
const CLOUDS = [11, 23, 37, 41].map((seed) => {
  const rnd = mulberry32(seed), c = document.createElement('canvas'); c.width = CLOUD_W; c.height = CLOUD_H;
  const g = c.getContext('2d'), circles = [];
  const base = 150;
  for (let i = 0; i < 4; i++) circles.push([62 + i * 64 + (rnd() - 0.5) * 14, base - rnd() * 10, 44 + rnd() * 12]);
  for (let i = 0; i < 3; i++) circles.push([98 + i * 62 + (rnd() - 0.5) * 16, base - 52 - rnd() * 14, 48 + rnd() * 14]);
  circles.push([150 + (rnd() - 0.5) * 30, base - 92 - rnd() * 8, 40 + rnd() * 10]);
  const path = new Path2D();
  for (const [x, y, r] of circles) { path.moveTo(x + r, y); path.arc(x, y, r, 0, TAU); }
  g.save(); g.shadowColor = 'rgba(16,59,132,0.22)'; g.shadowBlur = 18; g.shadowOffsetY = 10; g.fillStyle = '#E6EFF8'; g.fill(path); g.restore();
  const gr = g.createLinearGradient(0, 30, 0, 200);
  gr.addColorStop(0, '#FFFFFF'); gr.addColorStop(0.5, '#F6F9FD'); gr.addColorStop(1, '#BBD0E6');
  g.fillStyle = gr; g.fill(path);
  g.save(); g.clip(path); g.fillStyle = 'rgba(255,255,255,0.85)';
  for (const [x, y, r] of circles) { g.beginPath(); g.arc(x - r * 0.12, y - r * 0.24, r * 0.72, 0, TAU); g.fill(); }
  g.restore();
  return c;
});

// ───────────────────────── Chart layout ─────────────────────────
const islands = [], lobes = [], marks = [], markOf = new Map(), trees = [], sparkles = [], puffs = [];
let worldBox = null, chartBox = null, portrait = null, layoutVersion = 0;
const home = { rx: 520, ry: 520 };
const ZIG = [1, -1, -1, 1, -1];
const N_POLY = 120;
function lobeR(l, th) {
  const k = l.k;
  return l.R * (1 + k[0] * Math.sin(2 * th + k[1]) + k[2] * Math.sin(3 * th + k[3]) + k[4] * Math.sin(5 * th + k[5]) + k[6] * Math.sin(7 * th + k[7]));
}
function lobeGap(l, x, y, off = 0) { const dx = x - l.cx, dy = y - l.cy; return Math.hypot(dx, dy) - lobeR(l, Math.atan2(dy, dx)) - off; }
function islandGap(isl, x, y) { let g = Infinity; for (const l of isl.lobes) { const v = lobeGap(l, x, y); if (v < g) g = v; } return g; }
function landGap(x, y) { let g = Infinity; for (const l of lobes) { const v = lobeGap(l, x, y); if (v < g) g = v; } return g; }
const inPlateau = (l, x, y) => { const dx = x - l.cx, dy = y - l.cy; return Math.hypot(dx, dy) < 0.5 * lobeR(l, Math.atan2(dy, dx)); };
function lobePts(l, off, scale = 1) {
  const pts = [];
  for (let k = 0; k < N_POLY; k++) { const th = (k / N_POLY) * TAU, r = lobeR(l, th) * scale + off; pts.push([l.cx + Math.cos(th) * r, l.cy + Math.sin(th) * r]); }
  return pts;
}
function polyP(p, pts, h, closed = true) {
  p.moveTo(pts[0][0], py(pts[0][1], h));
  for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], py(pts[i][1], h));
  if (closed) p.closePath();
}
function toRuns(pts, keep) {
  const N = pts.length, runs = [];
  if (keep.every(Boolean)) return [{ closed: true, pts }];
  for (let k = 0; k < N; k++) {
    if (keep[k] && !keep[(k - 1 + N) % N]) {
      const run = [pts[(k - 1 + N) % N]];
      let j = k;
      while (keep[j % N] && run.length <= N) { run.push(pts[j % N]); j++; }
      run.push(pts[j % N]);
      runs.push({ closed: false, pts: run });
    }
  }
  return runs;
}
/** Outline of an island's union of hills at `off` map units out, as runs belonging to each hill. */
function unionRuns(isl, off) {
  return isl.lobes.map((l) => {
    const pts = lobePts(l, off);
    const keep = pts.map(([x, y]) => !isl.lobes.some((o) => o !== l && lobeGap(o, x, y, off) < -0.5));
    return { lobe: l, runs: toRuns(pts, keep) };
  });
}
function runsPathP(list, h, filter = () => true) {
  const p = new Path2D();
  for (const { lobe, runs } of list) if (filter(lobe)) for (const r of runs) polyP(p, r.pts, h, r.closed);
  return p;
}
/** Vertical side faces (front-facing only), bucketed by how much light they catch. */
const LIGHT = (() => { const l = Math.hypot(-0.75, 0.66); return [-0.75 / l, 0.66 / l]; })();
function sideFaces(segs, h0, h1) {
  const b = [new Path2D(), new Path2D(), new Path2D(), new Path2D()];
  for (const { pts, cx, cy, closed } of segs) {
    const n = pts.length, last = closed ? n : n - 1;
    for (let i = 0; i < last; i++) {
      const a = pts[i], c = pts[(i + 1) % n];
      let nx = c[1] - a[1], ny = -(c[0] - a[0]);
      const len = Math.hypot(nx, ny) || 1; nx /= len; ny /= len;
      if (nx * ((a[0] + c[0]) / 2 - cx) + ny * ((a[1] + c[1]) / 2 - cy) < 0) { nx = -nx; ny = -ny; }
      if (ny < -0.05) continue; // faces away from the viewer: hidden behind the top
      const lit = clamp(0.5 + 0.5 * (nx * LIGHT[0] + ny * LIGHT[1]), 0, 0.999);
      const p = b[Math.floor(lit * 4)];
      p.moveTo(a[0], py(a[1], h0)); p.lineTo(c[0], py(c[1], h0)); p.lineTo(c[0], py(c[1], h1)); p.lineTo(a[0], py(a[1], h1)); p.closePath();
    }
  }
  return b;
}

function layout() {
  portrait = H > W * 1.05;
  islands.length = lobes.length = marks.length = trees.length = sparkles.length = puffs.length = 0; markOf.clear();
  const rnd = mulberry32(11);
  const ANG = [176, 238, 300, 6, 98].map((a) => (a * Math.PI) / 180);
  // Landscape: a ring of islands with arms reaching out. Portrait: the ring is tall and the arms lean up or down.
  const RX = portrait ? 330 : 540, RY = portrait ? 900 : 540;
  const ARM_P = [[-0.5, 1], [-0.45, -1], [0.45, -1], [0.5, 1], [0, 1]];
  home.rx = RX * 0.92; home.ry = RY * 0.92;
  domains.forEach((d, di) => {
    const a = ANG[di];
    let [ux, uy] = portrait ? ARM_P[di] : [Math.cos(a), Math.sin(a)];
    const ul = Math.hypot(ux, uy); ux /= ul; uy /= ul;
    const isl = { d, di, hue: DOMAIN_HUES[d.label], lobes: [], ux, uy };
    let prev = null;
    d.children.forEach((t, ti) => {
      const n = t.leafCount, R = 34 * Math.sqrt(n) + 54;
      let cx = Math.cos(a) * RX, cy = Math.sin(a) * RY;
      if (prev) {
        const rot = ZIG[di] * (ti % 2 ? 1 : -1) * 0.68;
        const dx = ux * Math.cos(rot) - uy * Math.sin(rot), dy = ux * Math.sin(rot) + uy * Math.cos(rot), dist = 0.78 * (prev.R + R);
        cx = prev.cx + dx * dist; cy = prev.cy + dy * dist;
      }
      const k = [0.07 + rnd() * 0.04, rnd() * TAU, 0.045 + rnd() * 0.03, rnd() * TAU, 0.025 + rnd() * 0.02, rnd() * TAU, 0.012 + rnd() * 0.01, rnd() * TAU];
      const l = { topic: t, isl, ti, cx, cy, R, k, prev, marks: [], solidT: t.unlocked ? 1 : 0, open: t.unlocked, pop: 0, fullRv: t.masteredCount === t.leafCount ? 1 : 0 };
      isl.lobes.push(l); lobes.push(l); prev = l;
    });
    islands.push(isl);
  });
  for (const l of lobes) placeLessons(l);
  for (const isl of islands) buildIsland(isl);
  for (const l of lobes) l.harbor = harborFor(l);
  islands.sort((a, b) => a.sortY - b.sortY);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const l of lobes) { x0 = Math.min(x0, l.cx - l.R * 1.1); y0 = Math.min(y0, l.cy - l.R * 1.1); x1 = Math.max(x1, l.cx + l.R * 1.1); y1 = Math.max(y1, l.cy + l.R * 1.1); }
  worldBox = projBox(x0 - 80, y0 - 80, x1 + 80, y1 + 80);
  // Trees on every hill, clear of lessons and their paths.
  const tr = mulberry32(9);
  for (const l of lobes) {
    const want = Math.round(2 + l.R / 45);
    for (let tries = 0, got = 0; tries < 60 && got < want; tries++) {
      const th = tr() * TAU, rr = (0.25 + tr() * 0.6) * l.R, x = l.cx + Math.cos(th) * rr, y = l.cy + Math.sin(th) * rr;
      if (lobeGap(l, x, y) > -16 || l.isl.lobes.some((o) => o.ti > l.ti && lobeGap(o, x, y) < 6)) continue;
      if (marks.some((m) => Math.hypot(m.x - x, m.y - y) < 30) || l.spiral.some((p) => Math.hypot(p[0] - x, p[1] - y) < 16)) continue;
      if (trees.some((t) => Math.hypot(t.x - x, t.y - y) < 26)) continue;
      trees.push({ x, y, h: inPlateau(l, x, y) ? H_PLAT : H_GRASS, s: 0.8 + tr() * 0.5, lobe: l, isl: l.isl }); got++;
    }
  }
  // Sparkles on the water and the cloud cover.
  const sr = mulberry32(5);
  for (let i = 0; i < 260; i++) {
    const x = (x0 - 400) + sr() * (x1 - x0 + 800), y = (y0 - 400) + sr() * (y1 - y0 + 800);
    if (landGap(x, y) < 40) continue;
    sparkles.push({ x, y, p: sr() * TAU, w: 0.8 + sr() * 1.4 });
  }
  const cr = mulberry32(3), SX = 150, SY = 118;
  for (let y = y0 - 1700, row = 0; y < y1 + 1700; y += SY, row++) {
    for (let x = x0 - 1100 + (row % 2) * SX * 0.5; x < x1 + 1100; x += SX) {
      puffs.push({ x: x + (cr() - 0.5) * 60, y: y + (cr() - 0.5) * 40, v: Math.floor(cr() * CLOUDS.length), s: 0.85 + cr() * 0.4, ph: cr() * TAU, cov: 1, target: 1, part: null });
