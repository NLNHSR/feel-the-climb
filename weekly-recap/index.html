<!doctype html>
<!--
  Sound design: Weekly Recap (an underwater trailer in miniature, ~37s, seven story cards)

  The week rises from the deep to the sunlit surface, and the score climbs with it.
  Music (procedural score, setIntensity): heartbeat + sub drone in the abyss (card 1, 0) → pulsing low strings
  as the week's lessons land (0.3 → 0.45) → taiko and toms when Algebra carries the week (0.62) → building
  under the riser (0.65 → 0.9) into a full hit on +90 (1.0) → riding high on the streak (0.85) → pulled back
  and reflective for what's left (0.5) → a warm, confident pulse under next week (0.42) → calm summary (0.3).
  Narration: four studio lines in the Origin Story voice; the music ducks under them. +90 has no voice.

  Events (score.sfx), each fired on its visual beat:
    whoosh   every card cut: a short upward water sweep (we're rising), ~0.4s.
    intro    title hits: "was your week." (card 1) and the "Done." stamp (card 2). Low boom + brass stab.
    sonar    each of the week's lessons landing (card 2), and the ready lessons pulsing on "we take it" (card 6).
             A soft sonar ping with a watery tail, ~0.6s.
    step     tight ticks: Algebra's bar segments slamming in, the streak dots, the next-week rows landing.
    riser    2.2s tension build that ends exactly on the +90 reveal.
    impact   the +90 reveal: sub drop + crash; the screen flashes and bubbles burst.
    unlock   the "Start" button arriving; a newly opened lesson after a completion.
    hover    pointer enters a lesson row (very soft, dry tick).
    select   a lesson row opens the lesson card (shared card plays it).
    back     the lesson card closes / leaving to the summary.
    start, complete   fired by the shared lesson card ("Start lesson" → mastered).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020A1C">
<title>Weekly Recap</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/dolphin.css">
<style>
  /* Reference frame is 390×844. Every size is written in reference px × --px, so the story scales as one piece. */
  :root {
    --px: 1px; --st: 0px; --sb: 0px;
    --top: calc(var(--st) + var(--px) * 76);
    --hx: calc(var(--px) * 12);
    --bot: calc(var(--px) * 36);
    --gut: calc(var(--px) * 28);
    --ink-deep: #01040B;
    --text-2: rgba(255, 255, 252, 0.78);
    --text-3: rgba(255, 255, 252, 0.6);
    --line: rgba(217, 228, 242, 0.16);
  }
  /* In the desktop frame, a status-bar inset keeps the header clear of the rounded corners. */
  .mode-frame { --st: calc(var(--px) * 16); --hx: calc(var(--px) * 18); }
  .mode-phone { --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --bot: calc(var(--sb) + 72px); }
  html, body { background: #030A18; color: var(--foam); overflow: hidden; }
  body { position: fixed; inset: 0; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }

  /* ── Desktop backdrop: a calm glow that takes the colour of the current water ── */
  #ambient { position: fixed; inset: 0; pointer-events: none; }
  .amb { position: absolute; inset: 0; opacity: 0; transition: opacity 1100ms ease; }
  .amb.on { opacity: 1; }
  .mode-phone #ambient { display: none; }

  /* ── The phone ── */
  #phone { position: fixed; overflow: hidden; background: var(--ink-deep); isolation: isolate; touch-action: none; cursor: pointer;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    border-radius: calc(var(--px) * 46); box-shadow: 0 0 0 1px rgba(217, 228, 242, 0.1), 0 40px 90px rgba(0, 0, 0, 0.5), 0 12px 30px rgba(0, 0, 0, 0.35); }
  .mode-phone #phone { inset: 0; border-radius: 0; box-shadow: none; }
  #phone.summary { cursor: default; touch-action: pan-y; }

  #water { position: absolute; inset: 0; z-index: 0; }
  .wl { position: absolute; inset: 0; opacity: 0; transition: opacity 900ms cubic-bezier(.4, 0, .2, 1); }
  .wl.on { opacity: 1; }

  /* God-rays: soft shafts from the surface, swaying on the compositor (no filters). */
  #rays { position: absolute; inset: 0; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity 1100ms ease; }
  .ray { position: absolute; top: -6%; height: 92%; transform-origin: 50% 0;
    background: linear-gradient(90deg, rgba(207, 239, 255, 0), rgba(207, 239, 255, 0.15) 50%, rgba(207, 239, 255, 0));
    clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%);
    -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.55) 40%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.55) 40%, transparent 100%);
    animation: sway var(--d) ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(calc(var(--r) - 3.5deg)); } to { transform: rotate(calc(var(--r) + 3.5deg)); } }

  #fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #cards { position: absolute; inset: 0; z-index: 2; }
  #flash { position: absolute; inset: 0; z-index: 3; background: #FFFFFC; opacity: 0; pointer-events: none; }
  #scrim { position: absolute; inset: 0; z-index: 5; background: rgba(1, 6, 18, 0.5); opacity: 0; pointer-events: none; transition: opacity 200ms ease; }
  .mode-phone body.card-open #scrim { opacity: 1; pointer-events: auto; }

  /* ── Story header: progress segments, who/when, pause + close ── */
  #hdr { position: absolute; left: 0; right: 0; top: 0; z-index: 4; padding: calc(var(--st) + var(--px) * 10) var(--hx, calc(var(--px) * 12)) 0; transition: opacity 180ms ease; pointer-events: none; }
  #phone.held #hdr { opacity: 0; }
  .kg-sound { transition: opacity 180ms ease; }
  .mode-phone body.story-held .kg-sound { opacity: 0; pointer-events: none; }
  .bars { display: flex; gap: calc(var(--px) * 4); transition: opacity 200ms ease; }
  .seg { flex: 1; height: max(2px, calc(var(--px) * 3)); border-radius: 3px; background: rgba(255, 255, 252, 0.26); overflow: hidden; }
  .seg i { display: block; height: 100%; background: var(--foam); border-radius: inherit; transform-origin: 0 50%; transform: scaleX(0); }
  .hrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: max(36px, calc(var(--px) * 36)); margin-top: calc(var(--px) * 8); }
  .who { display: flex; align-items: center; gap: calc(var(--px) * 8); min-width: 0; font: 700 calc(var(--px) * 13.5)/1 var(--font-body); color: var(--text-2); white-space: nowrap; }
  .who b { color: var(--foam); font-weight: 800; }
  .who .ws { width: calc(var(--px) * 30); flex: none; display: block; }
  .hb { display: flex; gap: 4px; pointer-events: auto; }
  .hbtn { width: max(36px, calc(var(--px) * 36)); height: max(36px, calc(var(--px) * 36)); border: 0; padding: 0; border-radius: 50%; background: transparent; color: var(--foam);
    display: grid; place-items: center; cursor: pointer; transition: background-color 120ms ease; }
  .hbtn:hover { background: rgba(255, 255, 252, 0.12); }
  .hbtn:focus-visible { outline: 2px solid rgba(255, 244, 78, 0.7); outline-offset: 1px; }
  .hbtn svg { width: 18px; height: 18px; }
  #phone.summary .bars, #phone.summary .who, #phone.summary .hb { opacity: 0; visibility: hidden; }

  /* On a real phone the sound buttons join the story header (top right), like a story viewer, and the dock spans the bottom. */
  .mode-phone .kg-sound { top: calc(var(--st) + var(--px) * 21 + 1px); right: calc(var(--px) * 12 + max(36px, calc(var(--px) * 36)) * 2 + 8px); bottom: auto; flex-direction: row; gap: 4px; }
  .mode-phone .kg-sound .kg-icon-btn { width: max(36px, calc(var(--px) * 36)); height: max(36px, calc(var(--px) * 36)); background: transparent; border: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; color: var(--foam); }
  .mode-phone .kg-dock { right: 12px; bottom: calc(var(--sb) + 12px); }
  .mode-phone .kg-card { left: 12px; right: 12px; width: auto; bottom: calc(var(--sb) + 64px); }
  /* Long "Next: …" labels in the shared card wrap inside the button instead of overflowing it. */
  .kg-card .actions .kg-btn { height: auto; min-height: 48px; padding: 8px 12px; line-height: 1.2; }

  /* Desktop: quiet previous / next buttons beside the frame. */
  .nav { position: fixed; z-index: 6; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(217, 228, 242, 0.16); background: rgba(10, 35, 79, 0.5);
    color: var(--foam); display: grid; place-items: center; cursor: pointer; transition: background-color 120ms ease, opacity 200ms ease, transform 120ms ease; }
  .nav:hover { background: rgba(30, 111, 190, 0.55); }
  .nav:active { transform: scale(0.94); }
  .nav:focus-visible { outline: 3px solid rgba(47, 154, 230, 0.5); outline-offset: 2px; }
  .nav svg { width: 18px; height: 18px; }
  .nav.off { opacity: 0; pointer-events: none; }
  .mode-phone .nav { display: none; }

  /* ── Cards ── */
  .card { position: absolute; left: 0; right: 0; top: var(--top); bottom: var(--bot); padding: 0 var(--gut);
    display: flex; flex-direction: column; justify-content: center; }
  .card.leaving { transition: opacity 200ms ease, transform 260ms cubic-bezier(.4, 0, .2, 1); opacity: 0; transform: translateY(calc(var(--px) * -28)); pointer-events: none; }
  .card > *, .stack > * { flex: none; }
  .stack { display: flex; flex-direction: column; align-items: flex-start; }

  .t-hero { font-family: var(--font-head); font-size: calc(var(--px) * 150); line-height: 0.92; letter-spacing: -0.02em; }
  .t-title { font-family: var(--font-head); font-size: calc(var(--px) * 46); line-height: 1.04; text-wrap: balance; }
  .t-mid { font-family: var(--font-head); font-size: calc(var(--px) * 28); line-height: 1.12; }
  .t-body { font: 700 calc(var(--px) * 17)/1.4 var(--font-body); color: var(--text-2); }
  .t-small { font: 700 calc(var(--px) * 14)/1.35 var(--font-body); color: var(--text-3); }
  .w { display: inline-block; white-space: nowrap; }
  .dg { display: inline-block; width: 0.6em; text-align: center; }
  .sun { color: var(--sun); }

  .sub { display: block; overflow: visible; }
  .sub .hull, .sub .sail, .sub .fin { fill: #0A234F; }
  .sub .rim { stroke: rgba(158, 223, 255, 0.7); stroke-width: 1.1; stroke-linecap: round; fill: none; }
  .sub .port { fill: var(--sun); }
  .sub .port2 { fill: rgba(255, 244, 78, 0.55); }

  /* 1 · Cold open */
  .c1 .c1-a { font-size: calc(var(--px) * 64); }
  .c1 .c1-b { margin-top: calc(var(--px) * 2); }
  .c1 .c1-d { margin-top: calc(var(--px) * 18); }
  .c1-sub { align-self: center; width: calc(var(--px) * 84); margin-top: calc(var(--px) * 96); }

  /* 2 · Seven lessons */
  .c2-head { display: flex; align-items: baseline; gap: calc(var(--px) * 12); }
  .c2-head .t-hero { font-size: calc(var(--px) * 124); color: var(--foam); }
  .c2-list { display: flex; flex-direction: column; margin-top: calc(var(--px) * 14); }
  .c2-row { display: flex; align-items: center; gap: calc(var(--px) * 12); height: calc(var(--px) * 40); opacity: 0; }
  .c2-day { width: calc(var(--px) * 34); font: 700 calc(var(--px) * 13.5)/1 var(--font-body); color: var(--text-3); }
  .c2-dot { width: calc(var(--px) * 9); height: calc(var(--px) * 9); border-radius: 50%; background: var(--hue); flex: none; box-shadow: 0 0 0 calc(var(--px) * 3) color-mix(in srgb, var(--hue) 22%, transparent); }
  .c2-name { font: 700 calc(var(--px) * 17)/1.2 var(--font-body); color: var(--foam); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .c2-done { color: var(--sun); margin-top: calc(var(--px) * 18); transform-origin: 0 60%; }

  /* 3 · The domain that carried the week */
  .c3 .c3-dom { font-size: calc(var(--px) * 68); line-height: 1; }
  .c3 .c3-sub { font-size: calc(var(--px) * 38); margin-top: calc(var(--px) * 4); }
  .c3-bar { display: flex; gap: calc(var(--px) * 4); width: 100%; height: calc(var(--px) * 18); margin-top: calc(var(--px) * 30); }
  .c3-seg { flex: 1; border-radius: calc(var(--px) * 5); background: rgba(255, 255, 252, 0.1); overflow: hidden; position: relative; }
  .c3-seg:first-child { border-radius: calc(var(--px) * 9) calc(var(--px) * 5) calc(var(--px) * 5) calc(var(--px) * 9); }
  .c3-seg:last-child { border-radius: calc(var(--px) * 5) calc(var(--px) * 9) calc(var(--px) * 9) calc(var(--px) * 5); }
  .c3-seg i { position: absolute; inset: 0; background: var(--hue); transform-origin: 0 50%; transform: scaleX(0); }
  .c3-seg.other i { opacity: 0.5; }
  .c3-glint { position: absolute; inset: 0; background: rgba(255, 255, 252, 0.9); opacity: 0; }
  .c3 .t-body { margin-top: calc(var(--px) * 14); }

  /* 4 · +90 */
  .c4-line { display: flex; align-items: baseline; gap: calc(var(--px) * 10); margin-top: calc(var(--px) * 6); color: var(--text-2); }
  .c4-arr { font: 700 0.7em/1 var(--font-body); opacity: 0.55; }
  .c4-to { color: var(--foam); transition: color 200ms ease; }
  .c4-to.lit { color: var(--sun); }
  .c4-hero { margin-top: calc(var(--px) * 10); transform-origin: 0 70%; }
  .c4-hero .pl { display: inline-block; width: 0.52em; }
  .c4-sub { width: calc(var(--px) * 76); margin-top: calc(var(--px) * 64); align-self: flex-end; margin-right: calc(var(--px) * 30); }

  /* 5 · Streak */
  .c5 .t-hero { color: var(--sun); transform-origin: 0 70%; }
  .c5-dots { display: flex; gap: calc(var(--px) * 7); margin-top: calc(var(--px) * 26); }
  .c5-dot { width: calc(var(--px) * 18); height: calc(var(--px) * 18); border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 252, 0.3); position: relative; }
  .c5-dot i { position: absolute; inset: 0; border-radius: 50%; background: var(--foam); transform: scale(0); }
  .c5-dot.today i { background: var(--sun); }
  .c5-dot.today::after { content: ''; position: absolute; inset: calc(var(--px) * -5); border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(255, 244, 78, 0.6); opacity: 0; }
  .c5-dot.today.live::after { animation: halo 1600ms ease-out infinite; }
  @keyframes halo { 0% { opacity: 0.9; transform: scale(0.8); } 100% { opacity: 0; transform: scale(1.5); } }
  .c5-dont { margin-top: calc(var(--px) * 22); }

  /* 6 · What's left (shared with the summary) */
  .c6-hero { margin-top: calc(var(--px) * 4); }
  .track { width: 100%; margin-top: calc(var(--px) * 34); }
  .tk-top { position: relative; height: calc(var(--px) * 22); }
  .tk-cur { position: absolute; bottom: 0; transform: translateX(-50%); font-family: var(--font-head); font-size: calc(var(--px) * 18); line-height: 1; color: var(--sun); white-space: nowrap; }
  .tk-bar { position: relative; height: calc(var(--px) * 6); margin-top: calc(var(--px) * 18); border-radius: 6px;
    background: repeating-linear-gradient(90deg, rgba(255, 255, 252, 0.3) 0 calc(var(--px) * 6), transparent calc(var(--px) * 6) calc(var(--px) * 11)); }
  .tk-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; background: var(--foam); }
  .tk-week { position: absolute; top: 0; bottom: 0; border-radius: 0 6px 6px 0; background: var(--sun); }
  .tk-mk { position: absolute; top: 50%; width: calc(var(--px) * 46); transform: translate(-50%, -62%); }
  .tk-end { position: absolute; right: 0; top: 50%; width: calc(var(--px) * 12); height: calc(var(--px) * 12); margin-top: calc(var(--px) * -6); border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255, 255, 252, 0.7); background: rgba(2, 10, 28, 0.6); }
  .tk-bot { display: flex; justify-content: space-between; margin-top: calc(var(--px) * 12); }
  .tk-bot .t-small b { color: var(--foam); font-weight: 800; }
  .grid { display: grid; grid-template-columns: repeat(15, calc(var(--px) * 10)); gap: calc(var(--px) * 7); margin-top: calc(var(--px) * 34); align-self: flex-start; }
  .grid i { width: calc(var(--px) * 10); height: calc(var(--px) * 10); border-radius: 50%; box-shadow: inset 0 0 0 1.25px rgba(255, 255, 252, 0.28); }
  .grid i.m { background: rgba(255, 255, 252, 0.88); box-shadow: none; }
  .grid i.r { background: var(--sun); box-shadow: none; }
  .grid.pulse i.r { animation: rp 900ms ease-out; }
  @keyframes rp { 30% { transform: scale(1.45); box-shadow: 0 0 0 calc(var(--px) * 4) rgba(255, 244, 78, 0.25); } 100% { transform: none; } }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--px) * 6) calc(var(--px) * 10); margin-top: calc(var(--px) * 16); font: 700 calc(var(--px) * 15)/1.3 var(--font-body); color: var(--foam); }
  .legend .sep { color: var(--text-3); }
  .legend .rd { color: var(--sun); display: inline-flex; align-items: center; gap: calc(var(--px) * 6); }
  .legend .rd::before { content: ''; width: calc(var(--px) * 8); height: calc(var(--px) * 8); border-radius: 50%; background: var(--sun); }

  /* 7 · Next week + summary rows */
  .c7 .t-body { margin-top: calc(var(--px) * 8); }
  .rows { display: flex; flex-direction: column; gap: calc(var(--px) * 10); width: 100%; margin-top: calc(var(--px) * 26); }
  .lrow { position: relative; display: flex; align-items: center; gap: calc(var(--px) * 12); width: 100%; min-height: calc(var(--px) * 64); padding: calc(var(--px) * 10) calc(var(--px) * 14) calc(var(--px) * 10) calc(var(--px) * 16);
    border-radius: calc(var(--px) * 18); border: 1px solid rgba(217, 228, 242, 0.14); background: rgba(2, 12, 32, 0.42); text-align: left; cursor: pointer;
    transition: border-color 120ms ease, background-color 120ms ease, transform 120ms ease; }
  .lrow:hover, .lrow:focus-visible, .lrow.sel { border-color: var(--hl); background: rgba(2, 12, 32, 0.58); outline: none; }
  .lrow:active { transform: scale(0.985); }
  .lrow .ld { width: calc(var(--px) * 10); height: calc(var(--px) * 10); border-radius: 50%; background: var(--hue); flex: none; }
  .lrow .lt { display: flex; flex-direction: column; gap: calc(var(--px) * 3); flex: 1; min-width: 0; }
  .lrow .ln { font: 800 calc(var(--px) * 16)/1.2 var(--font-body); color: var(--foam); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .lm { font: 700 calc(var(--px) * 12.5)/1.2 var(--font-body); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .lp { font-family: var(--font-head); font-size: calc(var(--px) * 19); line-height: 1; color: var(--hl); flex: none; }
  .lrow .lp.new { font: 800 calc(var(--px) * 12)/1 var(--font-body); color: var(--ink); background: var(--sun); padding: calc(var(--px) * 5) calc(var(--px) * 8); border-radius: 999px; }
  .lrow svg { width: calc(var(--px) * 16); height: calc(var(--px) * 16); flex: none; color: var(--text-3); }
  .lrow.done { border-color: rgba(255, 244, 78, 0.6); }
  .lrow.done .lp { color: var(--sun); display: inline-flex; align-items: center; gap: 4px; font: 800 calc(var(--px) * 14)/1 var(--font-body); }
  .lrow.done .lp svg { color: var(--sun); }
  .plus { position: absolute; right: calc(var(--px) * 14); top: calc(var(--px) * -10); font-family: var(--font-head); font-size: calc(var(--px) * 20); color: var(--sun); pointer-events: none; animation: plus 1500ms cubic-bezier(.2, .8, .2, 1) forwards; }
  @keyframes plus { 0% { opacity: 0; transform: translateY(8px); } 15% { opacity: 1; transform: none; } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
  .cta { width: 100%; margin-top: calc(var(--px) * 22); }
  .cta .kg-btn { width: 100%; height: max(48px, calc(var(--px) * 58)); border-radius: calc(var(--px) * 20); font: 800 calc(var(--px) * 17)/1 var(--font-body);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 calc(var(--px) * 18); }
  .replay { align-self: center; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; margin-top: calc(var(--px) * 8); padding: 0 16px; border: 0; border-radius: 999px;
    background: transparent; color: var(--text-2); font: 700 calc(var(--px) * 15)/1 var(--font-body); cursor: pointer; transition: color 120ms ease, background-color 120ms ease; }
  .replay:hover { color: var(--foam); background: rgba(255, 255, 252, 0.1); }
  .replay:focus-visible, .lrow:focus-visible, .cta .kg-btn:focus-visible { outline: 2px solid rgba(255, 244, 78, 0.75); outline-offset: 2px; }
  .replay svg { width: 16px; height: 16px; }

  /* Summary */
  .sm { justify-content: flex-start; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding-top: calc(var(--px) * 2); padding-bottom: calc(var(--px) * 4); }
  .sm::-webkit-scrollbar { display: none; }
  .sm .t-title { font-size: calc(var(--px) * 40); }
  .sm-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--px) * 8); width: 100%; margin-top: calc(var(--px) * 14); }
  .tile { border-radius: calc(var(--px) * 18); background: rgba(2, 12, 32, 0.36); border: 1px solid rgba(217, 228, 242, 0.12); padding: calc(var(--px) * 12) calc(var(--px) * 12) calc(var(--px) * 11); min-width: 0; }
  .tile b { display: block; font-family: var(--font-head); font-weight: normal; font-size: calc(var(--px) * 32); line-height: 1; }
  .tile span { display: block; margin-top: calc(var(--px) * 6); font: 700 calc(var(--px) * 12.5)/1.2 var(--font-body); color: var(--text-3); white-space: nowrap; }
  .tile.bump b { animation: bump 700ms cubic-bezier(.2, .8, .2, 1.3); }
  @keyframes bump { 35% { transform: scale(1.18); color: var(--sun); } }
  .sm-h { margin-top: calc(var(--px) * 20); }

  if (P.snow > 0.01) {
    g.fillStyle = '#CFEFFF';
    const rise = FX.rise * PX;
    for (const p of snow) {
      p.y += (p.vy * PX + rise) * dt;
      if (p.y > FH + 4) { p.y = -4; p.x = Math.random() * FW; }
      const x = p.x + Math.sin(t * 0.4 + p.ph) * 6 * PX;
      g.globalAlpha = p.a * P.snow;
      const r = p.r * PX;
      g.fillRect(x - r / 2, p.y - r / 2, r, r);
    }
    g.globalAlpha = 1;
  }
  // Dolphins (behind everything else on the canvas).
  for (let i = dolphins.length - 1; i >= 0; i--) {
    const d = dolphins[i];
    d.life += dt;
    if (d.out) d.fade -= dt * 3;
    if (d.life < 0) continue;
    const k = d.life / d.dur;
    if (k >= 1 || d.fade <= 0) { dolphins.splice(i, 1); continue; }
    const len = 168 * PX * d.s, sc = len / 206;
    const x = d.dir > 0 ? lerp(-len * 0.6, FW + len * 0.6, k) : lerp(FW + len * 0.6, -len * 0.6, k);
    const y = (d.y - Math.sin(k * Math.PI) * d.arc) * FH;
    const ang = -Math.cos(k * Math.PI) * d.arc * 2.2 * d.dir * -1 + (RM ? 0 : Math.sin(t * 5.5 + i) * 0.025);
    const edge = Math.min(1, k * 6, (1 - k) * 6);
    g.save();
    g.globalAlpha = d.a * edge * clamp(d.fade, 0, 1);
    g.translate(x, y); g.rotate(ang * d.dir); g.scale(d.dir * sc, sc); g.translate(-104, -37);
    g.fillStyle = '#020B1E';
    g.fill(DOLPHIN);
    g.restore();
  }
  g.globalCompositeOperation = 'lighter';
  if (P.glow && P.glow.a > 0.004) {
    const r = P.glow.r * PX;
    g.globalAlpha = clamp(P.glow.a, 0, 1);
    g.drawImage(GLOW, P.glow.x - r, P.glow.y - r, r * 2, r * 2);
    g.globalAlpha = 1;
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const q = rings[i];
    q.life += dt;
    const k = q.life / q.dur;
    if (k >= 1) { rings.splice(i, 1); continue; }
    g.strokeStyle = rgba(q.c, q.a * (1 - k) * (1 - k));
    g.lineWidth = q.w * PX;
    g.beginPath(); g.arc(q.x, q.y, lerp(q.r0, q.r1, E.outCubic(k)), 0, Math.PI * 2); g.stroke();
  }
  g.globalCompositeOperation = 'source-over';
  // Bubbles: an ambient trickle plus bursts and trails.
  FX.emitAcc += dt * P.bubbles * (RM ? 0.5 : 1);
  while (FX.emitAcc > 1) { FX.emitAcc -= 1; bubble(Math.random() * FW, FH + 8, (1.4 + Math.random() * 3) * PX, -(28 + Math.random() * 50) * PX); }
  if (P.emit && !RM) for (let n = 0; n < P.emit.n; n++) bubble(P.emit.x + (Math.random() - 0.5) * 6 * PX, P.emit.y + (Math.random() - 0.5) * 6 * PX, (1 + Math.random() * 2.2) * PX, -(30 + Math.random() * 40) * PX, -(20 + Math.random() * 30) * PX);
  for (const b of bubbles) {
    if (!b.on) continue;
    b.life += dt;
    b.vx *= Math.pow(0.2, dt);
    b.x0 += b.vx * dt; b.y += (b.vy + FX.rise * PX * 0.6) * dt;
    if (b.y < -12 || b.life > b.max) { b.on = false; continue; }
    const x = b.x0 + Math.sin(b.life * b.f + b.ph) * b.amp * PX;
    g.globalAlpha = Math.min(1, b.life * 4, (b.max - b.life) * 1.5, b.y / (FH * 0.12)) * 0.85;
    g.drawImage(BUBBLE, x - b.r, b.y - b.r, b.r * 2, b.r * 2);
  }
  g.globalAlpha = 1;
}

/** Centre of an element in frame coordinates, ignoring transforms (layout position). */
function centerOf(el) {
  let x = el.offsetWidth / 2, y = el.offsetHeight / 2;
  for (let n = el; n && n !== phone; n = n.offsetParent) { x += n.offsetLeft; y += n.offsetTop; }
  return { x, y };
}
const heartbeat = (t) => {
  const P = 1.76, u = ((t % P) + P) % P, p = (x) => (x < 0 ? 0 : Math.exp(-x * 9));
  return Math.min(1, p(u) + 0.6 * p(u - 0.44));
};

// ── lesson card ──────────────────────────────────────────
let silentClose = false;
const lessonCard = createLessonCard(graph, {
  score, caption: () => {},
  onComplete: (evt) => onLessonComplete(evt),
  onOpen: (n) => { if (n.state !== 'mastered' && !prior.has(n)) prior.set(n, n.progress); document.body.classList.add('card-open'); placeLessonCard(); markSel(n); },
  onClose: () => { document.body.classList.remove('card-open'); markSel(null); if (!silentClose) sfx('back'); },
});
/** Desktop: beside the phone so the story stays visible. Phone: the shared bottom sheet. */
function placeLessonCard() {
  const c = lessonCard.el, s = c.style;
  s.left = s.right = s.top = s.bottom = s.width = '';
  if (phoneMode) return;
  const fr = frameRect, room = innerWidth - (fr.left + fr.width);
  const w = c.offsetWidth || 400;
  if (room >= w + 104) {
    Object.assign(s, { left: (fr.left + fr.width + 84) + 'px', right: 'auto', bottom: (innerHeight - fr.top - fr.height) + 'px', top: 'auto' });
  } else {
    Object.assign(s, { left: (fr.left + 12) + 'px', right: 'auto', width: (fr.width - 24) + 'px', bottom: (innerHeight - fr.top - fr.height + 12) + 'px', top: 'auto' });
  }
}
function markSel(n) { for (const b of cardsEl.querySelectorAll('.lrow')) b.classList.toggle('sel', !!n && b._l === n); }

function lessonRow(l, fresh) {
  const b = h('button', 'lrow');
  b.type = 'button'; b._l = l;
  b.style.setProperty('--hue', hueOf(l)); b.style.setProperty('--hl', light(hueOf(l)));
  const right = fresh.has(l) ? '<span class="lp new">New</span>' : `<span class="lp">${l.progress > 0 ? pct(l.progress) : 'Ready'}</span>`;
  b.innerHTML = `<i class="ld"></i><span class="lt"><span class="ln">${esc(l.label)}</span><span class="lm">${esc(l.domain.label)}</span></span>${right}${ICON.chev}`;
  b.setAttribute('aria-label', `${l.label}, ${l.domain.label}. ${l.progress > 0 ? pct(l.progress) + ' done' : 'Ready to start'}.`);
  b.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse' && performance.now() - lastMove < 120) sfx('hover'); });
  b.addEventListener('click', () => lessonCard.open(l));
  return b;
}
/** Rows + Start + Replay, shared by card 7 and the summary. Re-renders after a completion. */
const fresh = new Set();
function nextBlock(parent) {
  const rowsEl = add(parent, 'rows');
  const cta = add(parent, 'cta');
  const btn = add(cta, 'kg-btn sun', '', 'button');
  btn.type = 'button';
  const rp = add(parent, 'replay', `${ICON.replay}<span>Replay my week</span>`, 'button');
  rp.type = 'button';
  rp.addEventListener('click', () => replay());
  btn.addEventListener('click', () => { const l = btn._l; if (l) lessonCard.open(l); });
  function fill() {
    const list = recommend(3);
    rowsEl.replaceChildren(...list.map((l) => lessonRow(l, fresh)));
    btn._l = list[0] || null;
    btn.textContent = list[0] ? `Start: ${list[0].label}` : 'All caught up';
    btn.disabled = !list[0];
    if (lessonCard.lesson) markSel(lessonCard.lesson);
  }
  fill();
  return { rowsEl, cta, btn, rp, fill };
}
let block = null;
function onLessonComplete(evt) {
  evt.unlocked.forEach((l) => fresh.add(l));
  const el = block && [...block.rowsEl.children].find((b) => b._l === evt.lesson);
  if (el) {
    el.classList.add('done');
    el.querySelector('.lp').outerHTML = `<span class="lp">${ICON.check}Done</span>`;
    const c = centerOf(el);
    burst(c.x, c.y, 26, 80);
    const gain = evt.stats.score - (el._score ?? D.after);
    if (evt.stats.score > curScore) { add(el, 'plus', `+${evt.stats.score - curScore}`, 'span'); }
    void gain;
  }
  curScore = evt.stats.score;
  if (mode === 'summary') refreshSummaryStats();
  setTimeout(() => {
    if (!block || !block.rowsEl.isConnected) return;
    block.fill();
    if (evt.unlocked.length) sfx('unlock');
  }, 1300);
}
let curScore = D.after;

// ═════════════════════ CARDS ═════════════════════
// Each card: one idea, big type, one supporting line. render(lt) is a pure function of card time;
// cues fire once when playback crosses them. Voice starts are timed to the pauses inside each clip.

/* 1 · Cold open. Voice (1.6s): "This..." 0.05–0.4 · "was your week." 0.8–1.5. Deep water, a heartbeat sonar from the sub. */
function cOpen(root, d) {
  const V = 0.6;
  root.classList.add('c1');
  const st = add(root, 'stack');
  const a = add(st, 't-title c1-a', 'This');
  const b = add(st, 't-title c1-b');
  const bw = words(b, 'was your week.');
  const date = add(st, 't-body c1-d', esc(d.range));
  const subw = add(st, 'c1-sub', SUB_SVG);
  let beat = -1, sp = null;
  return {
    dur: 4.6,
    measure() { sp = centerOf(subw); sp.x += subw.offsetWidth * 0.3; },
    music: () => [0, 1],
    fx: (lt) => ({ snow: 0.7, bubbles: 0.5, glow: sp ? { x: sp.x + Math.sin(lt * 0.6) * 6 * PX * M, y: sp.y, r: 90, a: 0.06 + 0.22 * heartbeat(lt) * seg(lt, 0, 1) } : null }),
    render(lt) {
      const ka = E.outCubic(seg(lt, V, V + 0.5));
      T(a, seg(lt, V, V + 0.22), 0, (1 - ka) * 16 * PX * M);
      bw.forEach((w, j) => { const t0 = V + 0.8 + j * 0.15, k = E.outCubic(seg(lt, t0, t0 + 0.45)); T(w, seg(lt, t0, t0 + 0.2), 0, (1 - k) * 16 * PX * M); });
      const kd = E.outCubic(seg(lt, V + 2.0, V + 2.5));
      T(date, seg(lt, V + 2.0, V + 2.4), 0, (1 - kd) * 8 * PX * M);
      T(subw, 0.3 + 0.7 * seg(lt, 0, 1.4), Math.sin(lt * 0.6) * 6 * PX * M, Math.sin(lt * 0.9) * 3 * PX * M);
      const bi = Math.floor(lt / 1.76);
      if (bi !== beat) { beat = bi; if (sp && lt > 0.05) ring(sp.x + Math.sin(lt * 0.6) * 6 * PX * M, sp.y, { r1: 120, dur: 1.6, a: 0.35, color: '#5FC6F7' }); }
    },
    cues: [[V, () => say(lines(d).open)], [V + 0.8, () => sfx('intro')]],
  };
}

/* 2 · The week's lessons land one by one (sonar), then the count. Voice (1.6s): "Seven lessons." 0–0.9 · "Done." 1.2–1.5. */
function cLessons(root, d) {
  const L = d.lessons, n = L.length, R0 = 0.45, RS = n > 1 ? Math.min(0.42, 2.6 / (n - 1)) : 0, V = R0 + (n - 1) * RS + 0.5, DONE = V + 1.2;
  root.classList.add('c2');
  const head = add(root, 'c2-head');
  const num = add(head, 't-hero');
  const lab = add(head, 't-mid', 'lessons.');
  const list = add(root, 'c2-list');
  const rows = L.map((l) => {
    const r = add(list, 'c2-row');
    r.style.setProperty('--hue', hueOf(l));
    r.innerHTML = `<span class="c2-day">${fmt(l.masteredAt, { weekday: 'short' })}</span><i class="c2-dot"></i><span class="c2-name">${esc(l.label)}</span>`;
    return r;
  });
  const done = add(root, 't-title c2-done', 'Done.');
  let dots = [];
  return {
    dur: DONE + 1.4,
    measure() { dots = rows.map((r) => centerOf(r.querySelector('.c2-dot'))); },
    music: (lt) => [0.3 + 0.15 * seg(lt, R0, V), 0.6],
    fx: () => ({ snow: 0.6, bubbles: 0.5 }),
    render(lt) {
      let c = 0, lastT = -9;
      rows.forEach((r, i) => {
        const t0 = R0 + i * RS, k = E.outCubic(seg(lt, t0, t0 + 0.4));
        T(r, seg(lt, t0, t0 + 0.16), (1 - k) * 32 * PX * M, 0);
        if (lt >= t0) { c = i + 1; lastT = t0; }
      });
      setText(num, String(c));
      setText(lab, c === 1 ? 'lesson.' : 'lessons.');
      const pk = 1 - seg(lt, lastT, lastT + 0.22), vk = 1 - seg(lt, V, V + 0.3);
      T(head, seg(lt, R0, R0 + 0.16), 0, 0, 1 + (0.06 * pk + (lt >= V ? 0.06 * vk : 0)) * M);
      head.style.transformOrigin = '0 80%';
      const kd = E.outBack(seg(lt, DONE, DONE + 0.4));
      T(done, seg(lt, DONE, DONE + 0.1), 0, 0, M ? lerp(1.5, 1, clamp(kd, 0, 1.2)) : 1);
    },
    cues: [
      ...rows.map((r, i) => [R0 + i * RS, () => { sfx('sonar'); const p = dots[i]; if (p) ring(p.x, p.y, { r1: 34, dur: 0.9, a: 0.6, color: light(hueOf(L[i])) }); }]),
      [V, () => say(lines(d).done)],
      [DONE, () => { sfx('intro'); shake(4); }],
    ],
  };
}

/* 3 · The domain with the most gains. No voice. The bar slams full, one segment per lesson; a dolphin passes overhead. */
function cTop(root, d) {
  const dom = d.top.d, nTop = d.top.n, n = d.lessons.length, hue = DOMAIN_HUES[dom.label];
  root.classList.add('c3');
  const st = add(root, 'stack');
  const t1 = add(st, 't-title c3-dom', esc(dom.label));
  t1.style.color = light(hue);
  const t2 = add(st, 't-title c3-sub');
  const w2 = words(t2, 'carried the week.');
  const bar = add(st, 'c3-bar');
  const order = [...d.lessons].sort((a, b) => (b.domain === dom) - (a.domain === dom));
  const segs = order.map((l) => { const s = add(bar, 'c3-seg' + (l.domain === dom ? '' : ' other')); s.style.setProperty('--hue', hueOf(l)); return { fill: add(s, '', '', 'i'), glint: add(s, 'c3-glint', '', 'span') }; });
  const line = add(st, 't-body', `${nTop} of your ${n} lessons.`);
  const S0 = 1.0, SS = 0.12, SLAM = S0 + (nTop - 1) * SS + 0.14;
  const tOf = (i) => (i < nTop ? S0 + i * SS : SLAM + 0.3 + (i - nTop) * 0.1);
  return {
    dur: 4.8,
    music: () => [0.62, 0.5],
    fx: () => ({ snow: 0.5, bubbles: 0.45 }),
    render(lt) {
      const k1 = E.outExpo(seg(lt, 0.12, 0.55));
      T(t1, seg(lt, 0.12, 0.3), 0, 0, M ? lerp(1.12, 1, k1) : 1);
      t1.style.transformOrigin = '0 70%';
      w2.forEach((w, j) => { const t0 = 0.42 + j * 0.1, k = E.outCubic(seg(lt, t0, t0 + 0.4)); T(w, seg(lt, t0, t0 + 0.2), 0, (1 - k) * 14 * PX * M); });
      T(bar, seg(lt, 0.75, 0.95));
      segs.forEach((s, i) => {
        const t0 = tOf(i), k = E.outCubic(seg(lt, t0, t0 + 0.14));
        s.fill.style.transform = `scaleX(${k.toFixed(3)})`;
        s.glint.style.opacity = i < nTop ? (0.55 * (1 - seg(lt, SLAM, SLAM + 0.45)) * (lt >= SLAM ? 1 : 0)).toFixed(3) : '0';
      });
      bar.style.transform = M && lt >= SLAM ? `scaleY(${(1 + 0.25 * (1 - E.outCubic(seg(lt, SLAM, SLAM + 0.3)))).toFixed(3)})` : '';
      const kl = E.outCubic(seg(lt, SLAM + 0.5, SLAM + 0.9));
      T(line, seg(lt, SLAM + 0.5, SLAM + 0.8), 0, (1 - kl) * 10 * PX * M);
    },
    cues: [
      ...segs.map((s, i) => [tOf(i), () => sfx('step')]),
      [SLAM, () => shake(3)],
      [0.35, () => dolphin({ y: 0.2, dir: -1, dur: 4.2, s: 1, a: 0.5, arc: 0.035 })],
    ],
  };
}

/* 4 · The reveal: projected score races 1090 → 1180, riser into the hit; +90 slams. No voice.
   The sub rises with the number; bubbles burst on the hit. */
function cScore(root, d) {
  const REV = 2.7, b = d.before, a = d.after, gain = a - b;
  root.classList.add('c4');
  const st = add(root, 'stack');
  const lab = add(st, 't-body', 'Your projected score');
  const line = add(st, 't-mid c4-line', `<span class="c4-from">${b}</span><span class="c4-arr">→</span><span class="c4-to"></span>`);
  const to = $('.c4-to', line);
  const hero = add(st, 't-hero c4-hero', '<span class="pl">+</span><span class="hn"></span>');
  const hn = $('.hn', hero);
  const pts = add(st, 't-mid', 'points this week.');
  const subw = add(st, 'c4-sub', SUB_SVG);
  let sp = null, hp = null;
  const subY = (lt) => lerp(90, 0, E.outCubic(seg(lt, 0, REV + 0.3))) * PX * M;
  return {
    dur: 6.0,
    measure() { sp = centerOf(subw); hp = centerOf(hero); },
    music: (lt) => (lt < REV ? [0.65 + 0.25 * seg(lt, 0.4, REV), 0.3] : [1, 0.2]),
    fx: (lt) => ({ snow: 0.55, bubbles: lt > REV ? 1.2 : 0.4,
      emit: sp && lt < REV + 0.6 && Math.random() < 0.16 ? { x: sp.x - subw.offsetWidth * 0.48, y: sp.y + subY(lt) + 2 * PX, n: 1 } : null }),
    render(lt) {
      T(lab, seg(lt, 0.15, 0.45));
      T(line, seg(lt, 0.25, 0.55));
      const k = Math.pow(seg(lt, 0.6, REV), 2.2);
      const v = lt < REV ? Math.round((b + gain * k) / 10) * 10 : a;
      setDigits(to, String(v));
      to.classList.toggle('lit', lt >= REV);
      setDigits(hn, String(v - b));
      hero.style.color = lt >= REV ? SUN : 'rgba(255,255,252,0.86)';
      const sc = lt < REV ? lerp(0.86, 0.94, k) : 1 + 0.22 * (1 - E.outExpo(seg(lt, REV, REV + 0.55)));
      T(hero, seg(lt, 0.45, 0.75), 0, 0, M ? sc : 1);
      const kp = E.outCubic(seg(lt, REV + 0.45, REV + 0.85));
      T(pts, seg(lt, REV + 0.45, REV + 0.75), 0, (1 - kp) * 12 * PX * M);
      T(subw, seg(lt, 0.1, 0.7), Math.sin(lt * 1.3) * 3 * PX * M, subY(lt));
    },
    cues: [
      [0.5, () => sfx('riser')],
      [REV, () => { sfx('impact'); flash(0.5); shake(10); if (hp) burst(hp.x, hp.y, 40, 90); }],
    ],
  };
}

/* 5 · Streak. Voice (3.2s): "Twelve" 0.15 · "days in a row." 0.65–1.7 · "Don't stop now." 2.1–3.1. Two dolphins pass below. */
function cStreak(root, d) {
  const V = 0.4, N = d.st.streak, shownN = Math.min(N, 14);
  root.classList.add('c5');
  const st = add(root, 'stack');
  const hero = add(st, 't-hero', String(N));
  const title = add(st, 't-title');
  const tw = words(title, 'days in a row.');
  const dots = add(st, 'c5-dots');
  const ds = Array.from({ length: shownN }, (_, i) => { const e = add(dots, 'c5-dot' + (i === shownN - 1 ? ' today' : '')); add(e, '', '', 'i'); return e; });
  const dont = add(st, 't-mid c5-dont');
  const dw = words(dont, 'Don’t stop now.');
  const DT = [V + 2.1, V + 2.42, V + 2.62];
  const D0 = V + 0.2, DS = 0.085;
  return {
    dur: 5.4,
    music: () => [0.85, 0.5],
    fx: () => ({ snow: 0.4, bubbles: 0.5 }),
    render(lt) {
      const kh = E.outBack(seg(lt, V + 0.12, V + 0.5));
      T(hero, seg(lt, V + 0.12, V + 0.24), 0, 0, M ? lerp(1.3, 1, clamp(kh, 0, 1.15)) : 1);
      tw.forEach((w, j) => { const t0 = V + 0.65 + j * 0.16, k = E.outCubic(seg(lt, t0, t0 + 0.4)); T(w, seg(lt, t0, t0 + 0.2), 0, (1 - k) * 14 * PX * M); });
      T(dots, seg(lt, D0 - 0.15, D0));
      ds.forEach((e, i) => { const t0 = D0 + i * DS, k = E.outBack(seg(lt, t0, t0 + 0.25)); e.firstChild.style.transform = `scale(${clamp(k, 0, 1.25).toFixed(3)})`; });
      ds[shownN - 1]?.classList.toggle('live', lt > D0 + shownN * DS);
      dw.forEach((w, j) => { const t0 = DT[j] ?? DT[2], k = E.outCubic(seg(lt, t0, t0 + 0.35)); T(w, seg(lt, t0, t0 + 0.16), 0, (1 - k) * 12 * PX * M); });
    },
    cues: [
      [V, () => say(lines(d).streak)],
      ...ds.map((e, i) => [D0 + i * DS, () => sfx('step')]),
      [1.0, () => { dolphin({ y: 0.82, dir: 1, dur: 4.2, s: 0.9, a: 0.5, arc: 0.03 }); dolphin({ y: 0.875, dir: 1, dur: 4.4, s: 0.72, a: 0.38, arc: 0.028, delay: 0.25 }); }],
    ],
  };
}

/** The score track: base → goal, this week's gain in sun, the sub as "you are here". */
function track(parent, d) {
  const tr = add(parent, 'track');
  const top = add(tr, 'tk-top');
  const cur = add(top, 'tk-cur', String(d.after), 'span');
  const bar = add(tr, 'tk-bar');
  const fill = add(bar, 'tk-fill', '', 'i'), wk = add(bar, 'tk-week', '', 'i');
  add(bar, 'tk-end', '', 'span');
  const mk = add(bar, 'tk-mk', SUB_SVG, 'span');
  const bot = add(tr, 'tk-bot', `<span class="t-small">Start of week <b>${d.before}</b></span><span class="t-small">Goal <b>${d.st.goalScore}</b></span>`);
  const f = (s) => clamp((s - d.base) / (d.st.goalScore - d.base), 0, 1);
  let lastK = -1, W = 0, hw = 0;
  function set(k) {
    if (k === lastK && W) return;
    lastK = k;
    const v = lerp(d.before, d.after, k), x = f(v), x0 = f(d.before);
    fill.style.width = (x0 * 100).toFixed(2) + '%';
    wk.style.left = (x0 * 100).toFixed(2) + '%';
    wk.style.width = (Math.max(0, x - x0) * 100).toFixed(2) + '%';
    mk.style.left = (x * 100).toFixed(2) + '%';
    // Keep the number above the sub, never past the frame edge.
    setText(cur, String(Math.round(v / 10) * 10));
    if (!W) { W = tr.offsetWidth; hw = cur.offsetWidth / 2; }
    cur.style.left = clamp(x * (W || 1), hw || 20, (W || 1) - (hw || 20)).toFixed(1) + 'px';
  }
  /** Re-measure after a resize or font load. */
  const remeasure = () => { W = 0; const k = lastK; lastK = -1; set(Math.max(0, k)); };
  return { el: tr, set, bar, bot, remeasure };
}
/** All lessons as dots: mastered → ready now → locked. */
function lessonGrid(parent) {
  const gEl = add(parent, 'grid');
  const st = graph.stats();
  const cells = [];
  for (let i = 0; i < st.total; i++) cells.push(add(gEl, i < st.mastered ? 'm' : i < st.mastered + st.frontier ? 'r' : 'l', '', 'i'));
  return { el: gEl, cells };
}

/* 6 · What's left. Voice (4.2s): "Three hundred and twenty" 0.15–1.3 · "points to go." 1.4–1.9 · "Next week..." 2.1–2.7 · "we take it." 3.4–4.1. */
function cLeft(root, d) {
  const V = 0.4;
  root.classList.add('c6');
  const st = add(root, 'stack');
  const lab = add(st, 't-body', 'What’s left');
  const hero = add(st, 't-hero c6-hero', String(d.gap));
  const sub = add(st, 't-mid', 'points to go.');
  const tk = track(st, d);
  const gr = lessonGrid(st);
  const leg = add(st, 'legend', `<span>${d.left} lessons left</span><span class="sep">·</span><span class="rd">${d.ready} ready now</span>`);
  const TK = 1.1, GR = 2.3, GS = 0.8 / Math.max(1, gr.cells.length), PULSE = V + 3.42;
  let gridDone = false;
  return {
    dur: 6.0,
    measure() { tk.remeasure(); },
    music: () => [0.5, 1.2],
    fx: () => ({ snow: 0.3, bubbles: 0.45, caustic: 0.5 }),
    render(lt) {
      T(lab, seg(lt, 0.1, 0.4));
      const kh = E.outExpo(seg(lt, V + 0.12, V + 0.6));
      T(hero, seg(lt, V + 0.12, V + 0.3), 0, (1 - kh) * 20 * PX * M);
      const ks = E.outCubic(seg(lt, V + 1.4, V + 1.8));
      T(sub, seg(lt, V + 1.4, V + 1.65), 0, (1 - ks) * 12 * PX * M);
      T(tk.el, seg(lt, TK, TK + 0.3));
      tk.set(E.inOut(seg(lt, TK + 0.2, TK + 1.0)));
      T(gr.el, seg(lt, GR - 0.2, GR));
      if (!gridDone || lt < GR + 1) {
        gr.cells.forEach((c, i) => { const k = E.outBack(seg(lt, GR + i * GS, GR + i * GS + 0.25)); c.style.transform = k >= 1 ? '' : `scale(${clamp(k, 0, 1.3).toFixed(3)})`; });
        gridDone = lt >= GR + 1.1;
      }
      const kl = E.outCubic(seg(lt, GR + 0.9, GR + 1.3));
      T(leg, seg(lt, GR + 0.9, GR + 1.2), 0, (1 - kl) * 8 * PX * M);
    },
    cues: [
      [V, () => say(lines(d).left)],
      [V + 0.12, () => sfx('intro')],
      [TK + 1.0, () => sfx('step')],
      [PULSE, () => { gr.el.classList.remove('pulse'); void gr.el.offsetWidth; gr.el.classList.add('pulse'); sfx('sonar'); }],
    ],
  };
}

/* 7 · Next week: three recommended lessons, then Start. Holds at the end (no auto-exit). */
function cNext(root, d) {
  root.classList.add('c7');
  const st = add(root, 'stack');
  const title = add(st, 't-title');
  const tw = words(title, 'Next week.');
  const line = add(st, 't-body', 'Start where you left off.');
  block = nextBlock(st);
  const R0 = 0.7, RS = 0.14;
  return {
    dur: 3.6,
    music: () => [0.42, 1.5],
    fx: () => ({ snow: 0.25, bubbles: 0.4, caustic: 0.8 }),
    render(lt) {
      tw.forEach((w, j) => { const t0 = 0.12 + j * 0.14, k = E.outCubic(seg(lt, t0, t0 + 0.42)); T(w, seg(lt, t0, t0 + 0.2), 0, (1 - k) * 16 * PX * M); });
      const kl = E.outCubic(seg(lt, 0.4, 0.8));
      T(line, seg(lt, 0.4, 0.7), 0, (1 - kl) * 10 * PX * M);
      [...block.rowsEl.children].forEach((r, i) => {
        const t0 = R0 + i * RS, k = E.outCubic(seg(lt, t0, t0 + 0.45));
        if (k >= 1) { if (r.style.opacity !== '') { r.style.opacity = ''; r.style.transform = ''; } r.style.pointerEvents = ''; return; }
        T(r, seg(lt, t0, t0 + 0.2), 0, (1 - k) * 22 * PX * M); r.style.pointerEvents = 'none';
      });
      const kc = E.outBack(seg(lt, 1.25, 1.65));
      T(block.cta, seg(lt, 1.25, 1.4), 0, 0, M ? lerp(0.9, 1, clamp(kc, 0, 1.1)) : 1);
      block.cta.style.pointerEvents = lt >= 1.3 ? '' : 'none';
      T(block.rp, seg(lt, 1.5, 1.8));
    },
    cues: [
      [R0, () => sfx('step')], [R0 + RS, () => sfx('step')], [R0 + 2 * RS, () => sfx('step')],
      [1.25, () => sfx('unlock')],
    ],
  };
}

const CARDS = [cOpen, cLessons, cTop, cScore, cStreak, cLeft, cNext];

// ═════════════════════ SUMMARY (Esc, ×, or past the last card) ═════════════════════
let smStats = null;
function mountSummary() {
  const root = swapRoot('card sm');
  const d = weekData();
  add(root, 't-title', 'Your week.');
  add(root, 't-body', esc(d.range));
  const tiles = add(root, 'sm-tiles');
  const tile = (v, l) => add(tiles, 'tile', `<b>${v}</b><span>${l}</span>`);
  smStats = { lessons: tile(d.lessons.length, 'lessons'), gain: tile(`+${d.gain}`, 'points'), streak: tile(d.st.streak, 'day streak') };
  smStats.gain.querySelector('b').classList.add('sun');
  add(root, 't-small sm-h', 'What’s left');
  const tk = track(root, d);
  smStats.track = tk; smStats.d = d;
  requestAnimationFrame(() => tk.set(1));
  const leg = add(root, 'legend', `<span>${d.gap} to go</span><span class="sep">·</span><span>${d.left} lessons left</span><span class="sep">·</span><span class="rd">${d.ready} ready now</span>`);
  leg.style.marginTop = 'calc(var(--px) * 12)';
  smStats.leg = leg;
  add(root, 't-small sm-h', 'Next up');
  block = nextBlock(root);
  root.addEventListener('pointerdown', (e) => e.stopPropagation());
}
function refreshSummaryStats() {
  if (!smStats || !smStats.lessons.isConnected) return;
  const d = weekData();
  const upd = (el, v) => { const b = el.querySelector('b'); if (b.textContent !== String(v)) { b.textContent = String(v); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); } };
  upd(smStats.lessons, d.lessons.length); upd(smStats.gain, `+${d.gain}`);
  const old = smStats.track.el; const nt = track(document.createElement('div'), d); old.replaceWith(nt.el); smStats.track = nt; nt.set(1);
  smStats.leg.innerHTML = `<span>${d.gap} to go</span><span class="sep">·</span><span>${d.left} lessons left</span><span class="sep">·</span><span class="rd">${d.ready} ready now</span>`;
}

// ═════════════════════ PLAYER ═════════════════════
const barsEl = $('.bars');
const segFills = CARDS.map(() => add(add(barsEl, 'seg'), '', '', 'i'));
let begun = false, mode = 'story', ci = -1, inst = null, lt = 0, prevLt = 0, lastLt = 0, clock = 0;
let userPaused = false, held = false;
const segK = CARDS.map(() => -1);

function swapRoot(cls) {
  for (const old of [...cardsEl.children]) {
    if (old.classList.contains('leaving')) { old.remove(); continue; }
    if (RM) { old.remove(); continue; }
    old.classList.add('leaving');
    setTimeout(() => old.remove(), 280);
  }
  dolphins.forEach((q) => { q.out = true; });
  return add(cardsEl, cls);
}
function mountCard(i) {
  const root = swapRoot('card');
  ci = i; block = null;
  inst = CARDS[i](root, D);
  inst.measure?.();
}
function go(i, manual = true) {
  i = clamp(i, 0, CARDS.length - 1);
  if (manual) hushVoice();
  if (lessonCard.lesson) { silentClose = true; lessonCard.close(); silentClose = false; }
  const fromSummary = mode === 'summary';
  mode = 'story';
  phone.classList.remove('summary');
  mountCard(i);
  lt = 0; prevLt = -1e-4;
  if (begun && (i > 0 || manual || fromSummary)) { sfx('whoosh'); FX.rise = RM ? 0 : 260; }
  setWater(i);
  updateNav();
}
function next() { if (mode !== 'story') return; if (ci < CARDS.length - 1) go(ci + 1); else toSummary(); }
function prev() { if (mode === 'summary') { go(CARDS.length - 1); return; } go(Math.max(0, ci - 1)); }
function toSummary() {
  if (mode === 'summary') return;
  hushVoice();
  if (lessonCard.lesson) { silentClose = true; lessonCard.close(); silentClose = false; }
  mode = 'summary';
  phone.classList.add('summary');
  mountSummary();
  sfx('whoosh'); FX.rise = RM ? 0 : 160;
  setWater(7);
  updateNav();
}
function replay() {
  D = weekData();
  curScore = D.after;
  userPaused = false; syncPause();
  go(0, true);
}
function syncPause() {
  bPause.innerHTML = userPaused ? ICON.play : ICON.pause;
  bPause.setAttribute('aria-label', userPaused ? 'Play' : 'Pause');
}
function updateNav() {
  nPrev.classList.toggle('off', mode === 'story' && ci === 0);
  nNext.classList.toggle('off', mode === 'summary');
}

// ── input: tap zones (left ⅓ back, right ⅔ next), press-and-hold to pause, swipes, keys ──
let down = null, holdTimer = 0;
const HOLD_MS = 230;
phone.addEventListener('pointerdown', (e) => {
  if (!begun || mode !== 'story' || e.button > 0) return;
  if (e.target.closest('button, a, .lrow')) return;
  down = { x: e.clientX, y: e.clientY, id: e.pointerId, moved: false };
  try { phone.setPointerCapture(e.pointerId); } catch { /* no capture */ }
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => { if (down && !down.moved) { held = true; phone.classList.add('held'); document.body.classList.add('story-held'); } }, HOLD_MS);
});
phone.addEventListener('pointermove', (e) => {
  if (!down || e.pointerId !== down.id) return;
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 12) { down.moved = true; clearTimeout(holdTimer); }
});
function endPress(e, cancel) {
  if (!down || e.pointerId !== down.id) return;
  clearTimeout(holdTimer);
  const dx = e.clientX - down.x, dy = e.clientY - down.y, wasHeld = held;
  down = null;
  if (held) { held = false; phone.classList.remove('held'); document.body.classList.remove('story-held'); }
  if (cancel || wasHeld) return;
  if (lessonCard.lesson) { lessonCard.close(); return; }
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); return; }
  if (dy > 80 && dy > Math.abs(dx)) { toSummary(); return; }
  if (Math.abs(dx) > 12 || Math.abs(dy) > 12) return;
  const r = phone.getBoundingClientRect();
  (e.clientX - r.left) / r.width < 1 / 3 ? prev() : next();
}
phone.addEventListener('pointerup', (e) => endPress(e, false));
phone.addEventListener('pointercancel', (e) => endPress(e, true));
phone.addEventListener('contextmenu', (e) => e.preventDefault());
$('#scrim').addEventListener('pointerdown', (e) => { e.stopPropagation(); lessonCard.close(); });
bPause.addEventListener('click', () => { userPaused = !userPaused; syncPause(); });
bClose.addEventListener('click', () => toSummary());
nPrev.addEventListener('click', () => prev());
nNext.addEventListener('click', () => next());
addEventListener('keydown', (e) => {
  if (!begun || e.metaKey || e.ctrlKey || e.altKey) return;
  if (lessonCard.lesson) return; // the lesson card handles its own Esc
  const tag = e.target && e.target.tagName;
  if (e.key === 'Escape') { e.preventDefault(); toSummary(); return; }
  if (e.key === ' ' || e.code === 'Space') { if (tag === 'BUTTON' || tag === 'A') return; e.preventDefault(); if (mode === 'story') next(); return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
}, true);
document.addEventListener('visibilitychange', () => { if (document.hidden) hushVoice(); });
let resizeRaf = 0;
addEventListener('resize', () => { cancelAnimationFrame(resizeRaf); resizeRaf = requestAnimationFrame(() => { layout(); remeasureAll(); }); });
function remeasureAll() { if (mode === 'story') inst?.measure?.(); else smStats?.track?.remeasure(); }

// ── main loop ────────────────────────────────────────────
const PERF = params.has('perf') ? (window.__perf = { work: [], gap: [] }) : null;
let last = performance.now();
function frame(now) {
  const t0 = performance.now();
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  if (PERF) PERF.gap.push(now - last);
  last = now; clock += dt;
  const paused = !begun || userPaused || held || !!lessonCard.lesson || document.hidden || FREEZE;
  if (mode === 'story') {
    if (!paused) {
      lt += dt;
      if (lt >= inst.dur) { if (ci < CARDS.length - 1) go(ci + 1, false); else lt = inst.dur; }
    }
    if (lt > prevLt) for (const [ct, fn] of inst.cues || []) if (ct > prevLt && ct <= lt) fn();
    prevLt = lt; lastLt = lt;
    inst.render(lt, dt);
    for (let k = 0; k < CARDS.length; k++) {
      const v = k < ci ? 1 : k > ci ? 0 : clamp(lt / inst.dur, 0, 1);
      if (Math.abs(v - segK[k]) > 0.0005) { segK[k] = v; segFills[k].style.transform = `scaleX(${v.toFixed(4)})`; }
    }
    if (begun) { const [v, r] = inst.music(lt); score.setIntensity(v, r); }
  } else if (begun) score.setIntensity(0.3, 2);
  FX.shake *= Math.exp(-dt * 7);
  FX.flash *= Math.exp(-dt * 5);
  FX.rise *= Math.exp(-dt * 3.2);
  const P = Object.assign({}, FXD, mode === 'story' && inst.fx ? inst.fx(lt) : { snow: 0.25, bubbles: 0.3, caustic: 0.7 });
  drawFx(dt, P);
  const amp = FX.shake;
  cardsEl.style.transform = amp > 0.2 ? `translate3d(${((Math.random() * 2 - 1) * amp).toFixed(1)}px, ${((Math.random() * 2 - 1) * amp).toFixed(1)}px, 0)` : '';
  flashEl.style.opacity = FX.flash > 0.004 ? FX.flash.toFixed(3) : '0';
  if (PERF) PERF.work.push(performance.now() - t0);
  requestAnimationFrame(frame);
}

layout();
go(0, false);
requestAnimationFrame(frame);
document.fonts?.ready.then(() => { layout(); remeasureAll(); });

function start() {
  if (begun) return;
  begun = true;
  const cn = parseInt(params.get('card'), 10), tp = parseFloat(params.get('t'));
  const demo = params.get('demo') === 'complete';
  if (params.has('summary')) { toSummary(); }
  else if (demo) { go(CARDS.length - 1, false); lt = inst.dur; prevLt = lt; }
  else if (cn >= 1 && cn <= CARDS.length) {
    go(cn - 1, false);
    if (Number.isFinite(tp)) { lt = clamp(tp, 0, inst.dur); prevLt = lt - 1e-4; }
  } else {
    // The first card's cues fire from t=0 now that audio is live.
    lt = 0; prevLt = -1e-4;
  }
  if (demo) {
    setTimeout(() => {
      const l = recommend(3)[0];
      if (!l) return;
      lessonCard.open(l);
      setTimeout(() => lessonCard.el.querySelector('.actions .kg-btn.primary')?.click(), 450);
    }, 600);
  }
}
window.__wk = { get state() { return { mode, ci, lt, held, userPaused, D }; }, go, next, prev, toSummary, replay, score };
</script>
</body>
