<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tiny Planet</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/dolphin.css">
<style>
  :root { color-scheme: light; --orange: #FF9F43; --orange-shadow: #D9792A; }
  html, body { overflow: hidden; }
  body {
    color: var(--ink);
    background: linear-gradient(180deg, #92D8FF 0%, #BCE7FF 50%, #E2F5FF 100%);
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  /* Status (top-left): the one piece of text on screen at rest. */
  .status {
    position: fixed; top: 24px; left: 24px; z-index: 20; pointer-events: none; max-width: calc(100vw - 48px);
    opacity: 0; transform: translateY(-6px); transition: opacity 600ms ease, transform 600ms cubic-bezier(.2,.9,.3,1);
  }
  .status.show { opacity: 1; transform: none; }
  .st-line { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; row-gap: 4px; font-weight: 700; font-size: 15px; color: var(--muted); }
  .st-line > span { white-space: nowrap; }
  .st-line b { color: var(--ink); font-weight: 800; display: inline-block; }
  .st-line .big { font-family: var(--font-head); font-weight: normal; font-size: 24px; line-height: 1; }
  .st-sep { color: var(--cloud); }
  .pop { animation: pop 520ms cubic-bezier(.2,.9,.3,1.4); }
  @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .hint { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--muted); transition: opacity 900ms ease; }
  .hint.gone { opacity: 0; }
  .crumbs { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: auto; }
  .crumbs[hidden] { display: none; }
  .crumb {
    font: 800 13px/1 var(--font-body); color: var(--ink); background: var(--foam); height: 32px; box-sizing: border-box;
    border: 1.5px solid var(--mist); border-radius: 999px; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 3px 0 var(--chrome-shadow);
  }
  button.crumb { cursor: pointer; transition: transform 120ms ease, box-shadow 120ms ease; }
  button.crumb:hover { transform: translateY(1px); box-shadow: 0 2px 0 var(--chrome-shadow); }
  button.crumb:focus-visible { outline: 3px solid rgba(47, 154, 230, 0.45); outline-offset: 2px; }
  .crumb i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .crumb em { font-style: normal; color: var(--muted); font-weight: 700; }

  .skip {
    position: fixed; top: 20px; right: 20px; z-index: 22; height: 36px; padding: 0 14px; border-radius: 999px; cursor: pointer;
    font: 800 13px/1 var(--font-body); color: var(--ink); background: rgba(255, 255, 252, 0.7); border: 1.5px solid var(--mist);
    transition: opacity 300ms ease, background 150ms ease;
  }
  .skip:hover { background: var(--foam); }
  .skip.gone { opacity: 0; pointer-events: none; }

  /* Overlay labels: projected from 3D, laid out in JS to stay clear of each other and the chrome. */
  .lbl { position: fixed; left: 0; top: 0; z-index: 18; pointer-events: none; will-change: transform; opacity: 0; transition: opacity 160ms ease; white-space: nowrap; }
  .lbl.show { opacity: 1; }
  .cont-lbl {
    height: 36px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px;
    background: var(--foam); border: 1.5px solid var(--mist); box-shadow: 0 3px 0 var(--chrome-shadow);
    font: 800 15px/1 var(--font-body); color: var(--ink);
  }
  .cont-lbl i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .cont-lbl em { font-style: normal; font-weight: 700; color: var(--muted); }
  .topic-lbl {
    height: 26px; box-sizing: border-box; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center;
    background: rgba(255, 255, 252, 0.88); font: 800 13px/1 var(--font-body); color: var(--ink);
  }
  .topic-lbl.locked { color: var(--muted); background: rgba(255, 255, 252, 0.7); }
  .tip {
    max-width: 240px; white-space: normal; background: var(--foam); color: var(--ink); border: 1.5px solid var(--mist);
    border-radius: 14px; padding: 8px 12px; box-shadow: 0 3px 0 var(--chrome-shadow); font-size: 13px; font-weight: 700; line-height: 1.35;
    transition: opacity 90ms ease;
  }
  .tip b { display: block; font-size: 15px; font-weight: 800; line-height: 1.25; }
  .tip .st { display: flex; align-items: center; gap: 8px; margin-top: 4px; color: var(--muted); }
  .tip .st i { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1.5px rgba(10, 35, 79, 0.18) inset; }
  .tip .act { display: block; margin-top: 4px; color: var(--wave-shadow); font-weight: 800; }

  /* The one recommended next lesson: a real button anchored to its landmark (or to the planet's edge). */
  .next {
    position: fixed; left: 0; top: 0; z-index: 21; height: 36px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 4px;
    padding: 0 8px 0 14px; border-radius: 999px; border: 2px solid var(--sun-shadow); background: var(--sun); color: var(--ink);
    font: 800 15px/1 var(--font-body); white-space: nowrap; max-width: min(300px, calc(100vw - 32px)); cursor: pointer;
    box-shadow: 0 3px 0 var(--sun-shadow); opacity: 0; pointer-events: none; will-change: transform;
    transition: opacity 240ms ease, filter 140ms ease;
  }
  .next span { overflow: hidden; text-overflow: ellipsis; }
  .next svg { width: 18px; height: 18px; flex: none; }
  .next .turn { display: none; margin-right: 2px; }
  .next.edge .turn { display: block; }
  .next.edge .chev { display: none; }
  .next.edge { padding: 0 14px 0 10px; }
  .next.edge.flip .turn { transform: scaleX(-1); }
  .next.show { opacity: 1; pointer-events: auto; }
  .next[data-state="progress"] { background: var(--orange); border-color: var(--orange-shadow); box-shadow: 0 3px 0 var(--orange-shadow); }
  .next.hot { filter: brightness(1.05); }
  .next:active { box-shadow: none; }
  .next:focus-visible { outline: 3px solid rgba(47, 154, 230, 0.5); outline-offset: 2px; }
  #stems { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 17; pointer-events: none; overflow: visible; }
  #stem { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; opacity: 0; transition: opacity 200ms ease; }

  @media (max-width: 700px) {
    .status { top: 16px; left: 16px; max-width: calc(100vw - 32px); }
    .st-line { font-size: 13px; }
    .st-line .big { font-size: 22px; }
    .skip { top: 14px; right: 14px; }
  }
  @media (max-width: 520px) { .st-sep { display: none; } .st-line { flex-direction: column; align-items: flex-start; } }
  @media (prefers-reduced-motion: reduce) {
    .status, .lbl, .next, .hint, .skip, #stem { transition: none; }
    .pop { animation: none; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<body>
<canvas id="gl" tabindex="0" role="img" aria-label="Your SAT world as a little planet. Each continent is a subject; each landmark along its winding road is a lesson. Drag to spin, scroll or pinch to zoom, click a continent to fly to it."></canvas>

<header class="status" id="hud" aria-live="polite">
  <div class="st-line">
    <span><b class="big" id="hudCount">0</b> of <span id="hudTotal">89</span> explored</span>
    <span class="st-sep">·</span>
    <span>Projected <b id="hudScore">400</b> → goal <span id="hudGoal">1500</span></span>
  </div>
  <nav class="crumbs" id="crumbs" hidden aria-label="Where you are">
    <button class="crumb" id="backBtn" type="button">‹ Whole planet</button>
    <span class="crumb" id="crumbCur"><i></i><span></span><em></em></span>
  </nav>
  <div class="hint" id="hint" hidden></div>
</header>
<button class="skip gone" id="skip" type="button">Skip intro</button>

<svg id="stems" aria-hidden="true"><line id="stem" x1="0" y1="0" x2="0" y2="0"/></svg>
<div class="lbl cont-lbl" id="contLbl" aria-hidden="true"><i></i><span></span><em></em></div>
<div id="topicLayer" aria-hidden="true"></div>
<div class="lbl tip" id="tip" role="tooltip"></div>
<button class="next" id="next" type="button"><svg class="turn" viewBox="0 0 16 16" aria-hidden="true"><path d="M12.6 9.2A5 5 0 1 1 11 4.2" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><path d="M11.4 1.6 11.2 4.6 8.2 4.4" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="nextText">Next</span><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

<script type="module">
/*
 * Sound design — Tiny Planet
 * Music: playful, whimsical and adventurous. A bouncy marimba / pizzicato ostinato over a warm
 *   ukulele-and-glockenspiel pad with light hand percussion (shaker, woodblock); it grows into a small
 *   toy-orchestra march as you explore. Calm and curious when zoomed out on the whole planet, a little
 *   busier when you dive into a continent or start a lesson, a short lift after each lesson you finish.
 *   setIntensity follows how much of the world you have explored, how close the camera is, and the
 *   moment (intro build, open lesson, celebration), easing back down when you are idle.
 * SFX (score.sfx), each fired on the frame its visual happens:
 *   hover    – soft wooden "tok" (pointer reaches a landmark, a continent or the Next callout)
 *   select   – bright xylophone tap (lesson card opens)                              [lesson-card.js]
 *   back     – the same tap, lower (card closes; Esc, sky click or "Whole planet" flies back out)
 *   zoomIn   – airy upward whoosh with a little slide-whistle lift (camera flies into a continent)
 *   zoomOut  – the same whoosh, falling (camera pulls back out to the whole planet)
 *   start    – wind-up toy crank, ~0.9s (Start lesson pressed)                        [lesson-card.js]
 *   complete – cork pop + glockenspiel sparkle (the landmark turns green)            [lesson-card.js]
 *   unlock   – rising two-note music-box chime (new ready landmarks pop up, clouds part)
 *   riser    – ~2.2s swirling wind + rising strings while the planet spins to a stop
 *   intro    – soft timpani thump + a full major chord (you land on your planet)
 *   step     – tiny marimba tick (a landmark lights during the intro, your pin hops to a new
 *              landmark, a continent clicks past the centre while you spin the globe)
 */
import { createGraph, DOMAIN_HUES, pct, clamp, projectedScore } from '../shared/graph.js';
import { mountChrome, params } from '../shared/chrome.js';
import { createLessonCard } from '../shared/lesson-card.js';

const THREE = window.THREE;
const errors = [];
addEventListener('error', (e) => errors.push(String(e.message)));
addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));

// ════════════════════════ Basics ════════════════════════
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const touchFirst = matchMedia('(hover: none)').matches;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOutBack = (t) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const wrapPi = (a) => a - TAU * Math.floor((a + Math.PI) / TAU);
const damp = (a, b, rate, dt) => b + (a - b) * Math.exp(-rate * dt);
function mulberry32(a) {
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function hash3(i, j, k) {
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(k, 1440662683)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296;
}
function vnoise3(x, y, z) {
  const i = Math.floor(x), j = Math.floor(y), k = Math.floor(z), fx = x - i, fy = y - j, fz = z - k;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy), w = fz * fz * (3 - 2 * fz);
  const a = lerp(lerp(hash3(i, j, k), hash3(i + 1, j, k), u), lerp(hash3(i, j + 1, k), hash3(i + 1, j + 1, k), u), v);
  const b = lerp(lerp(hash3(i, j, k + 1), hash3(i + 1, j, k + 1), u), lerp(hash3(i, j + 1, k + 1), hash3(i + 1, j + 1, k + 1), u), v);
  return lerp(a, b, w) * 2 - 1;
}
function fbm3(x, y, z, oct = 3) { let s = 0, a = 0.5, f = 1; for (let o = 0; o < oct; o++) { s += a * vnoise3(x * f + o * 17.1, y * f + o * 9.3, z * f + o * 3.7); f *= 2.03; a *= 0.5; } return s; }
const col = (h) => new THREE.Color(h);

const STATE_COL = { mastered: '#3FA669', progress: '#FF9F43', ready: '#FFF44E', locked: '#B7C0CC' };
const STATE_C = Object.fromEntries(Object.entries(STATE_COL).map(([k, v]) => [k, col(v)]));
const WALL_C = col('#FFFCF2'), WALL_LOCK = col('#DCE3EB'), PLAZA_C = col('#FFFCF2'), PLAZA_LOCK = col('#CDD6E0'), ROOF_LOCK = col('#AEB9C7');
const INK = 0x173A66;
const vkey = (l) => (l.state === 'mastered' ? 'mastered' : l.state === 'frontier' ? (l.progress > 0 ? 'progress' : 'ready') : 'locked');

// ════════════════════════ World layout ════════════════════════
const graph = createGraph();
const R = 1, H_BASE = 0.014, STEP = 0.086, LAND_R = 0.118, ROAD_HALF = 0.0048;
const BIOMES = {
  meadow: { ground: '#A3D76B', alt: '#96CE60', high: '#BDE38A', beach: '#F4E3B1', walk: '#FFF3D2', relief: 'hills' },
  forest: { ground: '#63BA77', alt: '#57B06C', high: '#7CC88B', beach: '#F1E2B2', walk: '#FFF3D2', relief: 'soft' },
  savanna: { ground: '#EBC865', alt: '#E3BE58', high: '#F2D788', beach: '#F6E7BC', walk: '#FFF6DE', relief: 'dunes' },
  tundra: { ground: '#B4D1E5', alt: '#AACADF', high: '#E9F2F8', beach: '#C6DDEC', walk: '#FFFFFF', relief: 'peaks' },
  blossom: { ground: '#F5CCA9', alt: '#EFC19C', high: '#F9DCC2', beach: '#F7E6C4', walk: '#FFF6E6', relief: 'terraces' },
};
for (const B of Object.values(BIOMES)) for (const k of ['ground', 'alt', 'high', 'beach', 'walk']) B[k + 'C'] = col(B[k]);
const DEFS = [
  { domain: 'Algebra', lon: -4, lat: 10, biome: 'meadow', seed: 11 },
  { domain: 'Problem Solving & Data', lon: 62, lat: -17, biome: 'forest', seed: 23 },
  { domain: 'Geometry & Trig', lon: 146, lat: 14, biome: 'savanna', seed: 37 },
  { domain: 'Reading & Writing', lon: 217, lat: -10, biome: 'tundra', seed: 41 },
  { domain: 'Advanced Math', lon: 289, lat: 15, biome: 'blossom', seed: 53 },
];
const dirLL = (lon, lat) => new THREE.Vector3(Math.cos(lat * DEG) * Math.sin(lon * DEG), Math.sin(lat * DEG), Math.cos(lat * DEG) * Math.cos(lon * DEG));
function toSphere(K, x, y, out = new THREE.Vector3()) {
  const d = Math.hypot(x, y);
  if (d < 1e-9) return out.copy(K.c);
  const s = Math.sin(d) / d, c = Math.cos(d);
  return out.set(K.c.x * c + (K.e.x * x + K.n.x * y) * s, K.c.y * c + (K.e.y * x + K.n.y * y) * s, K.c.z * c + (K.e.z * x + K.n.z * y) * s);
}

/** A winding road: greedy meander with a sinusoidal preferred turn, kept compact and self-avoiding. */
function layoutRoad(n, seed, step) {
  const rnd = mulberry32(seed);
  let best = null, bestScore = Infinity;
  for (let attempt = 0; attempt < 90; attempt++) {
    const phase = rnd() * TAU, freq = 0.3 + rnd() * 0.5, amp = 0.3 + rnd() * 0.6, pull = 0.08 + rnd() * 0.2;
    const pts = [[0, 0]];
    let h = rnd() * TAU, cx = 0, cy = 0;
    for (let i = 1; i < n; i++) {
      const [px, py] = pts[i - 1];
      let bc = null, bcost = Infinity;
      for (let s = -12; s <= 12; s++) {
        const a = (s / 12) * 1.1, hh = h + a, qx = px + Math.cos(hh) * step, qy = py + Math.sin(hh) * step;
        let cost = (a - amp * Math.sin(i * freq + phase)) ** 2;
        cost += pull * ((qx - cx) ** 2 + (qy - cy) ** 2) / (step * step);
        for (let j = 0; j < i - 1; j++) { const d = Math.hypot(qx - pts[j][0], qy - pts[j][1]) / step; if (d < 2.05) cost += (2.05 - d) ** 2 * 9; }
        if (cost < bcost) { bcost = cost; bc = [qx, qy, hh]; }
      }
      pts.push([bc[0], bc[1]]); h = bc[2];
      cx = (cx * i + bc[0]) / (i + 1); cy = (cy * i + bc[1]) / (i + 1);
    }
    let minD = Infinity;
    for (let i = 0; i < n; i++) for (let j = i + 3; j < n; j++) minD = Math.min(minD, Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1]) / step);
    let rg = 0; for (const p of pts) rg += (p[0] - cx) ** 2 + (p[1] - cy) ** 2;
    rg = Math.sqrt(rg / n) / step;
    const score = rg + (minD < 1.9 ? 50 + (1.9 - minD) * 40 : 0);
    if (score < bestScore) { bestScore = score; best = pts.map((p) => [p[0] - cx, p[1] - cy]); }
  }
  // Principal axis → east-west, so continents lie wide like the screen.
  let sxx = 0, syy = 0, sxy = 0;
  for (const [x, y] of best) { sxx += x * x; syy += y * y; sxy += x * y; }
  const ang = 0.5 * Math.atan2(2 * sxy, sxx - syy), ca = Math.cos(-ang), sa = Math.sin(-ang);
  return best.map(([x, y]) => [x * ca - y * sa, x * sa + y * ca]);
}
function catmull2(pts, seg) {
  const out = [], n = pts.length;
  for (let i = 0; i < n - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n - 1, i + 2)];
    for (let s = 0; s < seg; s++) {
      const t = s / seg, t2 = t * t, t3 = t2 * t;
      const f = (k) => 0.5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3);
      out.push({ x: f(0), y: f(1), k: i, f: t });
    }
  }
  out.push({ x: pts[n - 1][0], y: pts[n - 1][1], k: n - 2, f: 1 });
  return out;
}
const leafGroups = (n) => (n.children.every((c) => !c.children.length) ? [n] : n.children.flatMap(leafGroups));

const conts = DEFS.map((def, ci) => {
  const dom = graph.domains.find((d) => d.label === def.domain);
  const c = dirLL(def.lon, def.lat), e = new THREE.Vector3(0, 1, 0).cross(c).normalize(), n = c.clone().cross(e).normalize();
  const K = { ci, def, dom, c, e, n, biome: def.biome, B: BIOMES[def.biome], hue: DOMAIN_HUES[def.domain], hi: 0 };
  K.seq = [];
  dom.children.forEach((t, ti) => { for (const g of leafGroups(t)) for (const l of g.children) K.seq.push({ l, t, ti, g }); });
  K.p2 = layoutRoad(K.seq.length, def.seed * 7919 + 3, STEP);
  const rnd = mulberry32(def.seed * 104729);
  const dense = catmull2(K.p2, 12);
  // Road samples in 3D.
  K.dense = dense.map((s) => ({ ...s, d: toSphere(K, s.x, s.y) }));
  const S = new Float32Array(dense.length * 3);
  K.sTopic = new Int16Array(dense.length); K.sGroup = new Int16Array(dense.length);
  K.dense.forEach((s, i) => {
    S[i * 3] = s.d.x; S[i * 3 + 1] = s.d.y; S[i * 3 + 2] = s.d.z;
    const ref = K.seq[s.f < 0.5 ? s.k : s.k + 1];
    K.sTopic[i] = ref.ti; K.sGroup[i] = ref.g.id;
  });
  K.samples = S;
  // Land: discs along the road plus a few blobs for an organic coast.
  const discs = [];
  K.dense.forEach((s, i) => { if (i % 2 === 0) discs.push([s.x, s.y, LAND_R * (0.9 + 0.3 * rnd())]); });
  for (let b = 0; b < 11; b++) {
    const s = dense[Math.floor(rnd() * dense.length)], a = rnd() * TAU, r = 0.06 + rnd() * 0.06;
    discs.push([s.x + Math.cos(a) * (LAND_R * 0.8 + r * 0.3), s.y + Math.sin(a) * (LAND_R * 0.8 + r * 0.3), r]);
  }
  const D = new Float32Array(discs.length * 4);
  let ext = 0, exX = 0, exY = 0;
  discs.forEach(([x, y, r], i) => {
    const d = toSphere(K, x, y); D[i * 4] = d.x; D[i * 4 + 1] = d.y; D[i * 4 + 2] = d.z; D[i * 4 + 3] = 1 / r;
    ext = Math.max(ext, Math.hypot(x, y) + r); exX = Math.max(exX, Math.abs(x) + r * 0.8); exY = Math.max(exY, Math.abs(y) + r * 0.8);
  });
  K.discs = D; K.ext = ext; K.exX = exX; K.exY = exY; K.cosBound = Math.cos(ext + 0.1);

    let best = null, bd = -1;
    for (const s of K.dense) {
      const w = s.d.clone().multiplyScalar(FZ).applyMatrix4(planet.matrixWorld); const p = toScreen(w, { x: 0, y: 0, z: 0 });
      const dn = nextL ? Math.hypot(p.x - nextL.scr.x, p.y - nextL.scr.y) : 999;
      let dl = 999; for (const L of K.landmarks) dl = Math.min(dl, Math.hypot(p.x - L.scr.x, p.y - L.scr.y));
      const sc = Math.min(dn, 120) + dl * 0.2 - Math.hypot(p.x - center.x, p.y - center.y) * 0.3;
      if (dl > 8 && sc > bd) { bd = sc; best = p; }
    }
    if (best) { pointer.x = best.x; pointer.y = best.y; pointer.in = true; pointer.movedAt = performance.now() - 5000; }
  }
}

const perf = { n: 0, upd: 0, ren: 0, max: 0, gaps: [] };
let last = performance.now(), paused = false;
function tick(now) {
  now = Math.max(now, last);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t0 = performance.now();
  safeRects(now);
  introUpdate(now);
  if (intro.done && !demoRan) { demoRan = true; runDemo(); }
  stepFlight(now);
  updateMotion(now, dt);
  applyRig();
  measure();
  zsNow = zoomScale();
  updateRoad(now);
  updateLandmarks(now, dt);
  updatePin(now);
  updateRings(now);
  // Front continent (for crumbs, topic labels and the spin tick).
  _qi.copy(planet.quaternion).invert();
  const F = new THREE.Vector3(0, 0, 1).applyQuaternion(_qi);
  let bc = 0, bd = -2; for (const K of conts) { const d = K.c.dot(F); if (d > bd) { bd = d; bc = K.ci; } }
  if (bc !== frontCont) { if (navOn && (dragging || flight || Math.abs(rig.vYaw) > 0.3)) score.sfx('step'); frontCont = bc; }
  renderCrumbs(false);
  demoPointer();
  setHover(computeHover());
  for (const K of conts) { K.hi = damp(K.hi, K.hiT || 0, 14, dt); HI.value[K.ci] = K.hi * 0.9; }
  const cr = updateContLabel();
  updateCallout(dt, now);
  const tr = updateTip();
  const reserved = [callout.rect, cr, tr].filter(Boolean);
  updateTopicLabels(dt, reserved);
  // Clouds.
  drawCover(now);
  if (!RM) orbit.rotation.y += dt * 0.025;
  drawOrbit(smoothstep(lessonAlt * 0.9, fitAlt * 0.8, rig.alt));
  updateMusic(now, dt);
  const t1 = performance.now();
  renderer.render(scene, camera);
  const t2 = performance.now();
  perf.n++; perf.upd += t1 - t0; perf.ren += t2 - t1; perf.max = Math.max(perf.max, t2 - t0);
}
let prevFrame = 0;
function frame() {
  const fnow = performance.now();
  if (prevFrame) { const d = fnow - prevFrame; perf.gaps.push(d); if (perf.gaps.length > 600) perf.gaps.shift(); }
  prevFrame = fnow;
  if (!paused) tick(fnow);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setInterval(() => { const now = performance.now(); if (!paused && !document.hidden && now - last > 120) tick(now); }, 16);

window.__planet = {
  graph, conts, LMS, rig, card, camera, renderer,
  get next() { return nextL && nextL.lesson.label; },
  get you() { return youL && youL.lesson.label; },
  get hover() { return hover && (hover.L ? hover.L.lesson.label : hover.K ? hover.K.dom.label : hover.kind); },
  get callout() { return { mode: callout.mode, x: callout.x, y: callout.y, w: callout.w, h: callout.h }; },
  get navOn() { return navOn; }, get frontCont() { return conts[frontCont].dom.label; },
  get fit() { return { fitAlt, lessonAlt, minAlt, maxAlt, ppr, limbPx, center }; },
  errors,
  nextScreen: () => nextL && [nextL.scr.x, nextL.scr.y],
  lessonScreen: (s) => { const L = findLesson(s); return L && [L.scr.x, L.scr.y, L.scr.vis]; },
  contScreen: (s) => { const K = findCont(s); const p = toScreen(K.c.clone().multiplyScalar(FZ).applyMatrix4(planet.matrixWorld), { x: 0, y: 0, z: 0 }); return [p.x, p.y]; },
  pause(v) { paused = v; last = performance.now(); },
  perf() {
    const g = perf.gaps.slice().sort((a, b) => a - b), q = (p) => +(g[Math.min(g.length - 1, Math.floor(p * g.length))] || 0).toFixed(1);
    const r = { frames: perf.n, updMs: +(perf.upd / Math.max(1, perf.n)).toFixed(2), renMs: +(perf.ren / Math.max(1, perf.n)).toFixed(2), maxMs: +perf.max.toFixed(1), frameGapP50: q(0.5), frameGapP95: q(0.95), calls: renderer.info.render.calls, tris: renderer.info.render.triangles };
    Object.assign(perf, { n: 0, upd: 0, ren: 0, max: 0, gaps: [] }); return r;
  },
};
</script>
