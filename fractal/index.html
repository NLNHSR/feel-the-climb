  /* Dolphin tokens (dolphin-web/src/styles/theme.css) mapped to graph roles. */
  :root {
    --bg: #CFEFFF;
    --ink: #0A234F;
    --muted: #536A86;
    --surface: #FFFFFC;
    --surface-soft: #F0F2F5;
    --border: #D9E4F2;
    --track: #D9E4F2;
    --node-fill: #FFFFFC;
    --node-shadow: #CBDFF0;
    --label: #0A234F;
    --edge: rgba(10, 35, 79, 0.2);
    --edge-strong: #2F9AE6;
    --locked-fill: #F0F2F5;
    --locked-ring: #C8D0DB;
    --locked-glyph: #B7C0CC;
    --cloud: #B7C0CC;
    --wave-1: #9EDFFF;
    --wave-2: #5FC6F7;
    --wave-3: #2F9AE6;
    --wave-shadow: #1E6FBE;
    --sun: #FFF44E;
    --sun-shadow: #E8BE00;
    --success: #3FA669;
    --card-shadow: #CBDFF0;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0A234F;
      --ink: #FFFFFC;
      --muted: #B7C0CC;
      --surface: #103B84;
      --surface-soft: #0A2B64;
      --border: #0A2B64;
      --track: #0A2B64;
      --node-fill: #103B84;
      --node-shadow: rgba(0, 0, 0, 0.35);
      --label: #FFFFFC;
      --edge: rgba(217, 228, 242, 0.22);
      --edge-strong: #5FC6F7;
      --locked-fill: #0A2B64;
      --locked-ring: #536D7A;
      --locked-glyph: #536D7A;
      --card-shadow: rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }

  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {

    font-family: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #blur { filter: blur(7px) saturate(0.85); pointer-events: none; }
  #crisp { touch-action: none; }

  .top { position: fixed; top: 18px; left: 20px; right: 20px; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; pointer-events: none; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: auto; }
  .crumb {
    font: 700 14px/1 "Manrope", system-ui, sans-serif; color: var(--ink);
    background: var(--surface); border: 2px solid var(--border); border-radius: 999px;
    padding: 8px 12px; cursor: pointer; box-shadow: 0 3px 0 var(--card-shadow);
    transition: transform 120ms ease, box-shadow 120ms ease, background 150ms ease;
  }
  .crumb:hover { transform: translateY(1px); box-shadow: 0 2px 0 var(--card-shadow); }
  .crumb[aria-current="true"] { background: var(--wave-3); border-color: var(--wave-shadow); color: #FFFFFC; box-shadow: 0 3px 0 var(--wave-shadow); }
  .crumb:focus-visible, .btn:focus-visible, .card-close:focus-visible { outline: 3px solid rgba(47, 154, 230, 0.4); outline-offset: 2px; }
  .crumb-sep { color: var(--muted); font-weight: 700; }
  .hint {
    font-size: 13px; font-weight: 600; color: var(--muted); max-width: 300px; text-align: right; line-height: 1.4;
    background: color-mix(in srgb, var(--surface) 70%, transparent); border-radius: 14px; padding: 8px 12px;
    transition: opacity 400ms ease;
  }
  .hint b { color: var(--ink); }

  .legend {
    position: fixed; left: 20px; bottom: 18px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    font-size: 12.5px; font-weight: 700; color: var(--muted);
    background: color-mix(in srgb, var(--surface) 70%, transparent); border-radius: 14px; padding: 8px 12px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .dot.mastered { background: var(--success); }
  .dot.ready { background: var(--sun); box-shadow: 0 0 0 2px var(--sun-shadow) inset; }
  .dot.locked { background: var(--locked-fill); box-shadow: 0 0 0 2px var(--locked-ring) inset; }
  .dot.ring { background: conic-gradient(var(--wave-3) 0 68%, var(--track) 68% 100%); }

  .tip {
    position: fixed; pointer-events: none; z-index: 5; max-width: 240px;
    background: var(--surface); color: var(--ink); border: 2px solid var(--border); border-radius: 14px;
    padding: 8px 11px; font-size: 13px; font-weight: 600; line-height: 1.35;
    box-shadow: 0 3px 0 var(--card-shadow); opacity: 0; transform: translateY(4px); transition: opacity 120ms ease, transform 120ms ease;
  }
  .tip.show { opacity: 1; transform: none; }
  .tip b { display: block; font-weight: 800; margin-bottom: 2px; }
  .tip small { color: var(--muted); font-weight: 700; }

  .card {
    position: fixed; right: 20px; bottom: 18px; width: min(360px, calc(100vw - 40px)); z-index: 6;
    background: var(--surface); color: var(--ink); border: 2px solid var(--border); border-radius: 22px;
    box-shadow: 0 4px 0 var(--card-shadow); padding: 18px 18px 16px;
    transform: translateY(16px) scale(0.98); opacity: 0; pointer-events: none;
    transition: opacity 180ms ease, transform 220ms cubic-bezier(.2,.9,.3,1.2);
  }
  .card.open { opacity: 1; transform: none; pointer-events: auto; }
  .card-close {
    position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%;
    border: 0; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer;
  }
  .card-close:hover { background: rgba(47, 154, 230, 0.12); }
  .kicker { font-size: 12px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); padding-right: 30px; }
  .card h2 { font-family: "VAG Rundschrift D", "Manrope", system-ui, sans-serif; font-weight: normal; font-size: 24px; line-height: 1.15; margin: 6px 0 10px; }
  .meta { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .pill { border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 800; }
  .pill.mastered { background: var(--success); color: #FFFFFC; }
  .pill.frontier { background: var(--sun); color: #0A234F; box-shadow: 0 0 0 2px var(--sun-shadow) inset; }
  .pill.locked { background: var(--locked-fill); color: var(--muted); box-shadow: 0 0 0 2px var(--locked-ring) inset; }
  .bar { height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; margin: 12px 0 10px; }
  .bar span { display: block; height: 100%; width: 0; background: var(--wave-3); border-radius: inherit; transition: width 500ms ease, background 300ms ease; }
  .note { margin: 0 0 14px; font-size: 14px; line-height: 1.45; color: var(--muted); font-weight: 600; }
  .actions { display: flex; gap: 10px; }
  .btn {
    flex: 1; height: 48px; border-radius: 18px; border: 2px solid; cursor: pointer;
    font: 700 16px/1 "Manrope", system-ui, sans-serif;
    transition: transform 120ms ease, box-shadow 120ms ease, background 150ms ease;
  }
  .btn.primary { background: var(--wave-3); border-color: var(--wave-shadow); color: #FFFFFC; box-shadow: 0 3px 0 var(--wave-shadow); }
  .btn.primary:hover { background: #238BD5; }
  .btn.secondary { background: var(--surface); border-color: var(--border); color: var(--ink); box-shadow: 0 3px 0 var(--card-shadow); }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
  .btn:disabled { background: var(--surface-soft); border-color: var(--locked-ring); color: var(--cloud); box-shadow: none; cursor: not-allowed; }

  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; z-index: 7;
    background: var(--success); color: #FFFFFC; border-radius: 999px; padding: 10px 16px; font-weight: 800; font-size: 14px;
    box-shadow: 0 3px 0 color-mix(in srgb, var(--success) 70%, #000); transition: opacity 200ms ease, transform 240ms ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 640px) {
    .hint { display: none; }
    .legend { left: 12px; right: 12px; bottom: 12px; justify-content: center; }
    .card { right: 12px; left: 12px; bottom: 12px; width: auto; }
    .top { left: 12px; right: 12px; top: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .tip, .toast, .crumb, .bar span { transition: none; }
  }
</style>
</head>
<body>
<canvas id="blur" aria-hidden="true"></canvas>
<canvas id="crisp" role="img" aria-label="Knowledge graph of SAT mastery. Move the pointer toward a circle to zoom into it."></canvas>

<div class="top">
  <nav class="crumbs" id="crumbs" aria-label="Graph path"></nav>
  <div class="hint" id="hint">Glide toward a circle to <b>zoom in</b>. Drift back to its parent to <b>zoom out</b>. Click a glowing lesson to start it.</div>
</div>

<div class="legend" aria-label="Legend">
  <span><i class="dot ring"></i>Ring = mastery</span>
  <span><i class="dot mastered"></i>Mastered</span>
  <span><i class="dot ready"></i>Ready (frontier)</span>
  <span><i class="dot locked"></i>Locked</span>
</div>

<div class="tip" id="tip"></div>

<section class="card" id="card" aria-live="polite">
  <button class="card-close" id="cardClose" aria-label="Close">×</button>
  <div class="kicker" id="cardKicker"></div>
  <h2 id="cardTitle"></h2>
  <div class="meta"><span class="pill" id="cardPill"></span><span id="cardPct"></span></div>
  <div class="bar"><span id="cardBar"></span></div>
  <p class="note" id="cardNote"></p>
  <div class="actions" id="cardActions"></div>
</section>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  // ───────────────────────── Data ─────────────────────────
  // [label, children] — a string child is a lesson (leaf). Any depth works.
  const SPEC = ['SAT', [
    ['Algebra', [
      ['Linear equations', ['One-step equations', 'Multi-step equations', 'Variables on both sides', 'Equations with fractions']],
      ['Linear functions', [
        ['Slope', ['Slope from a graph', 'Slope from two points', 'Rate of change']],
        ['Slope-intercept form', ['Write y = mx + b', 'Graph from an equation', 'Interpret m and b']],
        ['Function notation', ['Evaluate f(x)', 'Solve f(x) = k', 'Functions in context']],
      ]],
      ['Systems of equations', ['Substitution', 'Elimination', 'Number of solutions', 'Systems word problems']],
      ['Linear inequalities', ['One-variable inequalities', 'Graph inequalities', 'Systems of inequalities']],
      ['Two-variable equations', ['Standard form', 'Parallel & perpendicular', 'Lines in context']],
    ]],
    ['Advanced Math', [
      ['Quadratics', [
        ['Factoring', ['GCF factoring', 'Trinomials (a = 1)', 'Trinomials (a ≠ 1)', 'Difference of squares']],
        ['Quadratic formula', ['Apply the formula', 'The discriminant', 'Formula in context']],
        ['Vertex form', ['Complete the square', 'Read the vertex', 'Max & min in context']],
      ]],
      ['Exponential functions', ['Growth & decay', 'Compound interest', 'Exponent rules', 'Exponential vs linear']],
      ['Polynomials', ['Add & multiply', 'Polynomial division', 'Zeros & factors']],
      ['Radicals & exponents', ['Simplify radicals', 'Rational exponents', 'Radical equations']],
      ['Nonlinear systems', ['Line meets parabola', 'Solve graphically']],
    ]],
    ['Problem Solving & Data', [
      ['Ratios & rates', ['Unit rates', 'Proportions', 'Unit conversion']],
      ['Percentages', ['Percent of a whole', 'Percent change', 'Successive percents']],
      ['Statistics', ['Mean, median & mode', 'Standard deviation', 'Box plots & histograms']],
      ['Probability', ['Simple probability', 'Two-way tables', 'Conditional probability']],
      ['Data models', ['Scatterplots', 'Line of best fit', 'Margin of error']],
    ]],
    ['Geometry & Trig', [
      ['Lines & angles', ['Vertical angles', 'Parallel lines & transversals', 'Triangle angle sum']],
      ['Triangles', ['Similar triangles', 'Pythagorean theorem', 'Special right triangles']],
      ['Circles', ['Arc length', 'Sector area', 'Circle equations', 'Inscribed angles']],
      ['Area & volume', ['Polygon area', 'Prisms & cylinders', 'Cones & spheres']],
      ['Trigonometry', ['SOH-CAH-TOA', 'Complementary angles', 'Radians']],
    ]],
    ['Reading & Writing', [
      ['Information & ideas', ['Central ideas', 'Textual evidence', 'Quantitative evidence', 'Inferences']],
      ['Craft & structure', ['Words in context', 'Text structure & purpose', 'Cross-text connections']],
      ['Expression of ideas', ['Transitions', 'Rhetorical synthesis']],
      ['Conventions', ['Subject-verb agreement', 'Punctuation boundaries', 'Verb tense', 'Pronoun clarity']],
    ]],
  ]];
  // How far along the mock learner is in each domain (drives the seeded mastery).
  const BIAS = { 'Algebra': 0.8, 'Advanced Math': 0.55, 'Problem Solving & Data': 0.65, 'Geometry & Trig': 0.35, 'Reading & Writing': 0.6 };

  // ───────────────────────── Tunables ─────────────────────────
  const TAU = Math.PI * 2, DEG = Math.PI / 180;
  const CHILD_SCALE = 0.45;    // child radius / parent radius (the fractal ratio)
  const CHILD_DIST = 2.65;     // child distance / parent radius
  const FAN_MAX = 150 * DEG;   // non-root children fan outward, away from their parent
  const FAN_STEP = 40 * DEG;
  const DWELL = { in: 60, out: 110, side: 200 }; // ms the pointer must stay before a zoom commits
  const SETTLE_MS = 240;       // no commits while the camera is still flying
  const LEAN = { in: 0.5, out: 0.3, side: 0.3 }; // share of the zoom that happens *while approaching*
  const UNLOCK_AT = 0.5;       // a topic unlocks once its previous sibling is 50% mastered
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CAM_FREQ = reduceMotion ? 40 : 13; // camera spring stiffness (~0.3s to settle)

  // ───────────────────────── Build tree ─────────────────────────
  function mulberry32(a) {
    return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const rand = mulberry32(20261121);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (t) => t * t * (3 - 2 * t);

  const nodes = [];
  function build(spec, parent, depth) {
    const leaf = typeof spec === 'string';
    const n = {
      id: nodes.length, label: leaf ? spec : spec[0], parent, depth, children: [],
      index: parent ? parent.children.length : 0, leafCount: 0,
      mastered: false, progress: 0, state: 'locked', unlocked: false, m: 0, dm: 0, frontier: 0, masteredCount: 0,
      x: 0, y: 0, r: 0, angle: 0,
      vis: 0, sharp: 1, tVis: 0, tSharp: 0, prox: 0, tProx: 0, hl: 0, fT: 0, flash: 0,
    };
    nodes.push(n);
    if (parent) parent.children.push(n);
    if (!leaf) for (const c of spec[1]) build(c, n, depth + 1);
    n.leafCount = n.children.length ? n.children.reduce((a, c) => a + c.leafCount, 0) : 1;
    return n;
  }
  const root = build(SPEC, null, 0);
  const isLeafGroup = (n) => n.children.length > 0 && n.children.every((c) => !c.children.length);
  const leavesOf = (n) => (n.children.length ? n.children.flatMap(leavesOf) : [n]);
  const rawMastery = (n) => leavesOf(n).reduce((a, l) => a + (l.mastered ? 1 : l.progress), 0) / n.leafCount;
  // Mock prerequisite rule: a domain's first two topics are always open; later topics and
  // every subtopic chain open once the previous sibling reaches UNLOCK_AT mastery.
  const opens = (c, prevM) => c.depth < 2 || c.index === 0 || (c.depth === 2 && c.index < 2) || prevM >= UNLOCK_AT;

  // Seed a believable learner: each lesson ladder has k mastered rungs, then a frontier rung.
  function seed(n, unlocked, bias) {
    if (!n.children.length) return;
    if (isLeafGroup(n)) {
      if (!unlocked) return;
      const k = clamp(Math.round(n.children.length * (bias + (rand() - 0.5) * 0.55)), 0, n.children.length);
      n.children.forEach((c, i) => {
        c.mastered = i < k;
        if (i === k) c.progress = rand() < 0.45 ? 0 : 0.15 + rand() * 0.45;
      });
      return;
    }
    let prev = null;
    for (const c of n.children) {
      const b = n.depth === 0 ? BIAS[c.label] : bias;
      seed(c, unlocked && opens(c, prev ? rawMastery(prev) : 0), b);
      prev = c;
    }
  }
  seed(root, true, 0.5);

  // Derive states: mastered → frontier (first unmastered rung of an unlocked ladder) → locked.
  function recompute(n = root, unlocked = true) {
    n.unlocked = unlocked;
    if (!n.children.length) return;
    if (isLeafGroup(n)) {
      let frontierTaken = false;
      for (const c of n.children) {
        c.unlocked = unlocked;
        if (c.mastered) { c.state = 'mastered'; c.m = 1; c.frontier = 0; c.masteredCount = 1; }
        else if (unlocked && !frontierTaken) { c.state = 'frontier'; c.m = c.progress; c.frontier = 1; c.masteredCount = 0; frontierTaken = true; }
        else { c.state = 'locked'; c.m = 0; c.frontier = 0; c.masteredCount = 0; }
      }
    } else {
      let prev = null;
      for (const c of n.children) { recompute(c, unlocked && opens(c, prev ? prev.m : 0)); prev = c; }
    }
    let sum = 0, fr = 0, mc = 0;
    for (const c of n.children) { sum += c.m * c.leafCount; fr += c.frontier; mc += c.masteredCount; }
    n.m = sum / n.leafCount; n.frontier = fr; n.masteredCount = mc;
  }
  recompute();
  for (const n of nodes) n.dm = n.m;

  // ───────────────────────── Fractal layout ─────────────────────────
  function layout(n, x, y, r, angle) {
    n.x = x; n.y = y; n.r = r; n.angle = angle;
    const k = n.children.length;
    if (!k) return;
    const d = r * CHILD_DIST, cr = r * CHILD_SCALE;
    const spread = Math.min(FAN_MAX, (k - 1) * FAN_STEP);
    n.children.forEach((c, i) => {
      const a = !n.parent ? -Math.PI / 2 + (i * TAU) / k : k === 1 ? angle : angle - spread / 2 + (spread * i) / (k - 1);
      layout(c, x + Math.cos(a) * d, y + Math.sin(a) * d, cr, a);
    });
  }
  layout(root, 0, 0, 100, -Math.PI / 2);
  const drawOrder = [...nodes].sort((a, b) => a.depth - b.depth);

  // ───────────────────────── Theme ─────────────────────────
  const T = {};
  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    for (const k of ['bg', 'ink', 'muted', 'track', 'node-fill', 'node-shadow', 'label', 'edge', 'edge-strong', 'locked-fill', 'locked-ring', 'locked-glyph', 'cloud', 'wave-1', 'wave-2', 'wave-3', 'wave-shadow', 'sun', 'sun-shadow', 'success']) {
      T[k.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = cs.getPropertyValue('--' + k).trim();
    }
    T.successShadow = mix(T.success, '#000000', 0.22);
  }
  function hex(c) { const v = parseInt(c.slice(1), 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; }
  function mix(a, b, t) {
    const A = hex(a), B = hex(b);
    return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }
  readTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);
  const arcColor = (m) => (m >= 0.85 ? T.success : mix(T.wave2, T.wave3, clamp(m / 0.85, 0, 1)));
  const fillColor = (m) => (m >= 0.85 ? mix(T.nodeFill, T.success, 0.2) : mix(T.nodeFill, T.wave1, m * 0.55));
  const pct = (m) => Math.round(m * 100) + '%';

  // ───────────────────────── Canvas + camera ─────────────────────────
  const crisp = document.getElementById('crisp'), blurCv = document.getElementById('blur');
  const cx = crisp.getContext('2d'), bx = blurCv.getContext('2d');
  const BLUR_RES = 0.5; // the blurred layer renders at half resolution — it's blurred anyway
  let W = 0, H = 0, DPR = 1, VP = { x: 0, y: 0, w: 1, h: 1 };
  function resize() {
    W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2);
    crisp.width = Math.round(W * DPR); crisp.height = Math.round(H * DPR);
    blurCv.width = Math.round(W * BLUR_RES); blurCv.height = Math.round(H * BLUR_RES);
  }
  addEventListener('resize', resize);
  resize();

  function viewport() {
    const narrow = W < 640;
    const padX = narrow ? 12 : clamp(W * 0.03, 24, 60);
    const padTop = narrow ? 70 : 74, padBot = narrow ? 70 : 64;
    // An open lesson card claims the right edge on wide screens; the graph reframes beside it.
    const padRight = card.node && W >= 900 ? 400 : padX;
    return { x: padX, y: padTop, w: Math.max(50, W - padX - padRight), h: Math.max(50, H - padTop - padBot) };
  }

  // Frame = focus + its children (with their labels) + a sliver of the parent, so
  // "back" is always on screen. Labels are sized in px, so fit twice to converge on z.
  function frameFor(F) {
    const fit = (labelZ) => {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      const add = (x, y, r) => { x0 = Math.min(x0, x - r); y0 = Math.min(y0, y - r); x1 = Math.max(x1, x + r); y1 = Math.max(y1, y + r); };
      add(F.x, F.y, F.r);
      for (const c of F.children) {
        add(c.x, c.y, c.r * 1.15);
        if (labelZ) {
          const [a, b, e, f] = labelLayout(cx, c, c.r * labelZ).box;
          add(c.x + a / labelZ, c.y + b / labelZ, 0); add(c.x + e / labelZ, c.y + f / labelZ, 0);
        }
      }
      if (F.parent) {
        const P = F.parent, dx = P.x - F.x, dy = P.y - F.y, d = Math.hypot(dx, dy), t = d - P.r + F.r * 0.8;
        add(F.x + (dx / d) * t, F.y + (dy / d) * t, 0);
      } else {
        // Full view: fit the whole visible fractal, including the faint preview rings.
        for (const n of nodes) if (n.depth >= 2 && n.depth <= 3) add(n.x, n.y, n.r * 1.1);
      }
      const z = Math.min(VP.w / Math.max(x1 - x0, 1e-6), VP.h / Math.max(y1 - y0, 1e-6));
      return { x: (x0 + x1) / 2, y: (y0 + y1) / 2, z };
    };
    let f = fit(0);
    f = fit(f.z);
    return fit(f.z);
  }
  const blend = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, z: a.z * Math.pow(b.z / a.z, t) });

  const cam = { x: 0, y: 0, z: 1 };
  const camV = { x: 0, y: 0, z: 0 }; // camera velocity (z is in log space)
  const toScreen = (n) => ({ x: VP.x + VP.w / 2 + (n.x - cam.x) * cam.z, y: VP.y + VP.h / 2 + (n.y - cam.y) * cam.z, r: n.r * cam.z });

  // ───────────────────────── Pointer-driven navigation ─────────────────────────
  let focus = root;
  let leanNode = null, leanType = null, hoverLeaf = null;
  let pending = null, lockUntil = 0, clock = performance.now(); // clock = last frame's timestamp
  // `travel` = px moved since the last zoom settled; `lastMoveAt` = last real pointer motion.
  const pointer = { x: 0, y: 0, in: false, lastMoveAt: 0, travel: 0 };

  function setFocus(n) {
    if (!n || !n.children.length || n === focus) return;
    focus = n;
    lockUntil = clock + (reduceMotion ? 120 : SETTLE_MS);
    pointer.travel = 0; pending = null;
    renderCrumbs();
    if (card.node && card.node.parent !== focus) closeCard();
    if (n !== root) document.getElementById('hint').style.opacity = '0.55';
  }

  // Pick the one thing the pointer is "about": inside a circle wins, else the nearest by proximity.
  function evalPointer() {
    if (!pointer.in) return null;
    const F = focus, fs = toScreen(F);
    let best = null;
    const test = (node, type) => {
      const s = toScreen(node);
      const dist = Math.hypot(pointer.x - s.x, pointer.y - s.y), gap = dist - s.r;
      // Parent/sibling only pull when the pointer is right at them, so they never tug the
      // camera backwards while the hand is heading toward one of the focus's children.
      let influence = 70, capture = 0;
      if (type === 'in' || type === 'leaf') {
        influence = Math.max(60, Math.hypot(s.x - fs.x, s.y - fs.y) * 0.7);
        capture = Math.max(16, s.r * 0.4); // commit just before the edge, not deep inside
      }
      const inside = gap <= capture;
      if (type === 'self' && !inside) return;
      if ((type === 'out' || type === 'side') && !inside && towardChild) return;

  function handlePointer(now) {

  // ───────────────────────── Visibility targets ─────────────────────────

  }

  function animate(dt) {

  // ───────────────────────── Drawing ─────────────────────────
  const HEAD = '"VAG Rundschrift D", "Manrope", system-ui, sans-serif';

  function drawEdge(ctx, p, c, alpha) {

  // Labels sit radially outside the node, in the direction it branches from its parent.

  function labelLayout(ctx, n, r) {

    ctx.font = `${leaf ? 700 : 800} ${size}px ${BODY}`;

  function drawNode(ctx, n, alpha, now) {

  function drawBackPill() {

  // ───────────────────────── HUD: crumbs, tooltip, lesson card, toast ─────────────────────────
  const crumbsEl = document.getElementById('crumbs');

  function blockerText(n) {

  function statusText(n) {

  const tip = document.getElementById('tip');

    $('cardTitle').textContent = n.label;
    const pill = $('cardPill');
    pill.className = 'pill ' + n.state;
    pill.textContent = n.state === 'mastered' ? 'Mastered' : n.state === 'frontier' ? (n.progress > 0 ? 'In progress' : 'Ready') : 'Locked';
    const m = n.state === 'mastered' ? 1 : n.state === 'frontier' ? n.progress : 0;
    $('cardPct').textContent = pct(m) + ' mastery';
    $('cardBar').style.width = pct(m);
    $('cardBar').style.background = m >= 0.85 ? 'var(--success)' : 'var(--wave-3)';
    const actions = $('cardActions');
    actions.replaceChildren();
    const btn = (label, kind, fn, disabled) => { const b = document.createElement('button'); b.className = 'btn ' + kind; b.textContent = label; b.disabled = !!disabled; if (fn) b.addEventListener('click', fn); actions.append(b); return b; };
    if (n.state === 'frontier') {
      $('cardNote').textContent = 'This lesson is on your frontier — everything it builds on is already mastered.';
      const b = btn(n.progress > 0 ? 'Continue lesson' : 'Start lesson', 'primary', () => {

  // ───────────────────────── Input ─────────────────────────

  crisp.addEventListener('pointerup', (e) => {
    const n = nodeAt(e.clientX, e.clientY);
    if (!n) { if (e.pointerType === 'touch' && focus.parent) setFocus(focus.parent); return; }
    if (!n.children.length) openCard(n);
    else if (n !== focus) setFocus(n);
  });
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (card.node) closeCard(); else setFocus(root); }
    if (e.key === 'Backspace' && focus.parent && !card.node) setFocus(focus.parent);
  });

  // ───────────────────────── Loop ─────────────────────────
  VP = viewport();
  const start = frameFor(root);
  cam.x = start.x; cam.y = start.y; cam.z = start.z * (reduceMotion ? 1 : 0.72);
  renderCrumbs();
  let last = performance.now(), paused = false;
  function tick(now) {
    const dt = Math.min(0.1, Math.max(0, now - last) / 1000);
    last = clock = now;
    VP = viewport();
    handlePointer(now);
    computeTargets();
    animate(dt);
    draw(now);
  }
  function frame(now) {
    if (!paused) tick(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  // QA hook: lets a script pause the rAF loop and step frames on its own clock.
  window.__graph = {
    root, nodes, cam, get focus() { return focus; }, setFocus, toScreen, tick, movePointer,
    pause(v) { paused = v; last = performance.now(); },
  };
})();
</script>
</body>
