<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Shifting Stairs</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="../shared/dolphin.css" />
<style>
  html, body { overflow: hidden; background: #0A2759; }
  #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }

  /* Type: 16 display, 13 small. Spacing: multiples of 8. */
  .hud { position: fixed; top: 24px; left: 24px; z-index: 20; pointer-events: none; color: var(--foam); }
  .hud .l1 { font: 16px/24px var(--font-head); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hud .l2 { font: 700 13px/16px var(--font-body); color: var(--cloud); font-variant-numeric: tabular-nums; }

  .tip {
    position: fixed; left: 0; top: 0; z-index: 25; pointer-events: none; max-width: 256px;
    background: var(--foam); color: var(--ink); border: 2px solid var(--mist); border-radius: 16px;
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.22); padding: 8px 16px 12px;
    opacity: 0; transition: opacity 100ms ease-out;
  }
  .tip.show { opacity: 1; }
  .tip .dom { display: flex; align-items: center; gap: 8px; font: 700 13px/16px var(--font-body); color: var(--muted); }
  .tip .dom i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tip .t { font-family: var(--font-head); font-size: 16px; line-height: 20px; margin: 4px 0; }
  .tip .m { font: 700 13px/16px var(--font-body); color: var(--muted); }

  .hint { position: fixed; left: 50%; bottom: 80px; transform: translate(-50%, 8px); z-index: 30; pointer-events: none; white-space: nowrap; text-shadow: 0 1px 2px rgba(3, 12, 32, 0.8);
    font: 700 13px/16px var(--font-body); color: var(--foam); opacity: 0; transition: opacity 400ms ease-out, transform 400ms cubic-bezier(.2,.8,.2,1); }
  .hint.show { opacity: 0.85; transform: translate(-50%, 0); }

  @media (max-width: 640px) {
    .hud { top: 16px; left: 16px; }
    .tip { max-width: 224px; }
    .hint { bottom: auto; top: 72px; left: 16px; transform: translate(0, -8px); }
    .hint.show { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .tip, .hint { transition: none; } }
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="A tall stone tower of moving staircases. Each landing is an SAT topic and each step is a lesson. Your glowing marker stands on your landing; the stairs below are the route you climbed. Point at a landing above you to swing its staircase over, then click the glowing step."></canvas>

<header class="hud" aria-live="polite">
  <div class="l1" id="hudL1">Ground floor</div>
  <div class="l2" id="hudL2"></div>
</header>
<div class="tip" id="tip" role="tooltip"></div>
<div class="hint" id="hint" aria-live="polite"></div>

<script type="module">
// ─── Sound design (for sourcing audio; every event fires on the matching visual, never at random) ───
// Music: a hushed night inside a stone tower that slowly wakes up. Ground floor: low cello drone and a soft
//   heartbeat. Climbing: muted plucked strings and a steady pulse. Near the sunlit top: warm horns, timpani and
//   a broad string line. D minor, ~70 bpm at the bottom to ~118 at the top; score.setIntensity follows how high
//   the camera is looking, with short lifts when a staircase swings or a lesson is mastered.
// hover   : pointer reaches a step or a landing. A dry pebble tap on stone. Very short, no tail.
// select  : a landing is clicked/tapped (or the card opens). Firm stone clack with a faint bell overtone.
// back    : lesson card closed, or Esc back to your landing. The same clack, lower and softer.
// zoomIn  : the camera starts looking up the shaft. Rising tower draught, airy and close.
// zoomOut : the camera starts looking down your route. Falling draught, a little hollow and wide.
// start   : lesson begins (card). Rope tightening into a short drum roll: commitment, not celebration.
// complete: lesson mastered, its step turns solid. Deep stone thud with a bright bell on top.
// unlock  : a staircase becomes reachable (its frontier step lights, or a new floor's stairs arrive).
//           Rising shimmer of plucked strings with a soft chime. Hopeful.
// intro   : arrival on your landing at the end of the intro rise. Big hit: low boom, cymbal swell, horn chord.
// riser   : ~2.2 s build into that hit. Strings and air swelling upward with the camera.
// step    : two uses, same family. (1) A staircase starts to swing: short heavy stone grind that ends in a
//           soft clunk as it locks. (2) The marker's footstep landing on a step: light, solid, slightly varied.
//
// Shifting Stairs: a tower atrium. Each landing is a topic, each staircase is that topic's lesson ladder
// (one step per lesson, in rung order). Your route of finished topics climbs from the ground floor to your
// landing. Above you, one landing per domain holds that domain's next ladder; point at one and its staircase
// swings down to you. Finish a ladder and you walk up onto its landing: a new floor, and the stairs rearrange.
// QA params: ?skipgate=1  &t=<sec> (jump into the intro; 99 = settled)  &demo=hover|swing|complete|floor|top|route
//            &px=<0-1>&py=<0-1> (park a virtual pointer)  &aim=<domain index>  &notrans=1  &debug=1
import { createGraph, DOMAIN_HUES, clamp } from '../shared/graph.js';
import { mountChrome, params } from '../shared/chrome.js';
import { createLessonCard } from '../shared/lesson-card.js';

// ═══════════════════════ Utilities ═══════════════════════
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const easeInOut = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const hex = (h) => { h = h.trim(); return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; };
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let clockOffset = 0;
const clock = () => performance.now() + clockOffset;
if (params.has('notrans')) {
  const st = document.createElement('style'); st.textContent = '*, *::before, *::after { transition: none !important; animation: none !important; }'; document.head.append(st);
}

const css = getComputedStyle(document.documentElement);
const tok = (n) => hex(css.getPropertyValue('--' + n) || '#000000');
const C = {
  ink: tok('ink'), muted: tok('muted'), foam: tok('foam'), paper: tok('paper'), mist: tok('mist'), cloud: tok('cloud'),
  w1: tok('wave-1'), w2: tok('wave-2'), w3: tok('wave-3'), wShadow: tok('wave-shadow'),
  night: tok('night'), nightDeep: tok('night-deep'), nightInk: tok('night-ink'), sun: tok('sun'), sunShadow: tok('sun-shadow'),
};
const HUE = Object.fromEntries(Object.entries(DOMAIN_HUES).map(([k, v]) => [k, hex(v)]));
const BODY = '"Manrope", system-ui, sans-serif';

// Stone palette. Lit = reached/connected, dark = swung away or not reached yet. Sun = the one thing to click.
const WALL = mixc(C.nightDeep, C.nightInk, 0.45);
const darkStone = (k) => mixc(WALL, C.mist, k);
const PAL = {
  lit: { top: mixc(C.foam, C.sun, 0.06), front: mixc(C.mist, C.night, 0.13), edge: mixc(C.mist, C.night, 0.46) },
  sun: { top: C.sun, front: mixc(C.mist, C.night, 0.13), edge: mixc(C.mist, C.night, 0.46), band: mixc(C.sun, C.sunShadow, 0.5) },
  ghost: { top: darkStone(0.3), front: darkStone(0.17), edge: darkStone(0.08) },
  darkM: { top: darkStone(0.2), front: darkStone(0.12), edge: darkStone(0.05) },
  darkL: { top: darkStone(0.14), front: darkStone(0.08), edge: darkStone(0.03) },
  target: { top: darkStone(0.56), front: darkStone(0.34), edge: darkStone(0.18) },
  upperL: { top: darkStone(0.1), front: darkStone(0.05), edge: darkStone(0.03) },
};

// ═══════════════════════ Data ═══════════════════════
const graph = createGraph();
const isLeafGroup = (n) => n.children.length > 0 && n.children.every((c) => !c.children.length);
const ladders = graph.nodes.filter(isLeafGroup);                     // DFS order = scaffold order
const chains = new Map(graph.domains.map((d) => [d, ladders.filter((g) => g.domain === d)]));
const isDone = (g) => g.children.every((c) => c.state === 'mastered');
const hasFrontier = (g) => g.children.some((c) => c.state === 'frontier');
const doneAt = (g) => Math.max(...g.children.map((c) => (c.masteredAt ? +c.masteredAt : 0)));
const frontierOf = (g) => g.children.find((c) => c.state === 'frontier') || null;
const masteredIn = (g) => g.children.filter((c) => c.state === 'mastered').length;
const N = graph.leaves.length;
let stats = graph.stats();
let route = ladders.filter(isDone).sort((a, b) => doneAt(a) - doneAt(b)); // finished topics, in the order you reached them
const keyOf = (g) => (g ? 'g' + g.id : 'ground');
const shortDate = (d) => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

// ═══════════════════════ Chrome + card ═══════════════════════
const { score, caption } = mountChrome({
  id: 'shifting-stairs',
  eyebrow: 'Your SAT knowledge graph',
  title: 'Shifting Stairs',
  tagline: `A tower of moving staircases. ${route.length} floors climbed, ${stats.mastered} steps under your feet. Choose your way up.`,
  gateBackground: 'linear-gradient(180deg, rgba(10,35,79,0.62) 0%, rgba(10,35,79,0.9) 100%)',
  dark: true,
  beginLabel: 'Enter the tower',
  onBegin: () => startIntro(),
});
let cardOpen = false, closedAt = 0, cardLesson = null, dodge = 0, dodgePending = false;
const card = createLessonCard(graph, {
  score,
  caption: () => {}, // the tower says it; celebrate() adds one specific line instead
  onComplete: (evt) => celebrate(evt),
  onOpen: (n) => { cardOpen = true; cardLesson = n; dodgePending = true; hideTip(); hideHint(); },
  onClose: () => { cardOpen = false; cardLesson = null; dodge = 0; closedAt = clock(); score.sfx('back'); },
});

// ═══════════════════════ Canvas + world ═══════════════════════
// World: x right, y up. A slight look-down (TILT) shows the tops of slabs and treads.
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1, K = 1, OX = 0, OY = 0, portrait = false, phone = false, HOME = 0.66;
let LW = 132, UW = 104, LT = 24;
const LD = 74, SD = 46, TILT = 0.34, ARC = 380, ROUTE_L = 330, ROUTE_A = 46 * DEG;
const cam = { x: 0, y: 0, vx: 0, vy: 0 };
const SX = (x) => OX + (x - cam.x) * K;
const SY = (y) => OY - (y - cam.y) * K;

// Branch slots: [side, angle°] from your landing's tip; landscape fans wide, portrait stacks taller.
const SLOTS_L = { // [side, angle°, reach]
  1: [[1, 44, 1]], 2: [[-1, 42, 1], [1, 42, 1]], 3: [[-1, 40, 1], [1, 56, 0.95], [1, 28, 1.15]],
  4: [[-1, 28, 1.15], [-1, 54, 0.98], [1, 54, 0.98], [1, 28, 1.15]],
  5: [[-1, 28, 1.15], [-1, 52, 0.98], [1, 66, 1], [1, 40, 1], [1, 18, 1.2]],
};
// Portrait: explicit tip offsets [side, dx, dy] in world units.
const SLOTS_P = {
  1: [[1, 150, 260]], 2: [[-1, 150, 250], [1, 150, 250]], 3: [[-1, 160, 220], [1, 110, 420], [1, 200, 150]],
  4: [[-1, 225, 160], [-1, 140, 380], [1, 140, 380], [1, 225, 160]],
  5: [[-1, 225, 150], [-1, 150, 340], [1, 115, 520], [1, 180, 310], [1, 235, 115]],
};
function slotOffsets(m) {
  if (portrait) return (SLOTS_P[m] || SLOTS_P[5]).map(([s, dx, dy]) => [s, dx, dy]);
  return (SLOTS_L[m] || SLOTS_L[5]).map(([s, a, r]) => [s, ARC * r * Math.cos(a * DEG), ARC * r * Math.sin(a * DEG)]);
}

// ═══════════════════════ Landings + stairs ═══════════════════════
const landings = new Map(); // key → { key, g, x, y, vx, vy, tx, ty, w, role, lit, flash }
const stairs = new Map();   // ladder id → { g, upKey, loKey, role: route|branch, th (yaw), thv, thT, steps[], dockedAt }
let youKey = 'ground', branches = [], aimed = null, latched = null, topY = 2000, fanCx = 0;
const PARK = 128 * DEG; // swung away: turned back and outward, folded under its own landing

function landing(key, g) {
  let L = landings.get(key);
  if (!L) { L = { key, g, x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0, w: LW, tw: LW, role: 'upper', lit: 0, flash: 0, placed: false }; landings.set(key, L); }
  return L;
}
function stairFor(g) {
  let st = stairs.get(g.id);
  if (!st) {
    st = { g, upKey: keyOf(g), loKey: null, role: 'branch', th: PARK, thv: 0, thT: PARK, dockedAt: -1e9,
      steps: g.children.map(() => ({ lit: 0, flash: 0 })) };
    stairs.set(g.id, st);
  }
  return st;
}
const youL = () => landings.get(youKey);

// Your route: finished topics zig-zag down to the ground floor.
function placeRoute() {
  const n = route.length;
  let x = 0, y = 0, s = -1;
  const pts = [];
  for (let k = n; k >= 0; k--) { pts[k] = { x, y }; x += s * (LW + ROUTE_L * Math.cos(ROUTE_A)); y -= ROUTE_L * Math.sin(ROUTE_A); s = -s; }
  const base = pts[0].y;
  pts.forEach((p, k) => {
    const L = landing(k ? keyOf(route[k - 1]) : 'ground', k ? route[k - 1] : null);
    L.tx = L.x = p.x; L.ty = L.y = p.y - base; L.placed = true;
  });
}

function layout(snap = false) {
  for (const L of landings.values()) L.role = 'none';
  const ground = landing('ground', null); ground.role = 'ground'; ground.tw = LW;
  route.forEach((g, i) => { const L = landing(keyOf(g), g); L.role = 'route'; L.tw = LW; const st = stairFor(g); st.role = 'route'; st.loKey = i ? keyOf(route[i - 1]) : 'ground'; });
  youKey = route.length ? keyOf(route[route.length - 1]) : 'ground';
  const you = youL(); if (you.role === 'route') you.role = 'you';
  const paths = graph.domains.map((d) => chains.get(d).filter((g) => !isDone(g))).filter((p) => p.length);
  branches = paths.map((p) => p[0]);
  const slots = slotOffsets(branches.length);
  const UH = portrait ? 230 : 250;
  let maxY = you.ty, minX = you.tx - you.tw / 2, maxX = you.tx + you.tw / 2;
  paths.forEach((p, j) => {
    const [s, dx, dy] = slots[j];
    const g = p[0], L = landing(keyOf(g), g);
    L.role = 'branch'; L.tw = LW;
    L.tx = you.tx + s * (you.tw / 2 + dx + L.tw / 2); L.ty = you.ty + dy;
    minX = Math.min(minX, L.tx - L.tw / 2); maxX = Math.max(maxX, L.tx + L.tw / 2); maxY = Math.max(maxY, L.ty);
    const st = stairFor(g); st.role = 'branch'; st.loKey = youKey;
    // The rest of this domain's ladders wait higher up the same column: out of reach for now.
    p.slice(1).forEach((u, k) => {
      const U = landing(keyOf(u), u);
      U.role = k < 3 ? 'upper' : 'none'; U.tw = UW;
      U.tx = L.tx; U.ty = L.ty + (k + 1) * UH;       // tidy columns: each path keeps climbing above its landing
      if (k < 3) maxY = Math.max(maxY, U.ty);
    });
  });
  fanCx = (minX + maxX) / 2;
  topY = maxY + (portrait ? 380 : 420);
  for (const L of landings.values()) {
    if (!L.placed || snap) { L.x = L.tx; L.y = L.ty; L.w = L.tw; L.vx = L.vy = 0; L.placed = true; }
  }
  if (aimed && !branches.includes(aimed)) aimed = null;
  if (latched && !branches.includes(latched)) latched = null;
}

// Geometry of a staircase in its docked pose: lower end A on the landing below, pivot B on its own landing.
// One step per lesson; the top step sits flush with the landing, so finishing the last lesson walks you onto it.
// A staircase swings by turning (yaw) about a vertical axis through its pivot: parked, it is turned away into
// the depth of the tower; docked, it lies across the shaft.
function stairGeom(st) {
  const up = landings.get(st.upKey);
  if (!up) return null;
  const lo = landings.get(st.loKey);
  if (!lo) return null;
  const s = up.tx >= lo.tx ? 1 : -1;
  const A = { x: lo.x + s * lo.w / 2, y: lo.y }, B = { x: up.x - s * up.w / 2, y: up.y };
  const park = -s * PARK;
  const n = st.g.children.length;
  const run = (B.x - A.x) / n, rise = (B.y - A.y) / n;
  return { A, B, n, run, rise, park, zc: LD / 2 };
}
const parkYaw = (st) => stairGeom(st)?.park ?? PARK;

// ═══════════════════════ Sprites (cached once) ═══════════════════════
function radialSprite(col, a0, size = 128) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), r = size / 2;
  const gr = g.createRadialGradient(r, r, 0, r, r, r);
  gr.addColorStop(0, rgba(col, a0)); gr.addColorStop(0.45, rgba(col, a0 * 0.45)); gr.addColorStop(1, rgba(col, 0));
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  return c;
}
const GLOW = radialSprite(C.sun, 0.55);
const HALO = radialSprite(mixc(C.sun, C.foam, 0.3), 0.6);
const SHADE = (() => { // soft contact shadow under a slab on the wall
  const c = document.createElement('canvas'); c.width = 8; c.height = 32;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 32);
  gr.addColorStop(0, 'rgba(3,12,32,0.55)'); gr.addColorStop(1, 'rgba(3,12,32,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 8, 32); return c;
})();

// Masonry tile for the back wall, re-rendered when the scale changes.
let wallPattern = null, wallTileW = 1, wallTileH = 1, sideShade = null;
function buildWall() {
  const BW = 120, BH = 48, cols = 6, rows = 6;
  const pw = Math.max(1, Math.round(BW * cols * K * DPR)), ph = Math.max(1, Math.round(BH * rows * K * DPR));
  const c = document.createElement('canvas'); c.width = pw; c.height = ph;
  const g = c.getContext('2d');
  g.fillStyle = rgba(WALL); g.fillRect(0, 0, pw, ph);
  const r = rng(99);
  const bw = pw / cols, bh = ph / rows;
  for (let j = 0; j < rows; j++) {
    for (let i = -1; i <= cols; i++) {
      const x = (i + (j % 2) * 0.5) * bw, y = j * bh;
      const v = r();
      g.fillStyle = v < 0.5 ? `rgba(255,255,252,${(0.004 + v * 0.014).toFixed(3)})` : `rgba(3,12,32,${((v - 0.5) * 0.07).toFixed(3)})`;
      g.fillRect(x + 1, y + 1, bw - 2, bh - 2);
    }
  }
  g.fillStyle = 'rgba(3,12,32,0.2)';
  for (let j = 0; j < rows; j++) {
    g.fillRect(0, Math.round(j * bh), pw, Math.max(1, Math.round(DPR)));
    for (let i = 0; i <= cols; i++) g.fillRect(Math.round((i + (j % 2) * 0.5) * bw), Math.round(j * bh), Math.max(1, Math.round(DPR)), Math.round(bh));
  }
  wallPattern = ctx.createPattern(c, 'repeat'); wallTileW = pw; wallTileH = ph;
  // The shaft's side walls fall into shadow.
  const s = document.createElement('canvas'); s.width = Math.max(1, Math.round(VW * DPR)); s.height = 4;
  const sg = s.getContext('2d'), gr = sg.createLinearGradient(0, 0, s.width, 0);
  gr.addColorStop(0, 'rgba(3,12,32,0.55)'); gr.addColorStop(0.14, 'rgba(3,12,32,0)'); gr.addColorStop(0.86, 'rgba(3,12,32,0)'); gr.addColorStop(1, 'rgba(3,12,32,0.55)');
  sg.fillStyle = gr; sg.fillRect(0, 0, s.width, 4); sideShade = s;
}
function rng(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ═══════════════════════ Resize ═══════════════════════
let zonesCache = null;
function resize() {
  VW = innerWidth; VH = innerHeight; DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  OX = VW / 2; OY = VH / 2;
  const wasPortrait = portrait;
  portrait = VW / VH < 0.8; phone = VW < 640;
  LW = portrait ? 112 : 132; UW = portrait ? 72 : 84; LT = portrait ? 22 : 24;
  // Fit the fan (your landing + the branch landings and their labels) with room for the route and the chrome.
  const offs = slotOffsets(5);
  let minX = -LW / 2, maxX = LW / 2, maxY = 0;
  for (const [s, dx, dy] of offs) { const cx = s * (LW / 2 + dx + LW / 2); minX = Math.min(minX, cx - LW / 2 - 40); maxX = Math.max(maxX, cx + LW / 2 + 40); maxY = Math.max(maxY, dy); }
  const span = maxX - minX, height = maxY + 64;
  K = clamp(Math.min((VW - (phone ? 16 : 128)) / span, (VH * (portrait ? 0.42 : 0.37)) / height), 0.3, 1.1);
  HOME = portrait ? 0.7 : 0.7;
  buildWall();
  zonesCache = null;
  if (landings.size) { if (wasPortrait !== portrait) { placeRoute(); layout(true); } else layout(true); }
}
addEventListener('resize', () => { resize(); snapCamera(); });

// ═══════════════════════ Camera ═══════════════════════
// Home frames your landing low-centre with the branches above. The pointer's height looks up or down the
// shaft (dead zone in the middle so aiming never moves the view). Critically damped, ~0.3 s.
const look = { off: 0, manual: 0, suppress: false, sx: 0, sy: 0 };
const groundCamY = () => (VH - 104 - OY) / K;                 // ground floor near the bottom edge
const topCamY = () => topY - (OY - 128 - 112 * K) / K;          // goal window fully in view below the top edge
const homeCamY = () => youL().y + (HOME * VH - OY) / K;
const homeCamX = () => fanCx;

    if (st.role === 'route') { if (phase === 'live') st.thT = 0; else if (phase === 'pre') st.thT = parkYaw(st); }
    else st.thT = (st.g === aimed || st.g === latched) ? 0 : parkYaw(st);
  }
  // ── stairs: swing physics (slightly under-damped: a heavy swing that settles)
  const W = reduceMotion ? 40 : 10, Z = reduceMotion ? 1 : 0.66;
  const sub = Math.max(1, Math.ceil(dt * 240)), h = dt / sub;
  for (const st of stairs.values()) {
    const wasDocked = Math.abs(st.th) < 0.06;
    for (let i = 0; i < sub; i++) { st.thv += (W * W * (st.thT - st.th) - 2 * Z * W * st.thv) * h; st.th += st.thv * h; }
    const isDocked = Math.abs(st.th) < 0.06 && st.thT === 0;
    if (isDocked && !wasDocked) st.dockedAt = now;
    if (st.thT !== 0) st.dockedAt = -1e9;
    // Steps light one by one, bottom to top, once the stair locks into place.
    st.steps.forEach((s, i) => {
      const on = st.thT === 0 && now > st.dockedAt + (reduceMotion ? 0 : 60 + i * 70) ? 1 : 0;
      s.lit += (on - s.lit) * (1 - Math.exp(-dt * (on ? 10 : 14)));
      if (s.flash > 0) s.flash = Math.max(0, s.flash - dt * 1.4);
    });
  }
  // ── landings glide to their slots (critically damped)
  const LWk = reduceMotion ? 40 : 7;
  for (const L of landings.values()) {
    for (let i = 0; i < sub; i++) {
      L.vx += (LWk * LWk * (L.tx - L.x) - 2 * LWk * L.vx) * h; L.x += L.vx * h;
      L.vy += (LWk * LWk * (L.ty - L.y) - 2 * LWk * L.vy) * h; L.y += L.vy * h;
    }
    L.w += (L.tw - L.w) * (1 - Math.exp(-dt * 8));
    const want = (L.role === 'route' || L.role === 'you') && (phase === 'live' || L.lit > 0) ? 1 : 0;
    L.lit += (want - L.lit) * (1 - Math.exp(-dt * 4));
    if (L.flash > 0) L.flash = Math.max(0, L.flash - dt * 1.2);
  }
  if (phase === 'pre') for (const L of landings.values()) L.lit = 0;
  if (markerPop < 1 && intro.fired.has('arrive')) markerPop = Math.min(1, markerPop + dt * 2.4);
  tickWalk(now);
  if (pendingUnlock && now >= pendingUnlock.at) {
    for (const key of pendingUnlock.keys) { const L = landings.get(key); if (L) L.flash = 0.8; }
    score.sfx('unlock'); bumpIntensity(0.12); pendingUnlock = null;
  }
  if (phase === 'intro' && intro.fired.has('branch') && !intro.fired.has('frontierLit')) {
    const st = aimed && stairs.get(aimed.id);
    if (st && Math.abs(st.th) < 0.06) { intro.fired.add('frontierLit'); if ((now - intro.start) / 1000 >= intro.silentUntil) score.sfx('unlock'); }
  }
  // ── camera
  if (phase === 'pre') { cam.x = homeCamX(); cam.y = groundCamY(); }
  else if (phase === 'intro') springCam(dt, introCam.x, introCam.y, 6, reduceMotion ? 40 : 9);
  else {
    const acting = hovered && (hovered.type === 'step' || hovered.landing.role === 'branch' || hovered.landing.role === 'you');
    const frozen = cardOpen || pointer.overUI || (acting && pointer.usable);
    if (!frozen) look.off = lookOffset();
    let ty = homeCamY() + look.off + look.manual;
    ty -= dodge; // keep the open lesson's step clear of the card
    ty = clamp(ty, groundCamY(), topCamY());
    springCam(dt, homeCamX(), ty, 6, reduceMotion ? 40 : 14);
    // Draughts as the view travels up or down the shaft (with hysteresis so it never chatters).
    const rel = (cam.y - homeCamY()) * K / VH;
    const mode = rel > 0.35 ? 1 : rel < -0.3 ? -1 : (Math.abs(rel) < 0.15 ? 0 : wasLooking);
    if (mode !== wasLooking) { if (mode === 1) score.sfx('zoomIn'); else if (mode === -1) score.sfx('zoomOut'); wasLooking = mode; }
    bump = Math.max(0, bump - dt * 0.05);
    const it = liveIntensity();
    if (Math.abs(it - lastIntensity) > 0.03) { lastIntensity = it; score.setIntensity(it, 2); }
  }
  return t;
}
function measureDodge() {
  // Once per open: if the lesson's step would sit under the card, lift the view just enough to clear it.
  dodgePending = false;
  const h = hits.find((x) => x.type === 'step' && x.lesson === cardLesson);
  if (!h) return;
  const r = card.el.getBoundingClientRect(), top = r.top - 16; // the card is still easing up 16px
  let x0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = 0; i < h.poly.length; i += 2) { x0 = Math.min(x0, h.poly[i]); x1 = Math.max(x1, h.poly[i]); y1 = Math.max(y1, h.poly[i + 1]); }
  if (x1 > r.left - 16 && x0 < r.right + 16 && y1 > top - 24) dodge += (y1 - (top - 32)) / K;
}

function frame(real) {
  requestAnimationFrame(frame);
  try { render(real); } catch (err) { console.error(err); }
}
function render(real) {
  const f0 = performance.now();
  const dt = Math.min(0.05, Math.max(0.001, (real - last) / 1000)); last = real;
  const now = clock();
  // Hover is resolved against last frame's geometry, before anything moves (feedback within a frame).
  const usable = phase === 'live' && pointer.in && pointer.usable && !pointer.overUI && !cardOpen;
  hovered = forcedHover ? forcedHover() : usable ? hitTest(pointer.x, pointer.y, 28) : null;
  if (hovered?.type === 'landing' && (hovered.landing.role === 'ground')) hovered = null;
  const hk = hitKey(hovered);
  if (hk !== lastHoverKey) {
    const quiet = !hovered || hovered.type === 'landing' && hovered.landing.role === 'upper';
    if (!quiet && now - pointer.lastMove < 160 && pointer.speed < 0.9 && Math.abs(cam.vy) * K < 260 && now - lastHoverSfx > 90) { score.sfx('hover'); lastHoverSfx = now; }
    lastHoverKey = hk;
  }
  updateAim();
  const t = update(dt, now);
  const clickable = hovered && (hovered.type === 'step' || hovered.landing.role === 'branch' || hovered.landing.role === 'you');
  cv.style.cursor = clickable ? 'pointer' : pointer.dragging ? 'grabbing' : 'default';

  // ── draw
  hits.length = 0; labelRects = [];
  drawWall();
  drawTop(t);
  const order = [...landings.values()];
  for (const L of order) if (L.role !== 'ground' && L.role !== 'none') drawLandingBack(L);
  drawGround();
  const all = [...stairs.values()];
  const rank = (st) => (st.role === 'branch' ? (st.g === aimed || st.g === latched ? 3 : 1) : 2);
  all.sort((a, b) => rank(a) - rank(b));
  for (const st of all) drawStair(st, now, t);
  for (const L of order) if (L.role !== 'ground' && L.role !== 'none') drawLanding(L);
  outlineHovered();
  if (phase === 'live' || intro.fired.has('arrive')) drawBranchLabels();
  drawMarker(now, t);

  // ── overlays
  if (dodgePending && cardOpen) measureDodge();
  if (hovered && !cardOpen && phase === 'live') showTip(hovered);
  else if (tipFor) hideTip();
  if (phase === 'live') setStatus(route.length, stats.mastered);

  const ms = performance.now() - f0;
  perf.n++; perf.ms += ms; perf.worst = Math.max(perf.worst, ms);
  if (params.has('debug')) document.body.dataset.dbg = [phase, cam.y.toFixed(0), aimed?.label, hk].join(' | ');
}

// ═══════════════════════ Boot ═══════════════════════
resize();
placeRoute();
layout(true);
marker.at = { kind: 'landing', key: youKey };
for (const st of stairs.values()) { st.th = st.thT = parkYaw(st); }
snapCamera(); cam.y = groundCamY();
setStatus(0, 0);
requestAnimationFrame(frame);
document.fonts?.load(`700 13px ${BODY}`);

// ═══════════════════════ QA hooks ═══════════════════════
function stepHit(label) { return hits.find((h) => h.type === 'step' && h.lesson.label === label); }
function centreOf(h) { let x = 0, y = 0; const n = h.poly.length / 2; for (let i = 0; i < h.poly.length; i += 2) { x += h.poly[i]; y += h.poly[i + 1]; } return [x / n, y / n]; }
function runDemo() {
  if (!demo) { const a = parseInt(params.get('aim')); if (Number.isFinite(a) && branches[a]) setAim(branches[a], true); return; }
  const byDomain = (i) => branches.find((g) => g.domain.index === i);
  if (demo === 'hover') {
    const g = byDomain(1) || aimed; setAim(g, true);
    forcedHover = () => { const f = frontierOf(g); return f ? stepHit(f.label) || null : null; };
  } else if (demo === 'swing') {
    setTimeout(() => setAim(byDomain(4) || branches[branches.length - 1]), 300);
  } else if (demo === 'complete') {
    const g = byDomain(1) || aimed; setAim(g, true);
    setTimeout(() => { card.open(frontierOf(g)); card.el.querySelector('.actions .kg-btn.primary')?.click(); }, 900);
  } else if (demo === 'floor') {
    const g = aimed;
    setTimeout(() => { card.open(frontierOf(g)); card.el.querySelector('.actions .kg-btn.primary')?.click(); }, 900);
  } else if (demo === 'top') { look.manual = 1e6; clampManual(); }
  else if (demo === 'route') { look.manual = -1e6; clampManual(); }
}
window.__stairs = {
  graph, cam, perf, score, landings, stairs, hits, look,
  get phase() { return phase; }, get aimed() { return aimed?.label; }, get branches() { return branches.map((g) => g.label); },
  get route() { return route.map((g) => g.label); }, get K() { return K; },
  aim: (i) => setAim(branches[i]),
  landingScreen: (label) => { const g = ladders.find((x) => x.label === label); const L = g && landings.get(keyOf(g)); return L ? [SX(L.x), SY(L.y) - LD * TILT * K * 0.5] : null; },
  stepScreen: (label) => { const h = stepHit(label); return h ? centreOf(h) : null; },
  frontierScreen: () => { const f = aimed && frontierOf(aimed); const h = f && stepHit(f.label); return h ? centreOf(h) : null; },
};
</script>
